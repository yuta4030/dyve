<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ボード</title>
<style>
:root {
  /* いつもダーク。強調色は彩度を落として目立たせすぎない（アリスの案 p1u） */
  color-scheme: dark;
  --bg: #0f1113; --card: #181a1e; --ink: #d4d7dc; --mute: #7d838b; --line: #2a2e34;
  --accent: #6f86b3; --accent-soft: #1a2130; --warn: #d8995a; --warn-soft: #2e2318; --ok: #6fb38a;
  --radius: 10px; --gap: 10px; --row: 44px;
}
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
html, body { height: 100%; }
body { margin: 0; height: 100dvh; overflow: hidden; background: var(--bg); color: var(--ink);
       font: 15px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
button { font: inherit; font-size: 13px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px;
         padding: 3px 10px; cursor: pointer; min-height: 30px; }
button:hover { border-color: var(--mute); }
button.primary { background: var(--accent-soft); border-color: var(--line); color: var(--ink); }
button.icon { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 26px; padding: 0 6px; border-color: transparent; background: transparent; color: var(--mute); }
button.icon:hover { color: var(--ink); border-color: var(--line); }
button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
a { color: var(--accent); }
.empty { color: var(--mute); text-align: center; margin: 8% 8px 0; font-size: 14px; }

/* ── 画面は全部パネル。並べ方と大きさはボードの view layout のパネルに持つ（.tile は画面に並ぶパネルの枠）── */
/* ダッシュボードは上下左右に広がるキャンバス。一画面がます目の細かさ（--cols）の列ぶん。並べたものの外にも一画面ぶんの余白を持ち、そこへ動かせば広がる */
#grid { --cols: 24; --colw: 40px; --span: 24; --rows: 40; position: relative; height: 100%; overflow: auto; padding: var(--gap); display: grid; gap: var(--gap);
        grid-template-columns: repeat(var(--span), var(--colw)); grid-template-rows: repeat(var(--rows), var(--row));
        grid-auto-columns: var(--colw); grid-auto-rows: var(--row); }
/* 動かしているあいだだけ、ます目を薄く見せる */
#grid.editing { background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% calc(var(--row) + var(--gap)); background-position: 0 calc(var(--gap) - 1px); background-attachment: local; }
.tile { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0;
        background: color-mix(in srgb, var(--card) 55%, var(--bg)); border: 1px solid var(--line); border-radius: var(--radius); }
.tile[hidden] { display: none; }
.tile.dragging { opacity: .6; outline: 2px dashed var(--accent); }
.tile-head { flex: none; display: flex; align-items: center; gap: 6px; padding: 2px 8px 0 6px; min-height: 28px;
             font-size: 12px; color: var(--mute); cursor: grab; user-select: none; touch-action: none; }
.tile-head h2 { margin: 0; font-size: 12px; font-weight: 600; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tile-head h2[data-goto] { cursor: pointer; }
.tile-head h2[data-goto]:hover { color: var(--ink); }
.tile-head .grip { letter-spacing: -2px; opacity: .5; }
.tile-head .badge { color: var(--accent); }
.tile-head .ctl { margin-left: auto; display: flex; align-items: center; gap: 0; cursor: default; }
.tile-head .ctl button { display: inline-flex; align-items: center; justify-content: center; min-height: 22px; padding: 0 5px; font-size: 12px; opacity: .35; transition: opacity .15s; }
.tile:hover .tile-head .ctl button, .tile-head .ctl button:focus-visible, .tile-head .ctl button[aria-expanded="true"] { opacity: 1; }
@media (hover: none) { .tile-head .ctl button { opacity: 1; } }
.tile-head .lockmark { display: none; color: var(--mute); }
.tile.locked .tile-head .lockmark { display: inline-flex; }
.tile.locked .tile-head { cursor: default; }
.tile.locked .tile-head .grip { visibility: hidden; }
.tile.locked .sizer { display: none; }
/* 畳んだパネル：見出しだけ残す */
.tile.folded .tile-body, .tile.folded .sizer, .tile.folded .opts { display: none; }
/* 枠の歯車：奥まった設定 */
.tile-head [data-ctl="menu"] svg { vertical-align: -2px; }
.opts { position: absolute; z-index: 5; top: 28px; right: 6px; min-width: 190px; display: flex; flex-direction: column; gap: 6px;
        padding: 8px 10px; font-size: 12px; color: var(--mute); background: var(--card); border: 1px solid var(--line); border-radius: 8px;
        box-shadow: 0 6px 24px rgb(0 0 0 / .35); }
.opts[hidden] { display: none; }
.opts .row { display: flex; align-items: center; gap: 4px; }
.opts .row > span:first-child { flex: 1; }
.opts button { min-height: 24px; padding: 0 8px; font-size: 12px; }
.opts .zoom { width: 4.2em; font: inherit; font-size: 12px; text-align: right; color: var(--ink); background: var(--bg);
              border: 1px solid var(--line); border-radius: 6px; padding: 1px 4px; }
.opts select { font: inherit; font-size: 12px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 4px; }
.tile-body { position: relative; flex: 1; min-height: 0; overflow-y: auto; padding: 4px 10px 10px; }
.sizer { position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; touch-action: none;
         background: linear-gradient(135deg, transparent 55%, var(--mute) 55%, var(--mute) 62%, transparent 62%, transparent 75%, var(--mute) 75%, var(--mute) 82%, transparent 82%);
         opacity: .5; border-bottom-right-radius: var(--radius); }
.sizer:hover { opacity: 1; }
@media (max-width: 760px) {
  #grid { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-auto-columns: auto; overflow-x: hidden; }
  .tile { grid-column: 1 / -1 !important; grid-row: span var(--h) !important; }
  #map { display: none !important; }
}
/* 全体マップ：右下に小さく。並んだパネルの置き場所といま見ているところを描き、押すとそこへ行く */
#map { position: fixed; right: 14px; bottom: 14px; z-index: 6; display: flex; flex-direction: column; gap: 4px; padding: 6px;
       background: color-mix(in srgb, var(--card) 88%, transparent); border: 1px solid var(--line); border-radius: 8px;
       box-shadow: 0 4px 16px rgb(0 0 0 / .25); opacity: .75; transition: opacity .15s; }
#map:hover, #map:focus-within { opacity: 1; }
#map .world { position: relative; width: 168px; height: 110px; cursor: pointer; touch-action: none; }
#map .world > span { position: absolute; border-radius: 2px; background: color-mix(in srgb, var(--mute) 45%, transparent); }
#map .world > span.tools { background: color-mix(in srgb, var(--ink) 55%, transparent); }
#map .world > span.badge { background: var(--accent); }
#map .world > .view { background: none; border: 1.5px solid var(--accent); border-radius: 3px; pointer-events: none; }
#map .bar { display: flex; justify-content: flex-end; }
#map .bar button { min-height: 22px; padding: 0 6px; font-size: 11px; }

/* トーク：発言の流れと入力 */
.tile[data-tile="talk"] .tile-body { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
#timeline { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 10px; display: flex; flex-direction: column; gap: 6px; }
#input { flex: none; border-top: 1px solid var(--line); padding: 6px 10px 8px; display: flex; flex-direction: column; gap: 6px; }
#msg { width: 100%; resize: none; min-height: 36px; max-height: 30vh; font: inherit; color: var(--ink); background: var(--card);
       border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 10px; }
#msg:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#input .bar { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--mute); }
#input .bar .grow { flex: 1; min-width: 0; }
#input label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
#err { color: var(--warn); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 状況：頭文字のアイコン。動いているあいだは輪が回る */
#status { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
.ava { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; width: 46px; min-height: 0; padding: 0;
       border: none; background: none; color: var(--mute); font-size: 11px; }
/* アイコンは状況とトークで同じもの（ini()）。大きさだけ変える */
.ini { position: relative; flex: none; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
       border: 2px solid var(--line); background: var(--card); color: var(--ink); font-size: 14px; font-weight: 600; }
.ini.sm { width: 20px; height: 20px; border-width: 1px; font-size: 10px; }
.ava.busy { color: var(--ink); }
.ava.busy .ini { border-color: var(--accent-soft); color: var(--accent); }
.ava.busy .ini::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid transparent;
                        border-top-color: var(--accent); animation: spin .9s linear infinite; }
.ava.wait .ini { border-style: dashed; border-color: var(--mute); }
button.ava { cursor: pointer; }
.ava.to { color: var(--accent); }
.ava.to .ini { border-color: var(--accent); background: var(--accent-soft); }
#to { border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 1px 10px; font-size: 12px; }
dv-panel .meta .to { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); }
dv-panel .meta .to .ini { border-color: var(--accent); color: var(--accent); }
/* トーク：宛てた相手の返事は、その発言のすぐ下に */
.reply { display: flex; align-items: flex-start; gap: 6px; width: 100%; min-height: 0; margin: -2px 0 0 14px; padding: 2px 4px; border: none; background: none;
         text-align: left; font-size: 13px; color: var(--ink); }
.reply .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; padding-top: 1px; }
.reply.wait .t { color: var(--mute); }
.reply:hover .t { text-decoration: underline; }
.topics { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.topics button { min-height: 0; padding: 0 6px; border: 1px solid var(--line); border-radius: 999px; background: none; font-size: 11px; color: var(--mute); }
.topics button:hover { color: var(--ink); }
/* 話題：話題の欄のまとまりの頭になる */
dv-panel .meta .topic-title { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 15px; font-weight: 700; color: var(--ink); }
dv-topic p { margin: 2px 0 0; color: var(--mute); }
#doing { width: 100%; margin: 4px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--mute); }
#doing li { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spin { flex: none; display: inline-block; width: 11px; height: 11px; border-radius: 50%;
        border: 2px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin, .ava.busy .ini::after { animation: none; } .ava.busy .ini { border-color: var(--accent); } }

/* 残量 */
.meter { margin-bottom: 8px; font-size: 13px; }
.meter .row { display: flex; justify-content: space-between; gap: 8px; }
.meter .row .when { color: var(--mute); font-size: 12px; }
.meter .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 2px; }
.meter .bar > span { display: block; height: 100%; background: var(--ok); }
.meter.low .bar > span { background: var(--warn); }

/* dyve 設定：アイコンの並び */
#tools { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
#tools .acts { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
#tools .ib { display: inline-grid; place-items: center; width: 32px; height: 32px; min-height: 0; padding: 0; border-radius: 8px;
             border: 1px solid var(--line); background: var(--card); color: var(--ink); text-decoration: none; }
#tools .ib:hover { border-color: var(--mute); }
#tools .ib[hidden] { display: none; }
#tools select { font: inherit; font-size: 12px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; max-width: 14em; }
/* この dyve について：押したときだけ出る */
#infoPop { width: min(560px, calc(100vw - 32px)); max-height: 80vh; overflow: auto; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--ink); font-size: 13px; }
#infoPop h3 { margin: 10px 0 4px; font-size: 13px; }
#infoPop h3:first-child { margin-top: 0; }
#infoPop dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 0; }
#infoPop dt { color: var(--mute); }
#infoPop dd { margin: 0; overflow-wrap: anywhere; }
#infoPop .word { display: flex; gap: 8px; align-items: center; padding: 2px 0; }
#infoPop .word .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
#infoPop .word small { color: var(--mute); }
#infoPop form { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
#infoPop input { flex: 1 1 8em; min-width: 0; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
#infoPop .warn { color: var(--warn, #b45309); }
/* パネルの絵を撮るとき：その一枚だけ */
body.shot { display: block; height: auto; overflow: auto; padding: 12px; }
body.shot #grid, body.shot #map { display: none; }

#toolsMore { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 6px; }
#toolsMore svg, .opts [data-ctl="lock"] svg { vertical-align: -2px; }
/* 話題の欄：話題ごと（話題がなければ元の発言ごと）のまとまり */
.group { margin-bottom: 14px; }
.group > .src { display: block; width: 100%; min-height: 0; padding: 0 2px; margin-bottom: 4px; border: none; background: none; text-align: left;
                font-size: 12px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.group > .src:hover { color: var(--ink); }
.group > .items { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
.group > .items > dv-panel { flex: none; width: 100%; max-width: 100%; min-width: 200px; min-height: 0; resize: both; overflow: auto; }
/* 話題ひとつの枠：並んだ枠がそのまま枠になるので、パネルの枠と見出しのタイトルは出さない */
.group.solo { margin: 0; }
.group.solo > .items > dv-panel { border: none; background: none; padding: 0; resize: none; overflow: visible; }
.group.solo > .items > dv-panel > .meta .topic-title { display: none; }
iframe.uview { display: block; width: 100%; border: 0; background: transparent; }
.src-line { margin: 2px 0 4px; font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--mute); overflow-wrap: anywhere; }
/* 畳む：見出しの一行だけにする。済みの仕事と話題は、見る人が決めていなければ畳む。押すと開く */
dv-panel.folded > :not(.meta) { display: none; }
dv-panel.folded { height: auto !important; padding-block: 4px; resize: none; opacity: .75; }
dv-panel .fold { color: var(--mute); }
.hl { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: var(--radius); }

dv-panel { display: block; position: relative; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
dv-panel .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-size: 12px; color: var(--mute); min-height: 22px; }
dv-panel .meta .who { font-weight: 600; }
/* 狭いパネルでも見出しの字を縦に割らない。入りきらない分は次の行へ回す */
dv-panel .meta > :not(.topic-title), dv-panel .meta .tools > * { white-space: nowrap; }
dv-panel .meta .tools { flex-wrap: wrap; justify-content: flex-end; }
dv-panel .meta .tools { margin-left: auto; display: flex; gap: 2px; opacity: .35; transition: opacity .15s; }
dv-panel:hover > .meta .tools, dv-panel:focus-within > .meta .tools { opacity: 1; }
@media (hover: none) { dv-panel .meta .tools { opacity: 1; } }
dv-panel .kids { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
dv-panel .kids:empty { display: none; }
/* 話題の中も画面と同じます目：見出しをつまんで好きな場所へ、右下の角で大きさ。重なったら動かした方を優先して下へずらす。
   大きさを決めていないパネルは中身の高さだけ占める。置き場所は見る人のブラウザに覚える */
dv-panel .kids.free { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); grid-template-rows: none; grid-auto-rows: var(--row); gap: var(--gap); }
dv-panel .kids.free.editing { background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% calc(var(--row) + var(--gap)); background-position: 0 calc(var(--gap) / -2); }
.kids.free > .cell { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.kids.free > .cell.auto { align-self: start; }
.kids.free > .cell > dv-panel { flex: 1; min-height: 0; overflow: auto; }
.kids.free > .cell.auto > dv-panel { flex: none; overflow: visible; }
.kids.free > .cell > dv-panel > .meta { cursor: grab; touch-action: none; user-select: none; }
.kids.free > .cell.dragging { z-index: 2; opacity: .6; outline: 2px dashed var(--accent); outline-offset: 1px; border-radius: var(--radius); }
.kids.free > .cell > .sizer { opacity: 0; transition: opacity .15s; }
.kids.free > .cell:hover > .sizer { opacity: .5; }
.kids.free > .cell > .sizer:hover { opacity: 1; }
@media (hover: none) { .kids.free > .cell > .sizer { opacity: .5; } }
.kids.free > .cell.folded > .sizer { display: none; }
/* 順番の組（rel sequence）：左上に番号 */
.kids.free > .cell[data-step]::before { content: attr(data-step); position: absolute; z-index: 1; top: -6px; left: -6px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--accent-soft); border: 1px solid var(--accent); color: var(--ink); font-size: 11px; line-height: 16px; text-align: center; pointer-events: none; }
@media (max-width: 760px) {
  dv-panel .kids.free { grid-template-columns: minmax(0, 1fr); grid-auto-rows: auto; }
  .kids.free > .cell { grid-column: 1 / -1 !important; grid-row: auto !important; }
  .kids.free > .cell > .sizer { display: none; }
}
dv-panel dv-panel { background: color-mix(in srgb, var(--card) 70%, var(--bg)); }
dv-panel.human { border-left: 3px solid var(--ink); }
dv-panel.pinned { box-shadow: inset 0 0 0 1px var(--ink); }
#timeline dv-panel { padding: 4px 10px 6px; cursor: pointer; }
#timeline dv-panel .meta { min-height: 18px; }
#timeline dv-panel .meta .who { display: none; }
#summary dv-panel { border: none; background: none; padding: 0; }
#summary dv-panel > .meta .who { display: none; }
dv-summary .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 4px 16px; }
dv-summary h3 { margin: 0 0 2px; font-size: 12px; font-weight: 600; color: var(--mute); }
dv-summary ul { margin: 0; padding-left: 1.1em; }
.refs { display: inline-flex; align-items: center; gap: 4px; }
/* 印：色だけに頼らず、線と記号でも見分ける */
dv-panel.notice { border-color: var(--accent); background: linear-gradient(var(--accent-soft), var(--accent-soft)) top / 100% 3px no-repeat, var(--card); }
dv-panel.untouched { border-style: dashed; border-color: var(--mute); }
dv-panel.waiting { border: 3px double var(--warn); }
.mark { font-size: 12px; padding: 0 6px; border-radius: 4px; }
.mark.notice { color: var(--accent); background: var(--accent-soft); }
.mark.untouched { color: var(--mute); border: 1px dashed var(--mute); }
.mark.waiting { color: var(--warn); background: var(--warn-soft); }
.mark.done { color: var(--ok); }
.body { white-space: pre-wrap; overflow-wrap: anywhere; }
.body ul { margin: 0; padding-left: 1.2em; white-space: normal; }
.body table { border-collapse: collapse; font-size: 13px; width: 100%; white-space: normal; display: block; overflow-x: auto; }
.body th, .body td { border: 1px solid var(--line); padding: 3px 6px; text-align: left; vertical-align: top; }
.body pre { margin: 0; font-size: 12px; overflow-x: auto; }
.orig { margin-top: 6px; font-size: 13px; color: var(--mute); border-left: 2px solid var(--line); padding-left: 8px; white-space: pre-wrap; }
.task-to { color: var(--mute); font-size: 13px; }
.ask > summary { cursor: pointer; color: var(--mute); font-size: 13px; display: flex; gap: 8px; align-items: baseline; }
.ask > .body { margin-top: 4px; }
</style>
</head>
<body>
<main id="grid">
  <section class="tile" data-tile="talk">
    <div class="tile-body">
      <div id="timeline"></div>
      <div id="input">
        <textarea id="msg" rows="1"></textarea>
        <div class="bar">
          <button id="mic" aria-pressed="false" hidden></button>
          <button id="to" hidden></button>
          <span class="grow"><span id="err" role="status"></span></span>
          <button id="send" class="primary"></button>
        </div>
      </div>
    </div>
  </section>
  <section class="tile" data-tile="summary"><div class="tile-body" id="summary"></div></section>
  <section class="tile" data-tile="status"><div class="tile-body"><div id="status" aria-live="polite"></div></div></section>
  <section class="tile" data-tile="quota"><div class="tile-body" id="quota"></div></section>
  <section class="tile" data-tile="tools">
    <div class="tile-body">
      <div id="tools">
        <div class="acts">

  if (mark) tags.push(`<span class="mark ${mark}">${L.mark[mark]}</span>`);
  if (p.to) tags.push(`<span class="to">→ ${ini(p.to, "sm")}${esc(callOf(p.to))}</span>`);
  if (p.state === "done") tags.push(`<span class="mark done">${L.state.done}</span>`);
  else if (p.state && !mark) tags.push(`<span class="mark">${L.state[p.state]}</span>`);
  const edited = p.rev !== p.seq && p.view === "say";
  if (folded && isDone(p)) tags.push(`<span class="fold">${esc(L.folded(descOf(p.id, kids).filter((x) => !isPerson(x.by)).length))}</span>`);
  const feed = S.feeds[p.id];
  const data = feed?.data !== undefined ? feed.data : p.data;
  if (p.source && feed?.running) tags.push(`<span class="spin" role="img" aria-label="${esc(L.running)}"></span>`);
  const head = p.view === "topic"
    ? `<span class="topic-title" title="${esc(`${topicTitle(p)}（${who(p.by)}）`)}">${esc(topicTitle(p))}</span>`
    : `<span class="who">${esc(who(p.by))}</span>`;
  el.innerHTML = `<div class="meta">${head}${tags.join("")}
    ${p.state === "proposal" ? `<button data-act="accept">${L.accept}</button>` : ""}
    ${p.source && !feed?.approved ? `<button data-act="allow" title="${esc(L.allowTitle)}">${L.allow}</button>` : ""}
    <span class="tools">
      ${edited ? `<button class="icon" data-act="orig">${L.orig}</button>` : ""}
      ${p.view === "say" && S.panels.some((x) => x.into === p.id) ? `<button class="icon" data-act="split" title="${esc(L.splitTitle)}">${L.split}</button>` : ""}
      ${SIZES[p.id] ? `<button class="icon" data-act="unsize">${L.resetSize}</button>` : ""}
      ${p.view === "topic" && kids(p.id).some((k) => TPOS[k.id]) ? `<button class="icon" data-act="unpos">${L.resetPos}</button>` : ""}
      ${p.source && feed?.approved ? `<button class="icon" data-act="runnow">${L.runNow}</button>` : ""}
      ${p.view !== "say" && p.about && !(LAYOUT.out || []).includes(p.id) ? `<button class="icon" data-act="out">${L.takeOut}</button>` : ""}
      ${foldable ? `<button class="icon" data-act="fold" aria-pressed="${folded}" title="${folded ? L.unfold : L.fold}" aria-label="${folded ? L.unfold : L.fold}">${folded ? ICON.restore : ICON.min}</button>` : ""}
      <button class="icon" data-act="pin" aria-pressed="${!!p.pinned}" title="${p.pinned ? L.unpin : L.pin}" aria-label="${p.pinned ? L.unpin : L.pin}">${ICON.pin}</button>
      <button class="icon" data-act="drop" title="${L.drop}" aria-label="${L.drop}">${ICON.drop}</button>
    </span></div>`;
  // 流し込むコマンドは、何を走らせるかが見えるように出しておく
  if (p.source) {
    const line = document.createElement("div");
    line.className = "src-line";
    const when = feed?.error ? `⚠ ${feed.error}` : feed?.at ? L.ranAt(new Date(feed.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })) : "";
    line.textContent = `$ ${p.source.shell}　${p.source.every ? L.every(p.source.every) : L.once}${when ? `　${when}` : ""}`;
    el.append(line);
  }
  if (isUserView(p.view)) {
    el.append(userFrame(p, data));
  } else {
    const view = document.createElement(viewTag(p.view));
    view.panel = p;
    view.data = data;
    el.append(view);
  }
  const box = document.createElement("div");
  box.className = p.view === "topic" ? "kids free" : "kids";
  for (const k of kids(p.id)) {
    const c = panelEl(k, kids);
    if (p.view !== "topic") { box.append(c); continue; }
    // 話題の中はます目の一つ分（cell）に入れ、右下に大きさの角を付ける
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.dataset.id = k.id;
    cell.dataset.view = k.view;
    const sizer = document.createElement("div");
    sizer.className = "sizer";
    sizer.title = L.size;
    cell.append(c, sizer);
    box.append(cell);
    FREE.observe(c);
  }
  el.append(box);
  return el;
}

// ── 話題の中のます目：画面と同じ決まりで並べる ──
// 置き場所のあるものはそこへ（重なったら下へずらす）、まだないものはその下の空いたところへ順に詰める
const cellsIn = (box) => [...box.children].filter((c) => c.matches(".cell"));
function freeGrid(box) {
  const cs = getComputedStyle(box);
  return { cols: cs.gridTemplateColumns.split(" ").length, rowH: parseFloat(cs.gridAutoRows) || 44, gap: parseFloat(cs.rowGap) || 0 };
}
// 比べる・順番の組（パネルの rel）。置いた人が付ける。組は横に並べ、組でないものは一枚ずつ。並びは置いた順
function relRows(kids) {
  const ids = new Set(kids.map((p) => p.id)), up = new Map(kids.map((p) => [p.id, p.id]));
  const root = (x) => { while (up.get(x) !== x) x = up.get(x); return x; };
  for (const p of kids) for (const w of p.rel?.with || []) if (ids.has(w)) up.set(root(p.id), root(w));
  const rows = new Map();
  for (const p of kids) {
    const r = root(p.id);
    if (!rows.has(r)) rows.set(r, []);
    rows.get(r).push(p);
  }
  return [...rows.values()];
}
// 話題の中の組：id -> { kind, ids, i }（一枚だけのものは入れない）
function relOf(box) {
  const out = {};
  for (const row of relRows(cellsIn(box).map((c) => panelById(c.dataset.id)).filter(Boolean))) {
    if (row.length < 2) continue;
    const kind = row.map((p) => p.rel?.kind).find(Boolean) || "compare", ids = row.map((p) => p.id);
    ids.forEach((id, i) => { out[id] = { kind, ids, i }; });
  }
  return out;
}
// 覚えた置き場所を当て、大きさを決めていないものは中身の高さを測ってます目に直す（幅を先に当ててから測る）
// 幅は中身の形から（表は列の数、文章は読みやすい幅）。組は一行に同じ幅で並べる
function freePos(box, g, rel = relOf(box)) {
  const colW = (box.clientWidth - g.gap * (g.cols - 1)) / g.cols;
  const toCols = (px) => clamp(Math.round((px + g.gap) / (colW + g.gap)), 2, g.cols);
  const toRows = (px) => Math.max(2, Math.round((px + g.gap) / (g.rowH + g.gap)));
  const pos = {};
  for (const c of cellsIn(box)) {
    const id = c.dataset.id, t = TPOS[id], d = sizeOf(c.dataset.view), p = panelById(id), r = rel[id];
    const share = r && g.cols >= r.ids.length * 2 ? Math.floor(g.cols / r.ids.length) : 0;
    const w = clamp(t?.w || share || toCols(p ? prefPx(p) : d.w || 360), 1, g.cols);
    c.dataset.rel = r ? r.kind : "";
    if (r?.kind === "sequence") c.dataset.step = String(r.i + 1); else delete c.dataset.step;
    const h = t?.h || (d.h ? toRows(d.h) : 0);
    pos[id] = { x: t ? clamp(t.x, 1, g.cols + 1 - w) : 1, y: t?.y || 1, w, h: h || 1, auto: !h || isFolded(id), placed: !!t, ...(r && share && !t ? { row: r } : {}) };
    c.classList.toggle("auto", pos[id].auto);
    c.style.gridColumn = `${pos[id].x} / span ${w}`;
  }
  for (const c of cellsIn(box)) {
    const p = pos[c.dataset.id];
    if (p.auto) p.h = Math.max(1, Math.ceil((c.offsetHeight + g.gap) / (g.rowH + g.gap)));
  }
  return pos;
}
// moved を優先し、置き場所のあるものを重ならないように下へずらす。まだないものは、その下で左上から空いたところへ
function arrange(pos, cols, moved = null) {
  const keys = Object.keys(pos);
  const set = keys.filter((k) => pos[k].placed || k === moved);
  stack(pos, [...(moved ? [moved] : []), ...set.filter((k) => k !== moved).sort(byPlace(pos))]);
  const y0 = Math.max(1, ...set.map((k) => pos[k].y + pos[k].h));
  const done = [...set];
  const free = (q) => !done.some((o) => overlap(q, pos[o]));
  for (const k of keys.filter((k) => !set.includes(k))) {
    if (done.includes(k)) continue;
    const p = pos[k];
    // 組（比べる・順番）は、まだ置いていないものだけで一行に並べる
    const row = p.row && p.row.ids.filter((id) => pos[id] && !done.includes(id) && pos[id].row);
    if (row?.length > 1) {
      const hh = Math.max(...row.map((id) => pos[id].h));
      find: for (let y = y0; ; y++) {
        let x = 1;
        for (const id of row) { if (!free({ ...pos[id], x, y, h: hh })) continue find; x += pos[id].w; }
        x = 1;
        for (const id of row) { Object.assign(pos[id], { x, y }); x += pos[id].w; done.push(id); }
        break;
      }
      continue;
    }
    find: for (let y = y0; ; y++) for (let x = 1; x + p.w <= cols + 1; x++) {
      if (free({ ...p, x, y })) { Object.assign(p, { x, y }); break find; }
    }
    done.push(k);
  }
  return pos;
}
function placeFree(box, pos) {
  for (const c of cellsIn(box)) {
    const p = pos[c.dataset.id];
    if (!p) continue;
    c.classList.toggle("auto", p.auto);
    c.classList.toggle("folded", isFolded(c.dataset.id));
    Object.assign(c.style, { gridColumn: `${p.x} / span ${p.w}`, gridRow: `${p.y} / span ${p.h}` });
  }
  box._pos = pos;
}
// 中身の高さが変わったら置き直す。畳まれて見えていない話題は測れないので、見えたときに置く
function layoutFree(box) {
  if (!box.isConnected || !box.offsetParent) return;
  const g = freeGrid(box);
  if (g.cols < 2) return;
  placeFree(box, arrange(freePos(box, g), g.cols));
}
const relayoutFree = () => { for (const b of $$(".kids.free")) layoutFree(b); };
const FREE = new ResizeObserver((es) => {
  for (const box of new Set(es.map((e) => e.target.closest(".kids.free")).filter(Boolean))) layoutFree(box);
  layoutSoon();
});
// 話題の中の高さが変わったら、枠の並びも次の絵で直す（動かしている最中は待つ）
let layoutRaf = 0;
const layoutSoon = () => { if (!layoutRaf) layoutRaf = requestAnimationFrame(() => { layoutRaf = 0; if (!$(".editing")) applyLayout(); }); };
// ます目の上の位置（話題の中）。文字の大きさ（zoom）が掛かっていても、見えている大きさで測る
const freeAt = (box, g) => (cx, cy) => {
  const r = box.getBoundingClientRect(), s = r.width / (box.clientWidth || r.width) || 1;
  const colW = (box.clientWidth - g.gap * (g.cols - 1)) / g.cols;
  return { x: Math.floor((cx - r.left) / ((colW + g.gap) * s)) + 1, y: Math.floor((cy - r.top) / ((g.rowH + g.gap) * s)) + 1 };
};

// 画面の上での親。仕事について置かれたもの（結果）は仕事の子にせず、仕事と並べて仕事の親（話題か発言）の直下に出す。
// データの about は仕事を指したままで、並べ方だけここで導く。親のない仕事の結果は、行き先がないので仕事の下のまま
function shownParent(p, byId) {
  let k = p.about;
  while (k && byId.has(k)) {
    const up = byId.get(k);
    if (up.view !== "task" || !up.about || !byId.has(up.about)) return k;
    k = up.about;
  }
  return null;
}
// 「使わない」にした view のパネルは画面に出さない。ただし人の判断を待っているもの（印）や、下に何か付いているものは落とさない
function shownPanels(panels, marks, off) {
  const parents = new Set(panels.map((p) => p.about));
  return panels.filter((p) => !off.has(p.view) || marks[p.id] || parents.has(p.id));
}
const offSet = () => new Set(Object.entries(S.panelSet?.views || {}).filter(([, v]) => v?.off).map(([k]) => k));
// パネルをたどれる形にする（並びは追加順）
function tree() {
  const byId = new Map(S.panels.map((p) => [p.id, p]));
  const by = new Map();
  for (const p of shownPanels(S.panels, S.marks, offSet())) {
    const k = shownParent(p, byId);
    if (!by.has(k)) by.set(k, []);
    by.get(k).push(p);
  }
  return (id) => by.get(id) || [];
}

// 人の発言はトークに、要点は要点に、それ以外は話題の欄に。どこに出すかはデータに持たず導く
function render() {
  FREE.disconnect();
  const kids = tree();
  const desc = (id) => kids(id).flatMap((k) => [k, ...desc(k.id)]);
  const top = kids(null);
  const isSay = (p) => isPerson(p.by) && p.view === "say";
  S.kids = kids;

  // トーク：いちばん下を見ていたときだけ追いかける
  const tl = $("#timeline");
  const follow = tl.scrollTop + tl.clientHeight >= tl.scrollHeight - 40;
  tl.innerHTML = "";
  // トークに出すのは人の発言だけ（人が置いたほかのパネルは自分の枠へ）
  const said = top.filter((p) => isSay(p) && !p.into); // 合流した発言は先頭に入っている
  if (!said.length) tl.innerHTML = `<p class="empty">${esc(L.emptyTalk)}</p>`;
  // 発言から出た仕事が束ねられている話題（data.from から導く）
  const topOf = (p) => { const seen = new Set(); while (p?.about && !seen.has(p.id)) { seen.add(p.id); p = S.panels.find((x) => x.id === p.about); } return p; };
  const fromOf = (p) => Array.isArray(p.data?.from) ? p.data.from : [];
  for (const p of said) {
    const el = panelEl(p, () => []);
    const d = desc(p.id);
    if (d.length) {
      const ms = d.map(markOf);
      const m = ms.includes("waiting") ? "waiting" : ms.includes("notice") ? "notice" : null;
      const r = document.createElement("span");
      r.className = `refs mark${m ? ` ${m}` : ""}`;
      r.innerHTML = `${d.some((x) => isWorking(x.id)) ? '<span class="spin" aria-hidden="true"></span>' : ""}${esc(L.refs(d.length))}${m ? ` ${L.markShort[m]}` : ""}`;
      $(".meta .who", el).after(r);
    }
    const topics = [...new Set(S.panels.filter((x) => fromOf(x).includes(p.id)).map(topOf).filter((t) => t?.view === "topic"))];
    if (topics.length) {
      const r = document.createElement("span");
      r.className = "topics";
      r.innerHTML = topics.map((t) => `<button data-goto="${esc(t.id)}">→ ${esc(topicTitle(t))}</button>`).join("");
      $(".meta .who", el).after(r);
    }
    tl.append(el);
    // 宛てた相手の返事：その発言から出た直接の仕事に、相手が最初に置いた短い文
    if (p.to) {
      const t = S.panels.find((x) => x.view === "task" && x.data?.direct && (fromOf(x).at(-1) ?? x.about) === p.id);
      const name = t?.data?.to || p.to;
      const ans = t && S.panels.find((x) => x.about === t.id && x.by === name && typeof x.data === "string");
      const text = ans ? ans.data : t && isWorking(t.id) ? L.replyBusy : t?.state === "done" ? "" : L.replyWait;
      if (text) {
        const b = document.createElement("button");
        b.className = `reply${ans ? "" : " wait"}`;
        if (t) b.dataset.goto = ans ? ans.id : t.id;
        b.innerHTML = `${ini(name, "sm")}<span class="t">${esc(text)}</span>`;
        tl.append(b);
      }
    }
  }
  if (follow) tl.scrollTop = tl.scrollHeight;

  // いまの要点（いちばん新しいもの）
  const sum = top.filter((p) => p.view === "summary").at(-1);
  const sb = $("#summary");
  sb.innerHTML = "";
  if (sum) sb.append(panelEl(sum, kids));
  else sb.innerHTML = `<p class="empty">${esc(L.emptySummary)}</p>`;

  // 話題ごと（なければ発言ごと）にまとめて、それぞれ画面に一枚で並べる（key は根のパネルの id）。
  // 新しいまとまりは、ほかを押しのけずに空いているところへ出る（最近動いたものから上に）
  const groups = [];
  for (const p of top) {
    if (p === sum || p.view === "summary") continue;
    if (!isSay(p)) groups.push({ key: p.id, src: null, items: [p] });
    else if (kids(p.id).length) groups.push({ key: p.id, src: p, items: kids(p.id) });
  }
  const lastOf = (g) => Math.max(...g.items.flatMap((p) => [p, ...desc(p.id)]).map((p) => p.rev || 0), g.src?.rev || 0);
  groups.sort((a, b) => lastOf(b) - lastOf(a));
  const keys = groups.map((g) => g.key);
  let changed = false;
  for (const t of $$(".tile", grid)) {
    const k = t.dataset.tile;
    if (!isGroupTile(k) || keys.includes(k)) continue;
    t.remove();
    // なくなったまとまりの置き場所は忘れる
    if (LAYOUT.pos?.[k]) delete LAYOUT.pos[k];
    changed = true;
  }
  S.groupTiles = keys;
  // 置き場所を決めていないまとまりは覚えない。並べるたびに、順番と中身から置き直す（自動の並び）
  for (const g of groups) if (!tileOf(g.key)) setupTile(g.key);
  if (changed) saveLayout();
  S.lastOf = Object.fromEntries(groups.map((g) => [g.key, lastOf(g)]));
  for (const k of LAYOUT.out || []) S.lastOf[k] = panelById(k)?.rev || 0;
  S.talking = talkingKeys(keys.filter((k) => !isFolded(k)));
  for (const g of groups) {
    const t = tileOf(g.key), solo = !g.src && g.items.length === 1, root = g.items[0];
    // 発言から出たまとまりは、見出しがその発言。押すとトークの発言へ
    const h2 = $(".tile-head h2", t);
    h2.textContent = g.src ? `← ${textOf(g.src.data)}` : root.view === "topic" ? topicTitle(root) : `${who(root.by)}・${root.view}`;
    h2.title = h2.textContent;
    if (g.src) h2.dataset.goto = g.src.id; else delete h2.dataset.goto;
    const box = document.createElement("div");
    box.className = `group${solo ? " solo" : ""}`;
    box.dataset.key = g.key;
    const items = document.createElement("div");
    items.className = "items";
    for (const p of g.items) {
      const el = panelEl(p, kids, { root: solo }), sz = !solo && SIZES[p.id];
      if (sz) Object.assign(el.style, { width: `${sz[0]}px`, height: `${sz[1]}px` });
      items.append(el);
    }
    box.append(items);
    const body = $(".tile-body", t);
    body.innerHTML = "";
    body.append(box);
    // 知らせの印は、そのまとまりの見出しに
    const ms = g.items.flatMap((p) => [p, ...desc(p.id)]).filter((p) => !isPerson(p.by)).map(markOf);
    $(".tile-head .badge", t).textContent = (solo && isDone(root) ? "✓" : "") + (ms.includes("waiting") ? L.markShort.waiting : ms.some(Boolean) ? L.markShort.notice : "");
  }
  // 取り出したパネル
  for (const k of LAYOUT.out || []) {
    const t = tileOf(k);
    if (!t) continue;
    const p = panelById(k);
    $(".tile-head h2", t).textContent = !p ? k : p.view === "topic" ? topicTitle(p) : `${who(p.by)}・${p.view}`;
    const body = $(".tile-body", t);
    body.innerHTML = "";
    if (p && !shownPanels(S.panels, S.marks, offSet()).includes(p)) body.innerHTML = `<p class="empty">${esc(L.offView)}</p>`;
    else if (p) body.append(panelEl(p, kids, { root: true })); else body.innerHTML = `<p class="empty">${esc(L.gone)}</p>`;
  }
  // 中身が変わると高さも変わるので、毎回並べ直す（読んでいるパネルは画面の同じ位置に残る）。人が動かしている最中は待つ
  if (!$(".editing")) applyLayout();
  sendFocus();
}

// いまの話題：いちばん新しい人の発言から出たものが入っている枠（話題か、発言から出たまとまり）。新しい順に三つまで
function talkingKeys(keys) {
  const byId = new Map(S.panels.map((p) => [p.id, p]));
  const rootOf = (p) => { const seen = new Set(); while (p?.about && byId.has(p.about) && !seen.has(p.id)) { seen.add(p.id); p = byId.get(p.about); } return p; };
  const out = [];
  const says = S.panels.filter((p) => p.view === "say" && isPerson(p.by) && !p.into).slice(-6).reverse();
  for (const s of says) {
    if (keys.includes(s.id) && !out.includes(s.id)) out.push(s.id);
    for (const x of S.panels) {
      if (x.about !== s.id && !(Array.isArray(x.data?.from) && x.data.from.includes(s.id))) continue;
      const r = rootOf(x);
      if (r && keys.includes(r.id) && !out.includes(r.id)) out.push(r.id);
    }
    if (out.length >= 3) break;
  }
  return out.slice(0, 3);
}

// 状況：清書係・マネージャ・控室の全員を頭文字で並べ、動いている人の輪を回す
function renderLive() {
  const lv = S.live || {};
  const busy = new Map((lv.agents || []).map((a) => [a.name, a]));
  const people = [
    { key: "scribe", name: L.scribe, on: !!lv.scribe, what: lv.scribe ? L.scribeBusy : "" },
    { key: "manager", name: L.manager, on: !!lv.manager, wait: !lv.manager && lv.waitingManager, what: lv.manager ? L.managerBusy : lv.waitingManager ? L.managerWait : "" },
    ...(S.names || []).map((n) => {
      const a = busy.get(n), t = a && S.panels.find((p) => p.id === a.task);
      return { key: n, id: n, name: callOf(n), on: !!a, task: a?.task, what: t ? textOf(t.data) : "", agent: true };
    }),

// ── 全体マップ：右下に小さく。並んだパネルの置き場所といま見ているところ（枠）を描く。押す・なぞるとそこへ行く ──

let MAPF = null, mapRaf = 0;
function drawMap() {
  mapRaf = 0;
  if (narrow()) return;
  const W = world.clientWidth, H = world.clientHeight;
  const rects = allTiles().map((k) => [k, tileOf(k)]).filter(([, t]) => t)
    .map(([k, t]) => ({ k, t, x: t.offsetLeft, y: t.offsetTop, w: t.offsetWidth, h: t.offsetHeight }));
  const v = { x: grid.scrollLeft, y: grid.scrollTop, w: grid.clientWidth, h: grid.clientHeight };
  const all = [...rects, v];
  const x0 = Math.min(...all.map((r) => r.x)), y0 = Math.min(...all.map((r) => r.y));
  const x1 = Math.max(...all.map((r) => r.x + r.w)), y1 = Math.max(...all.map((r) => r.y + r.h));
  const s = Math.min(W / (x1 - x0 || 1), H / (y1 - y0 || 1));

  const at = (r) => `left:${(mx + (r.x - x0) * s).toFixed(1)}px;top:${(my + (r.y - y0) * s).toFixed(1)}px;width:${Math.max(2, r.w * s).toFixed(1)}px;height:${Math.max(2, r.h * s).toFixed(1)}px`;
  world.innerHTML = rects.map((r) => {
    const cls = r.k === "tools" ? "tools" : $(".tile-head .badge", r.t)?.textContent ? "badge" : "";

// 利用者の view：変わったものだけ読み直す
async function loadViews(list) {
  const names = new Set(list.map((v) => v.name));
  for (const k of [...S.views.keys()]) if (!names.has(k)) S.views.delete(k);
  await Promise.all(list.filter((v) => S.views.get(v.name)?.hash !== v.hash).map(async (v) => {
    const r = await fetch(`/api/views/${encodeURIComponent(v.name)}`);
    if (r.ok) S.views.set(v.name, { hash: v.hash, src: await r.text() });
  }));
}

async function load() {
  const r = await fetch("/api/board");
  const b = await r.json();
  if (b.name !== S.name) S.seen = keep(`seen:${b.name || ""}`, b.name ? {} : keep("seen", {}));
  mergeSeen(b.seen, false);
  Object.assign(S, { panels: b.panels, marks: b.marks, live: b.live, names: b.names, initials: b.initials || {}, calls: b.calls || {}, title: b.title, name: b.name, feeds: b.feeds || {}, panelSet: b.panelSet });
  const adopted = adoptLayout(b.layout);
  // 並びのないボード（新しいボード）は、ブラウザに覚えた組み込みのパネルの並びだけを下敷きにする（id はボードごとに振られるため）
  if (!b.layout) {
    const own = (o) => Object.fromEntries(Object.entries(o || {}).filter(([k]) => BUILTIN.includes(k)));
    const base = { pos: own(LAYOUT.pos), zoom: own(LAYOUT.zoom), fold: own(LAYOUT.fold), pinned: (LAYOUT.pinned || []).filter((k) => BUILTIN.includes(k)), density: LAYOUT.density };
    for (const k of Object.keys(LAYOUT)) delete LAYOUT[k];
    Object.assign(LAYOUT, base, { out: [] });
    for (const o of [TPOS, SIZES]) for (const k of Object.keys(o)) delete o[k];
  }
  await loadViews(b.views || []);
  S.ready = true;
  if (SHOT && SHOT !== "board") return renderShot();
  const boardName = b.boardTitle || b.name;
  document.title = boardName ? `${b.title}・${boardName}` : b.title;
  if (boardName) $("#boardsLink").title = L.boardsNow(boardName);
  render();
  renderLive();
  if (adopted) { applyLayout(); relayoutFree(); }
  pushLayout();
}

function renderShot() {

  const d = DENSITY[dens()], st = document.documentElement.style;

  st.setProperty("--row", `${d.row}px`);
  st.setProperty("--gap", `${d.gap}px`);

  if (p) document.body.append(panelEl(p, tree()));
  relayoutFree();
}

async function op(type, panel) {
  $("#err").textContent = "";
  const r = await fetch("/api/op", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ type, panel }) });
  const b = await r.json();
  if (!b.ok) { $("#err").textContent = L.refused(b.message); return null; }
  return b;
}

// ── 操作 ──
grid.addEventListener("click", async (e) => {

  if (act === "pin") {
    if (!p.pinned && tileOf(p.id) && isAuto(p.id)) { LAYOUT.pos = { ...LAYOUT.pos, [p.id]: keepSize(p.id, posOf(p.id)) }; saveLayout(); }
    return op("edit", { id: p.id, pinned: !p.pinned });
  }
  if (act === "accept") return op("edit", { id: p.id, state: "done" });
  if (act === "drop") { if (confirm(L.dropAsk)) op("drop", { id: p.id }); return; }
  if (act === "split") {
    const h = await (await fetch(`/api/history?id=${encodeURIComponent(p.id)}`)).json();
    await op("edit", { id: p.id, data: h[0]?.panel.data });
    for (const x of S.panels.filter((q) => q.into === p.id)) await op("edit", { id: x.id, into: null });
    return;
  }
  if (act === "orig") {
    const ex = $(":scope > .orig", el);
    if (ex) { ex.remove(); e.target.textContent = L.orig; return; }
    const h = await (await fetch(`/api/history?id=${encodeURIComponent(p.id)}`)).json();
    const d = document.createElement("div");
    d.className = "orig";
    d.textContent = textOf(h[0]?.panel.data);
    $(":scope > .kids", el).before(d);
    e.target.textContent = L.origHide;
    return;
  }
  // トークの発言を押すと、それについて置かれたものを話題の欄で見せる
  if (el.closest("#timeline")) {
    const t = S.panels.find((x) => Array.isArray(x.data?.from) && x.data.from.includes(p.id));
    let top = t; while (top?.about && S.panels.some((x) => x.id === top.about)) top = S.panels.find((x) => x.id === top.about);
    return reveal(groupOf(p.id) || (top && groupOf(top.id)));
  }
  // 見たら知らせの印を消す（パネルを触ったとき）
  if (markOf(p) === "notice") { S.seen[p.id] = p.aiSeq; saveSeen(); render(); }
});
// ボード：新しいボード（前のボードの操作ログは残る）。切り替えなどはボードの管理のページで
async function loadBoards() {
  const r = await fetch("/api/boards");
  if (!r.ok) { $("#boardsLink").hidden = true; $("#newBoard").hidden = true; }
}
async function boardsDo(body) {
  const r = await (await fetch("/api/boards", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })).json();
  if (!r.ok) $("#err").textContent = L.refused(r.message);
}
// 更新して再起動：立ち直ったら、新しい画面を読み直す
$("#restart").onclick = async () => {
  if (!confirm(L.restartAsk)) return;
  const r = await (await fetch("/api/restart", { method: "POST" })).json().catch(() => ({ ok: false, message: "" }));
  if (!r.ok) { $("#err").textContent = L.refused(r.message); return; }
  $("#err").textContent = L.restarting;
  await new Promise((ok) => setTimeout(ok, 800));
  for (let i = 0; i < 60; i++) {
    try { if ((await fetch("/api/board")).ok) return location.reload(); } catch {}
    await new Promise((ok) => setTimeout(ok, 500));
  }
};
// この dyve について：押したときだけ出す
async function drawInfo() {
  const [m, w] = await Promise.all([fetch("/api/meta").then((x) => x.json()), fetch("/api/words").then((x) => (x.ok ? x.json() : { words: [] }))]);
  const rows = [
    [L.meta.version, m.version], [L.meta.commit, m.commit], [L.meta.source, L.sourceName[m.source]], [L.meta.running, m.running], [L.meta.room, m.room],
    [L.meta.board, m.board], [L.meta.startedAt, m.startedAt && new Date(m.startedAt).toLocaleString()], [L.meta.shoot, m.shoot ? L.shootOn(m.browser) : L.shootOff],
  ].filter(([, v]) => v != null);
  $("#infoPop").innerHTML = `<h3>${esc(L.infoTitle)}</h3><dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` +
    (m.behind == null ? "" : `<p class="${m.behind ? "warn" : ""}">${esc(m.behind ? L.behind(m.behind) : L.upToDate)}</p>`) +
    `<h3>${esc(L.wordsTitle)}</h3>` +
    (w.words.length ? w.words.map((x) => `<div class="word"><span class="t">${esc(x.heard)} → ${esc(x.write)}${x.when ? ` <small>${esc(x.when)}</small>` : ""} <small>${esc(L.wordBy(who(x.by)))}</small></span><button class="icon" data-word-drop="${esc(x.heard)}" title="${esc(L.wordDrop)}" aria-label="${esc(L.wordDrop)}">${ICON.drop}</button></div>`).join("") : `<p class="empty">${esc(L.wordsNone)}</p>`) +
    `<form id="wordForm"><input name="heard" required placeholder="${esc(L.wordHeard)}"><input name="write" required placeholder="${esc(L.wordWrite)}"><input name="when" placeholder="${esc(L.wordWhen)}"><button>${esc(L.wordAdd)}</button></form>`;
}
const postWords = (body) => fetch("/api/words", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }).then(drawInfo);
$("#info").onclick = async () => { await drawInfo(); $("#infoPop").showPopover(); };
$("#infoPop").addEventListener("click", (e) => { const b = e.target.closest("[data-word-drop]"); if (b) postWords({ action: "drop", heard: b.dataset.wordDrop }); });
$("#infoPop").addEventListener("submit", (e) => { e.preventDefault(); postWords({ action: "add", ...Object.fromEntries(new FormData(e.target)) }); });
$("#newBoard").onclick = () => { if (confirm(L.newBoardAsk)) boardsDo({ action: "new" }); };
$("#seenAll").onclick = () => { for (const p of S.panels) if (p.aiSeq) S.seen[p.id] = p.aiSeq; saveSeen(); render(); };

// ── 流し込む：しゃべり流し（間があいたら送る）と、ブラウザの音声認識 ──
// 書いても OS の音声入力でも、止まって間があいたら置く。マイクは確定したらすぐ置く
const msg = $("#msg");
let timer = null, composing = false, sending = false;
const arm = () => { clearTimeout(timer); timer = setTimeout(send, STREAM_PAUSE); };
async function send() {
  if (composing || sending) return arm();
  const raw = msg.value, text = raw.trim();
  if (!text) return;
  sending = true;
  const r = await op("add", { view: "say", data: text, ...(S.to ? { to: S.to } : {}) });
  sending = false;
  if (!r) return;
  // 送っているあいだに足された分は残す
  msg.value = msg.value.startsWith(raw) ? msg.value.slice(raw.length).trimStart() : msg.value;
  grow();
  if (msg.value.trim()) arm();
}
// 入力欄は一行から、書いたぶんだけ伸びる
const grow = () => { msg.style.height = "auto"; msg.style.height = `${msg.scrollHeight + 2}px`; };
msg.addEventListener("input", () => { grow(); arm(); });
msg.addEventListener("compositionstart", () => { composing = true; });
msg.addEventListener("compositionend", () => { composing = false; arm(); });
// Enter で置く。改行は Shift+Enter
// 宛先：状況のアイコンを押すと決まり、もう一度押すか ✕ か Esc で外れる。外すまで続く
function setTo(name) {
  S.to = name;
  const b = $("#to");
  b.hidden = !name;
  if (name) { b.textContent = L.toChip(callOf(name)); b.title = L.toOff; }
  msg.placeholder = name ? L.toPlaceholder(callOf(name)) : L.placeholder;
  renderLive();
}
$("#to").onclick = () => setTo(null);
msg.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.to) setTo(null); });
msg.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); clearTimeout(timer); send(); } });
$("#send").onclick = () => { clearTimeout(timer); send(); };

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const mic = $("#mic");
  mic.title = L.micTitle;
  let rec = null, on = false, interim = 0;
  mic.hidden = false;
  const setMic = (v) => { on = v; S.listening = v; mic.setAttribute("aria-pressed", String(v)); mic.textContent = v ? L.micOn : L.micOff; sendFocus(); };
  setMic(false);
  mic.onclick = () => {
    if (on) { setMic(false); rec?.stop(); return; }
    rec = new SR();
    rec.lang = "ja-JP"; rec.continuous = true; rec.interimResults = true;
    interim = 0;
    // 末尾の途中経過だけを差し替える。送ったぶんが欄から消えていても崩れない
    rec.onresult = (ev) => {
      let fin = "", mid = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) fin += ev.results[i][0].transcript; else mid += ev.results[i][0].transcript;
      }
      msg.value = msg.value.slice(0, Math.max(0, msg.value.length - interim)) + fin + mid;
      grow();
      interim = mid.length;
      // 確定したらすぐ置く（まとめて整えるのは起こし係の間が受け持つ）
      if (mid) clearTimeout(timer); else if (fin) { clearTimeout(timer); send(); }
    };
    rec.onend = () => { if (on) rec.start(); };
    rec.onerror = (ev) => { if (ev.error === "not-allowed") setMic(false); };
    rec.start();
    setMic(true);
  };
}

// ── 人のいま：どこを見ているか・何の話か・何を見たかを、ボードに知らせる（操作ログには積まず、誰も起こさない）──
const FOCUS = { client: Math.random().toString(36).slice(2, 10), timer: 0, input: Date.now(), sent: "", at: 0, away: false };
function focusNow() {
  const g = grid.getBoundingClientRect();
  const inView = (r) => r.width > 0 && r.bottom > g.top + 16 && r.top < g.bottom - 16 && r.right > g.left + 16 && r.left < g.right - 16;
  const viewing = allTiles().filter((k) => !BUILTIN.includes(k) && tileOf(k) && inView(tileOf(k).getBoundingClientRect()));
  const inside = viewing.flatMap((k) => $$("dv-panel", tileOf(k)).filter((el) => el.dataset.id !== k && inView(el.getBoundingClientRect())).map((el) => el.dataset.id));
  const tl = $("#timeline"), talk = tileOf("talk");
  return {
    client: FOCUS.client,
    presence: document.visibilityState === "visible" && Date.now() - FOCUS.input < 5 * 60e3 ? "here" : "away",
    listening: !!S.listening,
    followingTalk: !!talk && inView(talk.getBoundingClientRect()) && tl.scrollTop + tl.clientHeight >= tl.scrollHeight - 40,
    viewing, inside: [...new Set(inside)], talking: S.talking || [],
    tiles: allTiles().filter((k) => tileOf(k)).map((k) => ({ key: k, ...posOf(k), ...(isAuto(k) ? { auto: true } : {}), ...(isFolded(k) ? { folded: true } : {}) })),
    seen: S.seen,
  };
}
// 変わったときと、一分ごと（いることを知らせる）に送る
function sendFocus(now = false) {
  if (SHOT || !S.ready) return;
  clearTimeout(FOCUS.timer);
  FOCUS.timer = setTimeout(async () => {
    const body = focusNow(), key = JSON.stringify(body);
    if (key === FOCUS.sent && Date.now() - FOCUS.at < 50e3) return;
    FOCUS.sent = key;
    FOCUS.at = Date.now();
    FOCUS.away = body.presence === "away";
    const r = await fetch("/api/focus", { method: "POST", headers: { "content-type": "application/json" }, body: key }).then((x) => x.json()).catch(() => null);
    if (r?.seen) mergeSeen(r.seen);
  }, now ? 0 : 800);
}
// ほかの端末で見たものも見たことにする
function mergeSeen(seen, draw = true) {
  let more = false;
  for (const [id, n] of Object.entries(seen || {})) if (Number.isInteger(n) && n > (S.seen[id] || 0)) { S.seen[id] = n; more = true; }
  if (!more) return;
  put(`seen:${S.name || ""}`, S.seen);
  if (draw) render();
}
const touched = () => { FOCUS.input = Date.now(); if (FOCUS.away) sendFocus(true); };
document.addEventListener("pointerdown", touched, true);
document.addEventListener("keydown", touched, true);
document.addEventListener("visibilitychange", () => sendFocus(true));
grid.addEventListener("scroll", () => sendFocus(), { passive: true });
$("#timeline").addEventListener("scroll", () => sendFocus(), { passive: true });
grid.addEventListener("pointerover", (e) => { HOVER.k = e.target.closest("#grid > .tile")?.dataset.tile ?? null; });
grid.addEventListener("pointerleave", () => { HOVER.k = null; });
setInterval(() => sendFocus(), 60e3);

// ── 生きている知らせ ──
function connect() {
  const es = new EventSource("/api/events");
  let t = null;
  es.addEventListener("board", load);
  es.addEventListener("panelset", load);
  es.addEventListener("views", async (e) => { await loadViews(JSON.parse(e.data)); render(); });
  es.addEventListener("feed", (e) => { const f = JSON.parse(e.data); S.feeds[f.id] = f; clearTimeout(t); t = setTimeout(load, 120); });
  es.addEventListener("op", () => { clearTimeout(t); t = setTimeout(load, 120); });
  es.addEventListener("live", (e) => { S.live = JSON.parse(e.data); renderLive(); clearTimeout(t); t = setTimeout(load, 120); });
  es.onerror = () => { es.close(); setTimeout(connect, 2000); };
}

msg.placeholder = L.placeholder;
$("#send").textContent = L.send;
// dyve 設定はアイコンだけ。名前は title と aria-label に
const iconBtn = (id, icon, label) => { const b = $(id); b.innerHTML = icon; b.title = label; b.setAttribute("aria-label", label); };
iconBtn("#seenAll", ICON.seen, L.seenAll);
iconBtn("#export", ICON.export, L.export);
iconBtn("#newBoard", ICON.newBoard, L.newBoard);
iconBtn("#restart", ICON.restart, L.restart);
iconBtn("#info", ICON.info, L.info);
$("#resetLayout").innerHTML = `${ICON.reset} ${esc(L.resetLayout)}`;
iconBtn("#boardsLink", ICON.boards, L.boards);
iconBtn("#panelsLink", ICON.panels, L.panels);
// 管理のページから、切り替えたあとにこのタブへ戻れるように名前を付ける
window.name = "dyve-board";
$("#densityLabel").textContent = L.density;
$("#density").setAttribute("aria-label", L.density);
loadBoards();
renderLive();
load().then(() => { if (!SHOT) connect(); });
</script>
</body>
