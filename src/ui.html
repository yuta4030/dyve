<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dyve</title>
<style>
:root {
  --bg: #fafaf8; --panel: #ffffff; --ink: #1d1d1b; --sub: #6b6b66; --line: #e4e3de;
  --run: #2f6fdb; --back: #1f8a4c; --fail: #c0392b; --mark: #e08a00; --soft: #f1f0ec;
  font: 14px/1.55 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --sub: #9a9992; --line: #33322f; --soft: #292926; --run: #6c9cf0; --back: #4cc07e; --fail: #e8695b; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); }
body { display: grid; grid-template-columns: minmax(280px, 340px) 1fr; height: 100vh; }
@media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: 1fr 45vh; } #chat { order: 2; border-right: 0; border-top: 1px solid var(--line); } }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }

#chat { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--panel); }
#flow { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
#flow .empty { color: var(--sub); }
.say p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.chip { display: inline-block; margin-top: 2px; font-size: 12px; color: var(--sub); }
button.chip:hover { color: var(--ink); text-decoration: underline; }
.ret { border-left: 3px solid var(--back); padding: 2px 0 2px 8px; font-size: 13px; }
.ret.fail { border-color: var(--fail); }
.ret b { margin-right: 4px; }
#input { border-top: 1px solid var(--line); padding: 10px 12px; }
#input textarea { width: 100%; resize: none; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; color: inherit; background: var(--bg); max-height: 40vh; }
#note { font-size: 12px; color: var(--sub); min-height: 1em; margin-top: 4px; }

main { min-height: 0; overflow-y: auto; padding: 14px; }
#cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; align-content: start; }
#cards .empty { color: var(--sub); }
.card { display: flex; flex-direction: column; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-height: 120px; position: relative; }
.card:hover { border-color: var(--sub); }
.card.mark::after { content: ""; position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--mark); }
.head { display: flex; align-items: baseline; gap: 8px; }
.sym { font-weight: 700; font-size: 18px; }
.name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.status { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--soft); color: var(--sub); white-space: nowrap; }
.status.run { color: var(--run); }
.status.back { color: var(--back); }
.status.fail { color: var(--fail); }
.last { color: var(--sub); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
.status.run::before { content: "● "; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .2; } }

#peek .bar { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
#peek .bar button { color: var(--sub); }
#peek .bar button:hover { color: var(--ink); }
.turns { display: flex; flex-direction: column; gap: 8px; max-width: 860px; }
.turns > div { white-space: pre-wrap; overflow-wrap: anywhere; }
.turns .human { align-self: flex-end; background: var(--soft); border-radius: 10px; padding: 6px 10px; max-width: 80%; }
.turns .ai { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.turns .tool { font: 12px/1.4 ui-monospace, Menlo, monospace; color: var(--sub); }
.turns .error { color: var(--fail); }
</style>
</head>
<body>
<section id="chat">
  <div id="flow"></div>
  <div id="input"><textarea rows="1"></textarea><div id="note"></div></div>
</section>
<main>
  <div id="cards"></div>
  <div id="peek" hidden></div>
</main>
<script type="module">
const L = {
  emptyChat: "話すか書くと、ここに流れる。声は間があくと置かれ、打ったものは Enter で置かれる（改行は Shift+Enter）",
  emptyCards: "頼んだ仕事が、ここに一枚ずつ並ぶ",
  placeholder: "話すか書く",
  pending: "…",
  aside: "どこにも届けていない",
  missed: (e) => `届け先が決まらなかった（次に話したとき読み直す）：${e}`,
  to: (sym, name) => `→ ${sym} ${name}`,
  failed: "置けなかった。Enter でもう一度",
  back: "← 一覧",
  status: { idle: "まだ", run: "実行中", back: "帰った", fail: "失敗" },
  lost: "つながりが切れた。つなぎ直している",
};

// 声の入力が止まってから、この間があいたら置く（ミリ秒）。キーボードで打ったものは Enter まで待つ
const PAUSE = 2500;
// いちばん下を見ているか（このくらいの差なら下にいるとみなす）
const NEAR = 40;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const atBottom = (el) => el.scrollHeight - el.scrollTop - el.clientHeight < NEAR;
// Enter で置く。Shift+Enter は改行。IME の変換を確定する Enter では置かない（Safari は isComposing が外れていて keyCode が 229 になる）
function isSendKey(e) {
  return e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229;
}
// 返ってきた文の最初の一行（見出しや強調の記号を外す）
function headOf(s) {
  const line = String(s ?? "").split("\n").map((l) => l.replace(/^[#>*\-\s]+|\*\*/g, "").trim()).find(Boolean) ?? "";
  return line.length > 140 ? line.slice(0, 139) + "…" : line;
}

let state = { said: [], sessions: [], chat: [] };
let peek = null;          // 覗いているセッション
const seen = new Map();   // セッション -> 見た終わり（印を消すため。画面の中だけで持つ）
let first = true;

const ses = (id) => state.sessions.find((x) => x.id === id);

function chipOf(s) {
  if (s.session === undefined) return s.error ? `<span class="chip">${esc(L.missed(s.error))}</span>` : `<span class="chip">${L.pending}</span>`;
  if (s.session === null) return `<span class="chip">${esc(L.aside)}</span>`;
  const x = ses(s.session);
  return x ? `<button class="chip" data-go="${x.id}">${esc(L.to(x.sym, x.name))}</button>` : "";
}

function renderChat() {
  const el = $("#flow"), keep = atBottom(el);
  const said = new Map(state.said.map((s) => [s.id, s]));
  el.innerHTML = state.chat.length ? state.chat.map((c) => {
    if (c.say != null) {
      const s = said.get(c.say);
      return `<div class="say"><p>${esc(s.text)}</p>${chipOf(s)}</div>`;
    }
    const x = ses(c.back);
    return `<button class="ret${c.error ? " fail" : ""}" data-go="${x.id}"><b>${esc(x.sym)}</b>${esc(headOf(c.text))}</button>`;
  }).join("") : `<div class="empty">${esc(L.emptyChat)}</div>`;
  if (keep || first) el.scrollTop = el.scrollHeight;
}

function marked(x) {
  return (x.status === "back" || x.status === "fail") && seen.get(x.id) !== x.endedAt;
}

function renderCards() {
  const el = $("#cards");
  el.innerHTML = state.sessions.length ? [...state.sessions].reverse().map((x) => `
    <button class="card${marked(x) ? " mark" : ""}" data-go="${x.id}">
      <div class="head"><span class="sym">${esc(x.sym)}</span><span class="name">${esc(x.name)}</span><span class="status ${x.status}">${esc(L.status[x.status])}</span></div>
      <div class="last">${esc(x.status === "run" ? x.last : headOf(x.last) || x.last)}</div>
    </button>`).join("") : `<div class="empty">${esc(L.emptyCards)}</div>`;
}

function renderPeek() {
  const el = $("#peek"), x = ses(peek);
  if (!x) { peek = null; return; }
  seen.set(x.id, x.endedAt);
  const main = $("main"), keep = atBottom(main);
  el.innerHTML = `
    <div class="bar"><button data-close>${esc(L.back)}</button><span class="sym">${esc(x.sym)}</span><span class="name">${esc(x.name)}</span><span class="status ${x.status}">${esc(L.status[x.status])}</span></div>
    <div class="turns">${x.flow.map((f) => `<div class="${f.who}">${esc(f.text)}</div>`).join("")}</div>`;
  if (keep) main.scrollTop = main.scrollHeight;
}

function render() {
  renderChat();
  $("#cards").hidden = peek != null;
  $("#peek").hidden = peek == null;
  if (peek != null) renderPeek();
  if (peek == null) renderCards();
}

function open(id) {
  peek = id;
  render();
  $("main").scrollTop = peek == null ? 0 : $("main").scrollHeight;
}

document.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]");
  if (go) return open(Number(go.dataset.go));
  if (e.target.closest("[data-close]")) open(null);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && peek != null) open(null); });

function connect() {
  const es = new EventSource("/api/events");
  es.addEventListener("state", (e) => {
    state = JSON.parse(e.data);
    // 開いたときに終わっていたものには印を付けない
    if (first) for (const x of state.sessions) seen.set(x.id, x.endedAt);
    render();
    first = false;
    if ($("#note").textContent === L.lost) $("#note").textContent = "";
  });
  es.onerror = () => { $("#note").textContent = L.lost; };
}

async function say(text) {
  try {
    const r = await fetch("/api/say", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text, ...(peek != null ? { peek } : {}) }) });
    return r.ok;
  } catch {
    return false;
  }
}

// 声と打鍵の見分け：入力の直前にキーが押されていればキーボード（OS の音声入力はキーを押さずに文字が入る）
// 声だけなら、間があいたら置く。書きかけに一文字でも打ったら、その書きかけは Enter まで待つ。欄が空になったら声に戻る
const input = {
  m: $("#input textarea"), timer: null, composing: false, sending: false, typed: false, lastKey: 0,
  listen() {
    const m = this.m;
    m.placeholder = L.placeholder;
    const byKey = () => Date.now() - this.lastKey < 300;
    m.addEventListener("keydown", (e) => {
      this.lastKey = Date.now();
      if (isSendKey(e)) { e.preventDefault(); clearTimeout(this.timer); this.send(); }
    });
    m.addEventListener("input", () => {
      this.grow();
      if (!m.value.trim()) this.typed = false;
      else if (byKey()) this.typed = true;
      if (this.typed) clearTimeout(this.timer); else this.arm();
    });
    m.addEventListener("compositionstart", () => { this.composing = true; });
    m.addEventListener("compositionend", () => { this.composing = false; if (!byKey() && !this.typed) this.arm(); });
  },
  arm() {
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.send(), PAUSE);
  },
  async send() {
    const m = this.m;
    if (this.composing || this.sending) return this.arm();
    const raw = m.value, text = raw.trim();
    if (!text) return;
    this.sending = true;
    const t0 = Date.now();
    const ok = await say(text);
    this.sending = false;
    // 置けなかったら欄に残す（落とさない）。もう一度置くのは人が Enter で
    if (!ok) { $("#note").textContent = L.failed; return; }
    $("#note").textContent = "";
    // 置いているあいだに足されたぶんは残し、そのあいだにキーで打ったかで決め直す
    m.value = m.value.startsWith(raw) ? m.value.slice(raw.length).trimStart() : m.value;
    this.grow();
    this.typed = !!m.value.trim() && this.lastKey > t0;
    if (m.value.trim() && !this.typed) this.arm();
  },
  // 入力欄は一行から、書いたぶんだけ伸びる
  grow() {
    this.m.style.height = "auto";
    this.m.style.height = `${this.m.scrollHeight}px`;
  },
};

input.listen();
connect();
</script>
</body>
</html>
