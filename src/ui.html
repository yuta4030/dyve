<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ボード</title>
<style>
:root {
  /* いつもダーク。強調色は彩度を落として目立たせすぎない（アリスの案 p1u） */
  color-scheme: dark;
  --bg: #0f1113; --card: #181a1e; --ink: #d4d7dc; --mute: #7d838b; --line: #2a2e34;
  --accent: #6f86b3; --accent-soft: #1a2130; --warn: #d8995a; --warn-soft: #2e2318; --ok: #6fb38a;
  --radius: 10px; --gap: 10px; --row: 44px;
}
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
html, body { height: 100%; }
body { margin: 0; height: 100dvh; overflow: hidden; background: var(--bg); color: var(--ink);
       font: 15px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
button { font: inherit; font-size: 13px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px;
         padding: 3px 10px; cursor: pointer; min-height: 30px; }
button:hover { border-color: var(--mute); }
button.primary { background: var(--accent-soft); border-color: var(--line); color: var(--ink); }
button.icon { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 26px; padding: 0 6px; border-color: transparent; background: transparent; color: var(--mute); }
button.icon:hover { color: var(--ink); border-color: var(--line); }
button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
a { color: var(--accent); }
.empty { color: var(--mute); text-align: center; margin: 8% 8px 0; font-size: 14px; }

/* ── 画面は全部パネル。並べ方と大きさはボードの view layout のパネルに持つ（.tile は画面に並ぶパネルの枠）── */
/* ダッシュボードは上下左右に広がるキャンバス（#grid）。#stage がそれを窓から見せる。一画面がます目の細かさ（--cols）の列ぶん。並べたものの外にも一画面ぶんの余白を持ち、そこへ動かせば広がる */
/* ボードの倍率はキャンバスごと transform で縮める。並びと折り返しは倍率で変わらない */
#stage { height: 100%; overflow: auto; touch-action: pan-x pan-y; }
#grid { --cols: 24; --colw: 40px; --span: 24; --rows: 40; position: relative; width: max-content; height: max-content; transform-origin: 0 0; padding: var(--gap); display: grid; gap: var(--gap);
        grid-template-columns: repeat(var(--span), var(--colw)); grid-template-rows: repeat(var(--rows), var(--row));
        grid-auto-columns: var(--colw); grid-auto-rows: var(--row); }
/* 動かしているあいだだけ、ます目を薄く見せる */
#grid.editing { background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% calc(var(--row) + var(--gap)); background-position: 0 calc(var(--gap) - 1px); }
.tile { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0;
        background: color-mix(in srgb, var(--card) 55%, var(--bg)); border: 1px solid var(--line); border-radius: var(--radius); }
.tile[hidden] { display: none; }
.tile.dragging { opacity: .6; outline: 2px dashed var(--accent); }
.tile-head { flex: none; display: flex; align-items: center; gap: 6px; padding: 2px 8px 0 6px; min-height: 28px;
             font-size: 12px; color: var(--mute); cursor: grab; user-select: none; touch-action: none; }
.tile-head h2 { margin: 0; font-size: 12px; font-weight: 600; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tile-head h2[data-goto] { cursor: pointer; }
.tile-head h2[data-goto]:hover { color: var(--ink); }
.tile-head .grip { letter-spacing: -2px; opacity: .5; }
.tile-head .badge { color: var(--accent); }
.tile-head .ctl { margin-left: auto; display: flex; align-items: center; gap: 0; cursor: default; }
.tile-head .ctl button { display: inline-flex; align-items: center; justify-content: center; min-height: 22px; padding: 0 5px; font-size: 12px; opacity: .35; transition: opacity .15s; }
.tile:hover .tile-head .ctl button, .tile-head .ctl button:focus-visible, .tile-head .ctl button[aria-expanded="true"] { opacity: 1; }
@media (hover: none) { .tile-head .ctl button { opacity: 1; } }
.tile-head .lockmark { display: none; color: var(--mute); }
.tile.locked .tile-head .lockmark { display: inline-flex; }
.tile.locked .tile-head { cursor: default; }
.tile.locked .tile-head .grip { visibility: hidden; }
.tile.locked .sizer { display: none; }
/* 畳んだパネル：見出しだけ残す */
.tile.folded .tile-body, .tile.folded .sizer, .tile.folded .opts { display: none; }
/* 枠の歯車：奥まった設定 */
.tile-head [data-ctl="menu"] svg { vertical-align: -2px; }
.opts { position: absolute; z-index: 5; top: 28px; right: 6px; min-width: 190px; display: flex; flex-direction: column; gap: 6px;
        padding: 8px 10px; font-size: 12px; color: var(--mute); background: var(--card); border: 1px solid var(--line); border-radius: 8px;
        box-shadow: 0 6px 24px rgb(0 0 0 / .35); }
.opts[hidden] { display: none; }
.opts .row { display: flex; align-items: center; gap: 4px; }
.opts .row > span:first-child { flex: 1; }
.opts button { min-height: 24px; padding: 0 8px; font-size: 12px; }
.opts .zoom { width: 4.2em; font: inherit; font-size: 12px; text-align: right; color: var(--ink); background: var(--bg);
              border: 1px solid var(--line); border-radius: 6px; padding: 1px 4px; }
.opts select { font: inherit; font-size: 12px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 4px; }
.tile-body { position: relative; flex: 1; min-height: 0; overflow-y: auto; padding: 4px 10px 10px; }
.sizer { position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; touch-action: none;
         background: linear-gradient(135deg, transparent 55%, var(--mute) 55%, var(--mute) 62%, transparent 62%, transparent 75%, var(--mute) 75%, var(--mute) 82%, transparent 82%);
         opacity: .5; border-bottom-right-radius: var(--radius); }
.sizer:hover { opacity: 1; }
@media (max-width: 760px) {
  #stage { overflow-x: hidden; }
  #grid { width: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-auto-columns: auto; }
  .tile { grid-column: 1 / -1 !important; grid-row: span var(--h) !important; }
  #map { display: none !important; }
}
/* 全体マップ：右下に小さく。並んだパネルの置き場所といま見ているところを描き、押すとそこへ行く */
#map { position: fixed; right: 14px; bottom: 14px; z-index: 6; display: flex; flex-direction: column; gap: 4px; padding: 6px;
       background: color-mix(in srgb, var(--card) 88%, transparent); border: 1px solid var(--line); border-radius: 8px;
       box-shadow: 0 4px 16px rgb(0 0 0 / .25); opacity: .75; transition: opacity .15s; }
#map:hover, #map:focus-within { opacity: 1; }
#map .world { position: relative; width: 168px; height: 110px; cursor: pointer; touch-action: none; }
#map .world > span { position: absolute; border-radius: 2px; background: color-mix(in srgb, var(--mute) 45%, transparent); }
#map .world > span.tools { background: color-mix(in srgb, var(--ink) 55%, transparent); }
#map .world > span.badge { background: var(--accent); }
#map .world > .view { background: none; border: 1.5px solid var(--accent); border-radius: 3px; pointer-events: none; }
#map .bar { display: flex; justify-content: flex-end; gap: 2px; }
#map .bar #zoomNow { margin-right: auto; min-width: 3.4em; font-variant-numeric: tabular-nums; }
#map .bar button { min-height: 22px; padding: 0 6px; font-size: 11px; }
#map .bar button[hidden] { display: none; }

/* 浮かせる：トーク・状況・残量・dyve 設定はボードの外の層に小さく出す。ボードの拡大縮小は掛からない */
#floats { --float-alpha: 80%; position: fixed; inset: 0; z-index: 7; pointer-events: none; }
#floats > .tile { position: absolute; pointer-events: auto; font-size: 13px; max-width: calc(100vw - 16px); max-height: calc(100dvh - 16px);
                  background: color-mix(in srgb, var(--card) var(--float-alpha), transparent); backdrop-filter: blur(3px); box-shadow: 0 6px 24px rgb(0 0 0 / .4); }
#floats > .tile.folded { height: auto !important; }
#floats > .tile.dragging { opacity: .8; }
#floats .tile-head { min-height: 22px; padding-top: 0; }
#floats .tile-body { padding: 2px 8px 6px; }
#floats .tile[data-tile="talk"] .tile-body { padding: 0; }
#floats #timeline { padding: 2px 6px; gap: 4px; }
#floats #input { padding: 4px 6px 6px; }
#floats #status { gap: 4px; }
#floats .ava { width: auto; gap: 0; font-size: 0; }
#floats .ava .ini { width: 24px; height: 24px; font-size: 11px; }
#floats #doing { margin-top: 2px; max-height: 3.4em; overflow: hidden; font-size: 11px; line-height: 1.5; }
#floats .meter { margin-bottom: 4px; font-size: 11px; }
#floats .meter:last-child { margin-bottom: 0; }
#floats .meter .when { display: none; }
#floats .meter .bar { height: 5px; }
#floats #tools .acts { gap: 2px; }
#floats #tools .ib { width: 26px; height: 26px; }
#floatMode { display: flex; align-items: center; gap: 2px; font-size: 11px; color: var(--mute); }
#floatMode span { margin-right: auto; }
#floatMode button { min-height: 22px; padding: 0 6px; font-size: 11px; }
.opts.up { top: auto; bottom: calc(100% + 2px); }

/* トーク：発言の流れと入力 */
.tile[data-tile="talk"] .tile-body { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
#timeline { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 10px; display: flex; flex-direction: column; gap: 6px; }
#input { flex: none; border-top: 1px solid var(--line); padding: 6px 10px 8px; display: flex; flex-direction: column; gap: 6px; }
#input .say { display: flex; align-items: flex-end; gap: 6px; }
#send { flex: none; width: 36px; height: 36px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
/* 宛先も知らせもないときは、下の行を出さない */
#input .bar:not(:has(#to:not([hidden]))):not(:has(#err:not(:empty))) { display: none; }
/* マイクはトークの見出しに。聞いているあいだは色で知らせる */
.tile-head .ctl #mic { opacity: 1; }
.tile-head .ctl #mic[hidden] { display: none; }
.tile-head .ctl #mic[aria-pressed="true"] { color: var(--bg); background: var(--accent); border-radius: 50%; }
#msg { flex: 1; min-width: 0; width: 100%; box-sizing: border-box; resize: none; min-height: 36px; max-height: 30vh; font: inherit; color: var(--ink); background: var(--card);
       border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 10px; }
#msg:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#input .bar { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--mute); }
#input .bar .grow { flex: 1; min-width: 0; }
#input label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
#err { color: var(--warn); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 状況：頭文字のアイコン。動いているあいだは輪が回る */
#status { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
.ava { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; width: 46px; min-height: 0; padding: 0;
       border: none; background: none; color: var(--mute); font-size: 11px; }
/* アイコンは状況とトークで同じもの（ini()）。大きさだけ変える */
.ini { position: relative; flex: none; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
       border: 2px solid var(--line); background: var(--card); color: var(--ink); font-size: 14px; font-weight: 600; }
.ini.sm { width: 20px; height: 20px; border-width: 1px; font-size: 10px; }
.ava.busy { color: var(--ink); }
.ava.busy .ini { border-color: var(--accent-soft); color: var(--accent); }
.ava.busy .ini::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid transparent;
                        border-top-color: var(--accent); animation: spin .9s linear infinite; }
.ava.wait .ini { border-style: dashed; border-color: var(--mute); }
button.ava { cursor: pointer; }
.ava.to { color: var(--accent); }
.ava.to .ini { border-color: var(--accent); background: var(--accent-soft); }
#to { border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 1px 10px; font-size: 12px; }
dv-panel .meta .to { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); }
dv-panel .meta .to .ini { border-color: var(--accent); color: var(--accent); }
/* トーク：宛てた相手の返事は、その発言のすぐ下に */
.reply { display: flex; flex: none; align-items: flex-start; gap: 6px; width: 100%; min-height: 0; margin: -2px 0 0 14px; padding: 2px 4px; border: none; background: none;
         text-align: left; font-size: 13px; color: var(--ink); }
.reply .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; padding-top: 1px; }
.reply.wait .t { color: var(--mute); }
.reply:hover .t { text-decoration: underline; }
.reply.more { width: auto; margin-left: 38px; font-size: 11px; color: var(--mute); }
.topics { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.topics button { min-height: 0; padding: 0 6px; border: 1px solid var(--line); border-radius: 999px; background: none; font-size: 11px; color: var(--mute); }
.topics button:hover { color: var(--ink); }
/* トークの発言：指したパネル（☞）・押して選んだもの（✓）・要点への行き先・マネージャがまだ読んでいないもの */
.topics button.pick { color: var(--ok); border-color: var(--ok); }
.topics .wait { padding: 0 6px; border: 1px dashed var(--line); border-radius: 999px; font-size: 11px; color: var(--mute); }
/* 話題：話題の欄のまとまりの頭になる */
dv-panel .meta .topic-title { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 15px; font-weight: 700; color: var(--ink); }
dv-topic p { margin: 2px 0 0; color: var(--mute); }
#doing { width: 100%; margin: 4px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--mute); }
#doing li { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spin { flex: none; display: inline-block; width: 11px; height: 11px; border-radius: 50%;
        border: 2px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin, .ava.busy .ini::after { animation: none; } .ava.busy .ini { border-color: var(--accent); } }

/* 残量 */
.meter { margin-bottom: 8px; font-size: 13px; }
.meter .row { display: flex; justify-content: space-between; gap: 8px; }
.meter .row .when { color: var(--mute); font-size: 12px; }
.meter .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 2px; }
.meter .bar > span { display: block; height: 100%; background: var(--ok); }
.meter.low .bar > span { background: var(--warn); }

/* dyve 設定：アイコンの並び */
#tools { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
#tools .acts { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
#tools .ib { display: inline-grid; place-items: center; width: 32px; height: 32px; min-height: 0; padding: 0; border-radius: 8px;
             border: 1px solid var(--line); background: var(--card); color: var(--ink); text-decoration: none; }
#tools .ib:hover { border-color: var(--mute); }
#tools .ib[hidden] { display: none; }
#tools select { font: inherit; font-size: 12px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; max-width: 14em; }
/* この dyve について：押したときだけ出る */
#infoPop { width: min(560px, calc(100vw - 32px)); max-height: 80vh; overflow: auto; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--ink); font-size: 13px; }
/* パネルを移す・親のパネルにまとめる */
#movePop { position: fixed; inset: auto; margin: 0; width: min(320px, calc(100vw - 32px)); max-height: 70vh; overflow: auto; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--ink); font-size: 13px; }
#movePop h3 { margin: 8px 0 4px; font-size: 12px; color: var(--mute); }
#movePop h3:first-child { margin-top: 0; }
#movePop button { display: block; width: 100%; text-align: left; margin-bottom: 2px; }
#movePop label { display: flex; gap: 6px; align-items: baseline; padding: 1px 0; overflow-wrap: anywhere; }
#movePop input[type="text"] { width: 100%; margin: 4px 0; box-sizing: border-box; }
#movePop form button { text-align: center; }
#infoPop h3 { margin: 10px 0 4px; font-size: 13px; }
#infoPop h3:first-child { margin-top: 0; }
#infoPop dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 0; }
#infoPop dt { color: var(--mute); }
#infoPop dd { margin: 0; overflow-wrap: anywhere; }
#infoPop .word { display: flex; gap: 8px; align-items: center; padding: 2px 0; }
#infoPop .word .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
#infoPop .word small { color: var(--mute); }
#infoPop form { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
#infoPop input { flex: 1 1 8em; min-width: 0; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
#infoPop .warn { color: var(--warn, #b45309); }
/* パネルの絵を撮るとき：その一枚だけ */
body.shot { display: block; height: auto; overflow: auto; padding: 12px; }
body.shot #stage, body.shot #map, body.shot #floats { display: none; }

#toolsMore { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 6px; }
#toolsMore svg, .opts [data-ctl="lock"] svg { vertical-align: -2px; }
#tune > summary { cursor: pointer; }
#tune .tune-rows { display: grid; grid-template-columns: 1fr auto auto; gap: 3px 6px; align-items: center; margin: 6px 0; }
#tune input { width: 5.2em; font: inherit; font-size: 12px; text-align: right; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 4px; }
#tune input.changed { border-color: var(--accent); }
#tune .unit { color: var(--mute); }
/* 話題の欄：話題ごと（話題がなければ元の発言ごと）のまとまり */
.group { margin-bottom: 14px; }
.group > .src { display: block; width: 100%; min-height: 0; padding: 0 2px; margin-bottom: 4px; border: none; background: none; text-align: left;
                font-size: 12px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.group > .src:hover { color: var(--ink); }
.group > .items { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
.group > .items > dv-panel { flex: none; width: 100%; max-width: 100%; min-width: 200px; min-height: 0; resize: both; overflow: auto; }
/* 話題ひとつの枠：並んだ枠がそのまま枠になるので、パネルの枠と見出しのタイトルは出さない */
.group.solo { margin: 0; }
.group.solo > .items > dv-panel { border: none; background: none; padding: 0; resize: none; overflow: visible; }
.group.solo > .items > dv-panel > .meta .topic-title { display: none; }
iframe.uview { display: block; width: 100%; border: 0; background: transparent; }
.send-row { margin: 4px 0; }
.send-row .send-go { display: flex; gap: 6px; align-items: flex-end; }
.send-row textarea { flex: 1; min-width: 0; min-height: 26px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; resize: vertical; }
.send-row pre { flex: 1; min-width: 0; max-height: 160px; margin: 0; padding: 4px 6px; overflow: auto; border: 1px solid var(--accent); border-radius: 6px; background: var(--accent-soft); font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
.src-line { margin: 2px 0 4px; font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--mute); overflow-wrap: anywhere; }
/* 畳む：見出しの一行だけにする。済みの仕事と話題は、見る人が決めていなければ畳む。押すと開く */
dv-panel.folded > :not(.meta) { display: none; }
dv-panel.folded { height: auto !important; padding-block: 4px; resize: none; opacity: .75; }
dv-panel .fold { color: var(--mute); }
/* 畳んだ見出しの一行：仕事は結果、話題はいまどこまで来たか、ほかは中身の頭 */
.gist { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
dv-panel .meta .gist { flex-basis: 6em; color: var(--ink); }
.tile-head .gist { font-weight: 400; }
.tile:not(.folded) .tile-head .gist { display: none; }
.hl { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: var(--radius); }

dv-panel { display: block; position: relative; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
dv-panel .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-size: 12px; color: var(--mute); min-height: 22px; }
dv-panel .meta .who { font-weight: 600; }
/* 狭いパネルでも見出しの字を縦に割らない。入りきらない分は次の行へ回す */
dv-panel .meta > :not(.topic-title), dv-panel .meta .tools > * { white-space: nowrap; }
dv-panel .meta .tools { flex-wrap: wrap; justify-content: flex-end; }

// 前に見たときの中身（old）になかった行を返す。summary は欄ごと、list は項目、table は行（列が同じときだけ）
function freshOf(view, now, old) {

  if (view === "table") {
    if (!Array.isArray(now.rows) || !Array.isArray(old.rows) || JSON.stringify(now.columns) !== JSON.stringify(old.columns)) return null;
    return added(now.rows, old.rows);
  }
  if (view !== "summary") return null;
  const out = {};

// 要点（summary）：{ points, decided, open } を三つの欄に並べる。項目は文字列か { text, from: [元の発言の id] }。from があれば、押すと元の発言へ
class SummaryView extends View {
  render(v) {
    if (!v || typeof v !== "object" || Array.isArray(v)) return super.render(v);
    const cols = Object.keys(L.sum).filter((k) => Array.isArray(v[k]) && v[k].length);
    const item = (k) => (x, i) => {
      const from = Array.isArray(x?.from) ? [...new Set(x.from.filter((id) => typeof id === "string").map(headOf))] : [];
      return `<li${this.fresh?.[k]?.has(i) ? ' class="fresh"' : ""}${from.length ? ` data-from="${esc(from.join(" "))}" title="${esc(L.fromTitle)}"` : ""}>${linkify(textOf(x))}</li>`;
    };
    this.innerHTML = `<div class="body cols">${cols.map((k) => `<div><h3>${esc(L.sum[k])}</h3><ul>${v[k].map(item(k)).join("")}</ul></div>`).join("")}</div>`;
  }
}
customElements.define("dv-summary", SummaryView);
// 話題：仕事を束ねる見出し。data は { title, note? } か文字列。タイトルはパネルの見出しの行に出す（畳んでも見える）ので、ここは補足だけ
class TopicView extends View {
  render(v) {
    const note = typeof v === "object" && v ? v.note : "";
    this.innerHTML = note ? `<div class="body"><p>${linkify(note)}</p></div>` : "";
  }
}
customElements.define("dv-topic", TopicView);
customElements.define("dv-json", View);
customElements.define("dv-say", class extends TextView {});
customElements.define("dv-text", TextView);
customElements.define("dv-list", ListView);
customElements.define("dv-table", TableView);
customElements.define("dv-task", TaskView);
// 本体の view（最小限）。それ以外は利用者のパネル置き場の view を囲いの中で描く
const viewTag = (v) => customElements.get(`dv-${v}`) && /^[a-z][a-z0-9]*$/.test(v) ? `dv-${v}` : "dv-json";
const isUserView = (v) => S.views.has(v) && !customElements.get(`dv-${v}`);

// ── 利用者の view：sandbox の iframe（allow-scripts だけ）で描く。外のページやボードの API には触れない ──
const FRAME_H = new Map(); // パネル id -> いちばん最近の高さ（描き直しでがたつかないように）
const THEME = ["--bg", "--card", "--ink", "--mute", "--line", "--accent", "--accent-soft", "--warn", "--warn-soft", "--ok"];
const RUNTIME = `window.dyve = (() => {
  let fn = null, n = 0;
  const wait = new Map(), root = document.getElementById("root"), init = JSON.parse(document.getElementById("init").textContent);
  const ctx = {
    panel: init.panel,
    board: () => new Promise((ok) => { const k = ++n; wait.set(k, ok); parent.postMessage({ dyve: "board", k }, "*"); }),
    open: (id) => parent.postMessage({ dyve: "open", id }, "*"),
    send: (input) => parent.postMessage({ dyve: "send", input }, "*"),
    select: (value) => parent.postMessage({ dyve: "select", value }, "*"),
    selected: init.selected,
  };
  const draw = () => { if (!fn) return; try { fn(root, init.data, ctx); } catch (e) { root.textContent = init.err + e.message; } };
  addEventListener("message", (e) => {
    const m = e.data || {};
    if (m.dyve === "board") { wait.get(m.k)?.(m.panels); wait.delete(m.k); }
    if (m.dyve === "selected") { ctx.selected = m.selected; draw(); }
  });
  // 大きさが続けて変わったときの知らせ（ResizeObserver loop …）は描けなかったのではないので、描いたものを消さない
  addEventListener("error", (e) => { if (/ResizeObserver loop/.test(e.message)) return; root.textContent = init.err + e.message; });
  addEventListener("wheel", (e) => { if (!e.ctrlKey && !e.metaKey) return; e.preventDefault(); parent.postMessage({ dyve: "zoom", dy: e.deltaY, mode: e.deltaMode, x: e.clientX, y: e.clientY }, "*"); }, { passive: false });
  new ResizeObserver(() => parent.postMessage({ dyve: "size", h: document.documentElement.scrollHeight }, "*")).observe(document.body);
  return { view: (f) => { fn = f; draw(); } };
})();`;
function userFrame(p, data) {
  const f = document.createElement("iframe");
  f.className = "uview";
  f.setAttribute("sandbox", "allow-scripts");
  f.title = p.view;
  f.dataset.id = p.id;
  f.style.height = `${FRAME_H.get(p.id) || 60}px`;
  const cs = getComputedStyle(document.documentElement);
  const vars = THEME.map((v) => `${v}:${cs.getPropertyValue(v)}`).join(";");
  const safe = (t) => String(t).replace(/<\/(script)/gi, "<\\/$1");
  const init = JSON.stringify({ data, panel: p, selected: selectedFor(p, SELECTED, panelById), err: L.viewError("") }).replace(/</g, "\\u003c");
  f.srcdoc = `<!doctype html><meta charset="utf-8"><style>:root{${vars};color-scheme:dark}html,body{margin:0;background:transparent;color:var(--ink);font:13px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden}</style>` +
    `<body><div id="root"></div><script type="application/json" id="init">${init}<\/script><script>${RUNTIME}<\/script><script>${safe(S.views.get(p.view).src)}<\/script></body>`;
  return f;
}
// ── 選ぶ：利用者の view の中で人が選んだもの（予定の一件、札の一枚）を、同じものについてのほかのパネルに知らせる ──
// 選んだ中身を別のパネルが詳しく描く（選ぶ側と描く側を組み合わせられる）。画面の中だけのことで、操作ログには積まず、shell も走らせない。
// 見えるのは、同じものについてのパネル（about が同じ）と、互いに about したパネル。選んだパネル自身にも見える
const SELECTED = new Map(); // 選んだパネルの id -> { value, n }（n は選んだ順）
let selCount = 0;
const seesSelect = (q, p) => q.id === p.id || (q.about != null && q.about === p.about) || q.about === p.id || p.about === q.id;
// そのパネルに見える、いちばん新しく選ばれたもの：{ from: 選んだパネルの id, value }。なければ null
function selectedFor(q, selected, byId) {
  let best = null;
  for (const [id, s] of selected) {
    const p = byId(id);
    if (p && seesSelect(q, p) && (!best || s.n > best.n)) best = { from: id, value: s.value, n: s.n };
  }
  return best ? { from: best.from, value: best.value } : null;
}
// 選ばれたものを描く view か：ソースに selected と書いてあるもの（ctx.selected を読む）。描く前でもわかるように、ソースで見分ける
const followsSelect = (view) => /\bselected\b/.test(S.views.get(view)?.src || "");
function selectIn(p, value) {
  SELECTED.set(p.id, { value, n: ++selCount });
  const near = S.panels.filter((q) => q.id !== p.id && isUserView(q.view) && followsSelect(q.view) && seesSelect(q, p));
  // 畳んであって見えない描く側は開く（人が押して選んだので。開いたことは並びに覚える）
  const folded = near.filter((q) => isFolded(q.id));
  if (folded.length) {
    LAYOUT.fold = { ...LAYOUT.fold, ...Object.fromEntries(folded.map((q) => [q.id, false])) };
    saveLayout();
    render();
    applyLayout();
  }
  // 囲いは作り直さず、選ばれたものだけ渡して描き直させる（選ばれたものを読まない view は、読んでいるところが動かないようにそのまま）
  for (const f of $$("iframe.uview")) {
    const q = panelById(f.dataset.id);
    if (q && followsSelect(q.view) && seesSelect(q, p)) f.contentWindow?.postMessage({ dyve: "selected", selected: selectedFor(q, SELECTED, panelById) }, "*");
  }
  // 描く側が画面の外なら、近いところまで寄せる（見えていれば動かさない）
  const el = near.map((q) => panelOf(q.id)).find(Boolean), r = el?.getBoundingClientRect();
  if (r && (r.bottom < 0 || r.top > innerHeight || r.right < 0 || r.left > innerWidth)) el.scrollIntoView({ block: "nearest", inline: "nearest" });
}

// 囲いの中からの知らせ：高さ・ボードを読みたい・あるパネルを見せたい・ボードの倍率を変えたい・これを送りたい・これを選んだ（書くことも、自分で送ることもできない）
addEventListener("message", (e) => {
  const f = $$("iframe.uview").find((x) => x.contentWindow === e.source);
  const m = e.data || {};
  if (!f || typeof m.dyve !== "string") return;
  if (m.dyve === "size" && Number.isFinite(m.h)) {
    const h = Math.min(4000, Math.max(20, Math.ceil(m.h)));
    FRAME_H.set(f.dataset.id, h);
    f.style.height = `${h}px`;
  } else if (m.dyve === "board") {
    const panels = S.panels.map((p) => (S.feeds[p.id]?.data !== undefined ? { ...p, data: S.feeds[p.id].data } : p));
    e.source.postMessage({ dyve: "board", k: m.k, panels }, "*");
  } else if (m.dyve === "open" && typeof m.id === "string") {
    reveal(panelOf(m.id));
  } else if (m.dyve === "send") {
    // 囲いの中からは送れない。送りたい中身を預かって見せるだけで、送るのは人が押してから
    const p = S.panels.find((x) => x.id === f.dataset.id);
    if (!p?.send || m.input == null || JSON.stringify(m.input).length > 100 * 1024) return;
    PENDING.set(p.id, m.input);
    refreshSend(p.id);
  } else if (m.dyve === "select") {
    const p = panelById(f.dataset.id);
    // JSON にできて、大きすぎないものだけ（囲いの中から来るので、形は信じない）
    let size = Infinity;
    try { size = JSON.stringify(m.value)?.length ?? Infinity; } catch {}
    if (p && m.value != null && size <= 100 * 1024) selectIn(p, m.value);
  } else if (m.dyve === "zoom" && [m.dy, m.x, m.y].every(Number.isFinite)) {
    const r = f.getBoundingClientRect(), s = r.width / (f.offsetWidth || r.width) || 1;
    zoomAround(zoomNow() * wheelFactor(m.dy, m.mode), r.left + m.x * s, r.top + m.y * s);
  }
});

// ── 送り出し：パネルの send（shell コマンド）に、人が送る。何に何を送るかが見えるように出しておく ──
const DRAFT = new Map(); // パネル id -> 書きかけ（描き直しても残す）
const PENDING = new Map(); // パネル id -> 利用者の view が送りたいと言ってきた中身（人が押すまで送らない）
const sendText = (v) => (typeof v === "string" ? v : JSON.stringify(v, null, 2));
function sendRow(p) {
  const st = S.feeds[p.id]?.send || {};
  const row = document.createElement("div");
  row.className = "send-row";
  const line = document.createElement("div");
  line.className = "src-line";
  const time = (at) => new Date(at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const when = st.running ? L.sending : st.error ? `⚠ ${st.error}` : st.at ? `${L.sentAt(time(st.at))}${st.out ? `　${st.out}` : ""}` : "";
  line.textContent = `→ $ ${p.send.shell}${when ? `　${when}` : ""}`;
  row.append(line);
  const go = document.createElement("div");
  go.className = "send-go";
  const btn = (act, text, title) => { const b = document.createElement("button"); b.dataset.act = act; b.textContent = text; if (title) b.title = title; return b; };
  if (!st.approved) go.append(btn("allowsend", L.allowSend, L.allowSendTitle));
  else if (PENDING.has(p.id)) {
    const pre = document.createElement("pre");
    pre.textContent = sendText(PENDING.get(p.id));
    go.append(pre, btn("send", p.send.label || L.send), btn("unsend", L.unsend));
  } else {
    const ta = document.createElement("textarea");
    ta.className = "send-in";
    ta.rows = 1;
    ta.placeholder = L.sendHint;
    ta.value = DRAFT.get(p.id) || "";
    go.append(ta, btn("send", p.send.label || L.send));
  }
  row.append(go);
  return row;
}
// 送り出しの行だけ描き直す（利用者の view の囲いは作り直さない）
function refreshSend(id) {
  const p = S.panels.find((x) => x.id === id), old = $$("dv-panel").find((x) => x.dataset.id === id)?.querySelector(":scope > .send-row");
  if (p?.send && old) old.replaceWith(sendRow(p));
}
document.addEventListener("input", (e) => {
  const id = e.target.matches?.("textarea.send-in") && e.target.closest("dv-panel")?.dataset.id;
  if (id) DRAFT.set(id, e.target.value);
});
async function sendOut(p) {
  $("#err").textContent = "";
  const input = PENDING.has(p.id) ? PENDING.get(p.id) : DRAFT.get(p.id) || "";
  const r = await fetch("/api/send", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: p.id, input }) });
  const b = await r.json();
  if (!b.ok) { $("#err").textContent = L.refused(b.message); return; }
  PENDING.delete(p.id);
  DRAFT.delete(p.id);
  refreshSend(p.id);
}
// 書いている最中に描き直されても、続きを書けるようにする
function typingNow() {
  const ta = document.activeElement?.matches?.("textarea.send-in") ? document.activeElement : null;
  return ta && { id: ta.closest("dv-panel")?.dataset.id, at: [ta.selectionStart, ta.selectionEnd] };
}
function backToTyping(t) {
  const next = t?.id && $$("dv-panel").find((x) => x.dataset.id === t.id)?.querySelector(":scope > .send-row textarea.send-in");
  if (next && next !== document.activeElement) { next.focus({ preventScroll: true }); next.setSelectionRange(...t.at); }
}

// ── パネルの封筒 ──
class PanelEl extends HTMLElement {}
customElements.define("dv-panel", PanelEl);

function markOf(p) {
  if (S.marks[p.id]) return S.marks[p.id];
  if (!isPerson(p.by) && p.aiSeq && p.aiSeq > (S.seen[p.id] || 0)) return "notice";
  return null;
}

const MOVABLE = (p) => !["say", "summary", "layout"].includes(p.view);
// root：画面に並ぶパネルそのもの。畳むのは並んでいる枠の方なので、中では畳まない
// face：行の面（役割で並べる）。cell：面の中の一枚（見出しは中身の種類、置いた人は小さな丸。ref は行の中の行の記号）
function panelEl(p, kids, { root = false, face = false, cell = false, ref = null } = {}) {
  const el = document.createElement("dv-panel");
  const mark = markOf(p);
  const foldable = !root && p.view !== "say" && p.view !== "summary";
  const folded = foldable && isFolded(p.id);
  face = face && isRow(p);
  const plan = face ? benchPlan(p, S.panels, kids, turnOf, { placed: (id) => !!TPOS[id], marked: (id) => !!markOf(panelById(id) || {}) }) : null;
  // 比べる組：選んだものに印、選ばなかったものは薄く
  const cmp = S.cmp?.[p.id], picked = cmp?.picked === p.id;
  el.className = [isPerson(p.by) && "human", p.pinned && "pinned", mark, folded && "folded", picked && "picked", cmp?.picked && !picked && "unpicked",
    !mark && Date.now() - (JUST.get(p.id) || 0) < 1500 && "seen-now", face && "face-root"].filter(Boolean).join(" ");
  el.dataset.id = p.id;
  if (folded) el.title = L.unfoldHint;
  const tags = [];
  if (isWorking(p.id)) tags.push(`<span class="spin" role="img" aria-label="${esc(L.working)}"></span>`);
  // 面の頭の状態は番の一語だけ（済み・知らせの印と並べると、どちらが本当かわからなくなる）
  if (face) {
    const tn = turnOf(p), n = plan.lanes.you.length;
    if (tn) tags.push(`<span class="turnchip t-${tn}" title="${esc(L.turn[tn])}">${esc(tn === "you" && n ? L.turnCount(L.turnWord[tn], n) : L.turnWord[tn])}</span>`);
  }
  if (mark && !face) tags.push(`<span class="mark ${mark}">${L.mark[mark]}</span>`);
  if (p.to) tags.push(`<span class="to">→ ${ini(p.to, "sm")}${esc(callOf(p.to))}</span>`);
  if (!face && p.state === "done") tags.push(`<span class="mark done">${L.state.done}</span>`);
  else if (!face && p.state && !mark && !(cell && p.state === "proposal")) tags.push(`<span class="mark">${L.state[p.state]}</span>`);
  if (picked) tags.push(`<span class="mark done">${esc(L.picked)}</span>`);
  const edited = p.rev !== p.seq && p.view === "say";
  // 畳んだら、開かなくても中身がわかる一行を見出しに出す
  const gist = folded ? gistOf(p) : "";
  if (gist) tags.push(`<span class="gist" title="${esc(gist)}">${esc(gist)}</span>`);
  else if (folded && isDone(p)) tags.push(`<span class="fold">${esc(L.folded(descOf(p.id, kids).filter((x) => !isPerson(x.by)).length))}</span>`);
  const feed = S.feeds[p.id];
  const data = feed?.data !== undefined ? feed.data : p.data;
  if (p.source && feed?.running) tags.push(`<span class="spin" role="img" aria-label="${esc(L.running)}"></span>`);
  const kind = p.state === "proposal" ? "proposal" : p.view;
  const head = cell
    ? `<span class="kind">${KIND_ICON[kind] || KIND_ICON.any}${esc(L.kind[kind] ?? p.view)}</span>${ref ? `<span class="ref" title="${esc(L.refTitle(ref))}">${esc(ref)}</span>` : ""}`
    : isRow(p)
    ? `<span class="topic-title">${esc(p.key)}　${esc(rowName(p))}</span>`
    : p.view === "topic"
    ? `<span class="topic-title" title="${esc(`${topicTitle(p)}（${who(p.by)}）`)}">${esc(topicTitle(p))}</span>`
    : `<span class="who">${esc(who(p.by))}</span>`;
  el.innerHTML = `<div class="meta">${head}${tags.join("")}
    ${p.state === "proposal" ? `<button data-act="accept">${L.accept}</button>` : ""}
    ${cmp && !picked ? `<button data-act="pick" title="${esc(L.pickTitle)}">${esc(L.pick)}</button>` : ""}
    ${p.source && !feed?.approved ? `<button data-act="allow" title="${esc(L.allowTitle)}">${L.allow}</button>` : ""}
    <span class="tools">
      ${edited ? `<button class="icon" data-act="orig">${L.orig}</button>` : ""}
      ${p.point && p.point.how !== "pick" && isPerson(p.by) ? `<button class="icon" data-act="unpoint" title="${esc(L.unpointTitle)}">${esc(L.unpoint)}</button>` : ""}
      ${p.view === "say" && S.panels.some((x) => x.into === p.id) ? `<button class="icon" data-act="split" title="${esc(L.splitTitle)}">${L.split}</button>` : ""}
      ${SIZES[p.id] ? `<button class="icon" data-act="unsize">${L.resetSize}</button>` : ""}
      ${(p.view === "topic" || face) && kids(p.id).some((k) => TPOS[k.id]) ? `<button class="icon" data-act="unpos">${L.resetPos}</button>` : ""}
      ${p.source && feed?.approved ? `<button class="icon" data-act="runnow">${L.runNow}</button>` : ""}
      ${p.view === "topic" && p.data?.bundled ? `<button class="icon" data-act="unbundle" title="${esc(L.unbundleTitle)}">${L.unbundle}</button>` : ""}
      ${MOVABLE(p) ? `<button class="icon" data-act="move" title="${esc(L.moveTitle)}">${L.moveTo}</button>` : ""}
      ${foldable ? `<button class="icon" data-act="fold" aria-pressed="${folded}" title="${folded ? L.unfold : L.fold}" aria-label="${folded ? L.unfold : L.fold}">${folded ? ICON.restore : ICON.min}</button>` : ""}
      <button class="icon" data-act="pin" aria-pressed="${!!p.pinned}" title="${p.pinned ? L.unpin : L.pin}" aria-label="${p.pinned ? L.unpin : L.pin}">${ICON.pin}</button>
      <button class="icon" data-act="drop" title="${L.drop}" aria-label="${L.drop}">${ICON.drop}</button>
    </span>${cell ? `<span class="by" title="${esc(who(p.by))}">${ini(isPerson(p.by) ? L.you : p.by, "sm")}</span>` : ""}</div>`;
  // 流し込むコマンドは、何を走らせるかが見えるように出しておく
  if (p.source) {
    const line = document.createElement("div");
    line.className = "src-line";
    const when = feed?.error ? `⚠ ${feed.error}` : feed?.at ? L.ranAt(new Date(feed.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })) : "";
    line.textContent = `$ ${p.source.shell}　${p.source.every ? L.every(p.source.every) : L.once}${when ? `　${when}` : ""}`;
    el.append(line);
  }
  if (isUserView(p.view)) {
    el.append(userFrame(p, data));
  } else {
    const view = document.createElement(viewTag(p.view));
    view.panel = p;
    const old = prevOf(p);
    view.fresh = old === undefined ? null : freshOf(p.view, data, old);
    view.data = data;
    el.append(view);
  }
  // 読んでから送るので、送り出しは中身の下に置く
  if (p.send) el.append(sendRow(p));
  if (face) { el.append(benchBox(p, kids, plan)); return el; }
  const table = p.view === "topic" || isRow(p);
  const rows = table ? kids(p.id).filter(isRow) : [];
  if (rows.length) {
    const tb = document.createElement("div");
    tb.className = "rows";
    for (const r of rows) tb.append(...rowEls(r));
    el.append(tb);
  }
  const box = document.createElement("div");
  box.className = table ? "kids free" : "kids";
  for (const k of kids(p.id)) {
    if (table && isRow(k)) continue;
    const c = panelEl(k, kids);
    if (!table) { box.append(c); continue; }
    // 話題の中はます目の一つ分（cell）に入れ、右下に大きさの角を付ける
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.dataset.id = k.id;
    cell.dataset.view = k.view;
    const sizer = document.createElement("div");
    sizer.className = "sizer";
    sizer.title = L.size;
    cell.append(c, sizer);
    box.append(cell);
    FREE.observe(c);
  }
  el.append(box);
  return el;
}

// ── 話題の中のます目：画面と同じ決まりで並べる ──
// 置き場所のあるものはそこへ（重なったら下へずらす）、まだないものはその下の空いたところへ順に詰める
const cellsIn = (box) => [...box.children].filter((c) => c.matches(".cell"));
function freeGrid(box) {

    const inside = g.items.flatMap((p) => [p, ...desc(p.id)]);
    const note = !g.src && root.view === "topic" ? lineOf(root.data?.note) : "";
    const results = inside.filter((p) => !isPerson(p.by) && !["task", "topic"].includes(p.view)).sort((a, b) => b.rev - a.rev);
    const line = note || [...results.filter((p) => !STAFF.includes(p.by)), ...results].map((p) => lineOf(dataOf(p), L)).find(Boolean) || "";
    const gs = $(".tile-head .gist", t);

  for (const k of LAYOUT.out || []) {

    $(".tile-head .gist", t).textContent = !p ? "" : isRow(p) ? (k === hereFace() ? L.faceHere : L.faceLeft) : gistOf(p);

  if (reading.length) relayoutFree();
  backToMarks(reading);
  backToPanel(read);
  if (reading.length || read) requestAnimationFrame(() => { backToMarks(reading); backToPanel(read); });
  backToTyping(typing);
  sendFocus();
}

// いまいる面：開いている面のうち、いちばん後に開いたもの（マネージャが人の話についていって開く）
const faces = () => (LAYOUT.out || []).filter((id) => isRow(panelById(id)));

const topOfId = (id) => { let p = panelById(id); const seen = new Set(); while (p?.about && !seen.has(p.id) && panelById(p.about)) { seen.add(p.id); p = panelById(p.about); } return p; };

function talkingKeys(keys) {
  const byId = new Map(S.panels.map((p) => [p.id, p]));
  const rootOf = (p) => { const seen = new Set(); while (p?.about && byId.has(p.about) && !seen.has(p.id)) { seen.add(p.id); p = byId.get(p.about); } return p; };
  const out = [];
  const says = S.panels.filter((p) => p.view === "say" && isPerson(p.by) && !p.into).slice(-6).reverse();
  for (const s of says) {
    if (keys.includes(s.id) && !out.includes(s.id)) out.push(s.id);
    for (const x of S.panels) {
      if (x.about !== s.id && !(Array.isArray(x.data?.from) && x.data.from.includes(s.id))) continue;
      const r = rootOf(x);
      if (r && keys.includes(r.id) && !out.includes(r.id)) out.push(r.id);

  return out.slice(0, 3);

const minRows = () => { const d = DENSITY[dens()]; return Math.max(1, Math.ceil((32 + d.gap) / (d.row + d.gap))); };

// 画面に並ぶパネル：組み込みのものと、取り出したものと、話題などのまとまり
const allTiles = () => [...BUILTIN, ...(LAYOUT.out || []), ...(S.groupTiles || [])];
// 浮かせるもの。幅の狭い画面は一列に並ぶので浮かせない
const floatMode = () => (FLOAT_MODES.includes(LAYOUT.float?.mode) ? LAYOUT.float.mode : FLOAT_MODES[0]);
const isFloat = (k) => FLOATS.includes(k) && floatMode() !== "off" && !narrow();
// ボードのます目に並ぶもの
const gridTiles = () => allTiles().filter((k) => !isFloat(k));
const isOut = (k) => (LAYOUT.out || []).includes(k);
const isGroupTile = (k) => !BUILTIN.includes(k) && !isOut(k);
// ── 自動の並び：置き場所を決めていない枠（人も AI も動かしていないもの）は、並べるたびに画面が置き直す ──
// 順番は導く：いまの話題 → 印のあるもの → 新しいもの → 済み（畳んだもの）。幅は中身の形から、高さは中身を測って決める。
// 一画面の幅の中で、上から空いているところへ順に詰める。覚えないので、中身が増えれば枠も伸びる
const AUTO = {}; // key -> { x, y, w, h }
// 面がどの側に置かれたか（left | right | below）。閉じたら忘れる
const FACE_SIDE = {};
const isAuto = (k) => !BUILTIN.includes(k) && !LAYOUT.pos?.[k];
const FRAC = [1 / 4, 1 / 3, 1 / 2, 2 / 3, 1];
// パネル一枚の幅の好み（ピクセル）。パネルの管理で既定の幅を決めていればそれ
function prefPx(p) {
  const d = sizeOf(p.view);
  if (d.w) return d.w;
  const v = p.data;
  if (p.view === "table" && Array.isArray(v?.columns)) return Math.min(1200, v.columns.length * 120 + 40);
  if (p.view === "text" || p.view === "say") return textOf(v).length > 120 ? 560 : 360;
  return { list: 360, summary: 600, task: 340, topic: 360 }[p.view] ?? 480;
}
// 枠の幅の好み：中のパネルを横に並べたいぶん（比べる・順番の組は横に並ぶ）
function groupPx(k) {
  const root = panelById(k);
  if (!root) return 360;
  const kids = S.kids ? S.kids(k) : [];
  // 面は三つの帯（やること・主役・残り）が並ぶ幅。脇に入らなければ、表の下に出る
  if (isRow(root) && isOut(k) && S.kids) {
    const plan = benchPlan(root, S.panels, S.kids, turnOf, { placed: (id) => !!TPOS[id] });
    const lanes = Object.values(plan.lanes).some((a) => a.length);
    if (plan.main) return (lanes ? BENCH_PX.lanes : 0) + Math.max(BENCH_PX.main, prefPx(plan.main.p)) + (plan.rest.length ? BENCH_PX.rest : 0) + 60;
  }
  const own = root.view === "topic" || root.view === "say" ? 0 : prefPx(root);
  const rows = relRows(kids).map((r) => r.reduce((a, p) => a + prefPx(p) + 8, 0));
  return Math.max(own, 0, ...rows) + 40;
}
function autoW(k, m) {
  const n = dens(), need = Math.ceil((groupPx(k) + m.gap) / m.sx);
  let w = Math.round((FRAC.find((f) => f * n >= need) ?? 1) * n);
  if (isFolded(k)) w = Math.min(w, Math.round(n / 3));
  if (k === S.talking?.[0]) w = Math.max(w, Math.round(n / 2));

// 中身の高さ（ます目の行の数）。中身の拡大率も掛かった見えている大きさで測る（ボードの倍率は外す）
function needRows(t, m) {
  const head = $(".tile-head", t), body = $(".tile-body", t);
  const kids = [...body.children].filter((c) => c.getClientRects().length);
  if (!kids.length) return 2;
  const top = Math.min(...kids.map((c) => c.getBoundingClientRect().top)), bottom = Math.max(...kids.map((c) => c.getBoundingClientRect().bottom));
  const cs = getComputedStyle(body), z = zoomOf(t.dataset.tile);

function autoOrder(keys) {

  const marked = (k) => !!$(".tile-head .badge", tileOf(k))?.textContent;

    $(".tile-body", t).style.zoom = String(zoomOf(k));

// 話題の中のパネル：見出しでつまんで動かし、右下の角で大きさを変える（画面と同じ）。動かしたあとの click は捨てる（畳み・印の解除が走らないように）
let dragged = false;
grid.addEventListener("pointerdown", (e) => {
  const head = e.target.closest(".kids.free > .cell > dv-panel > .meta");
  const sizer = e.target.closest(".kids.free > .cell > .sizer");
  if ((!head && !sizer) || e.button !== 0) return;
  if (head && e.target.closest("button, a, input, select, summary")) return;
  const handle = head || sizer, cell = handle.closest(".cell"), box = cell.parentElement, k = cell.dataset.id;
  // 面の中の、行の中の行の結果は動かさない（置き場所はその行の面のもの）
  if (cell.dataset.ref) return;
  const g = freeGrid(box);
  if (g.cols < 2 || !box._pos?.[k]) return;
  dragCells(e, {
    handle, k,
    start: Object.fromEntries(Object.entries(box._pos).map(([x, p]) => [x, { ...p, placed: true }])),
    at: freeAt(box, g),
    step: head
      ? (p, dx, dy) => ({ ...p, x: clamp(p.x + dx, 1, g.cols + 1 - p.w), y: Math.max(1, p.y + dy) })
      : (p, dx, dy) => ({ ...p, w: clamp(p.w + dx, 2, g.cols + 1 - p.x), h: clamp(p.h + dy, 2, 400), auto: false }),
    arrange: (pos, m) => arrange(pos, g.cols, m),
    place: (pos) => placeFree(box, pos),
    scroller: box.closest(".tile-body"),
    onStart: () => { box.classList.add("editing"); cell.classList.add("dragging"); },
    onEnd: (last, moved) => {
      box.classList.remove("editing");
      cell.classList.remove("dragging");
      if (!moved) return;
      dragged = true;
      // 動かしたら、話題の中の全部の置き場所を覚える（大きさを決めたものだけ高さも）
      // 面の左の帯（札）と、行の中の行の結果は覚えない（いつも帯に置く）
      const keepOut = new Set(cellsIn(box).filter((c) => c.dataset.ref || !panelById(c.dataset.id)).map((c) => c.dataset.id));
      for (const [id, p] of Object.entries(last)) if (!keepOut.has(id)) TPOS[id] = { x: p.x, y: p.y, w: p.w, ...(p.auto ? {} : { h: p.h }) };
      pushLayout();
      layoutFree(box);
    },
  });
});

// 利用者の view：変わったものだけ読み直す
async function loadViews(list) {
  const names = new Set(list.map((v) => v.name));
  for (const k of [...S.views.keys()]) if (!names.has(k)) S.views.delete(k);
  await Promise.all(list.filter((v) => S.views.get(v.name)?.hash !== v.hash).map(async (v) => {
    const r = await fetch(`/api/views/${encodeURIComponent(v.name)}`);
    if (r.ok) S.views.set(v.name, { hash: v.hash, src: await r.text() });
  }));
}

async function load() {
  const r = await fetch("/api/board");
  const b = await r.json();
  // 立て直して画面の版が変わった。書きかけや聞いている最中は待つ（次の知らせでまた見る）
  if (b.build) {
    S.build ??= b.build;
    if (b.build !== S.build && !$("#msg").value.trim() && !S.listening) return location.reload();
  }
  if (b.name !== S.name) S.seen = keep(`seen:${b.name || ""}`, b.name ? {} : keep("seen", {}));
  mergeSeen(b.seen, false);
  Object.assign(S, { panels: b.panels, marks: b.marks, live: b.live, names: b.names, initials: b.initials || {}, calls: b.calls || {}, title: b.title, name: b.name, feeds: b.feeds || {}, panelSet: b.panelSet, tune: b.tune || S.tune });
  drawTune();
  const adopted = adoptLayout(b.layout);
  // 並びのないボード（新しいボード）は、ブラウザに覚えた組み込みのパネルの並びだけを下敷きにする（id はボードごとに振られるため）
  if (!b.layout) {
    const own = (o) => Object.fromEntries(Object.entries(o || {}).filter(([k]) => BUILTIN.includes(k)));
    const base = { pos: own(LAYOUT.pos), zoom: own(LAYOUT.zoom), fold: own(LAYOUT.fold), pinned: (LAYOUT.pinned || []).filter((k) => BUILTIN.includes(k)), density: LAYOUT.density, ...(LAYOUT.float ? { float: LAYOUT.float } : {}) };
    for (const k of Object.keys(LAYOUT)) delete LAYOUT[k];
    Object.assign(LAYOUT, base, { out: [] });
    for (const o of [TPOS, SIZES]) for (const k of Object.keys(o)) delete o[k];
  }
  await loadViews(b.views || []);
  S.ready = true;
  if (SHOT && SHOT !== "board") return renderShot();
  const boardName = b.boardTitle || b.name;
  document.title = boardName ? `${b.title}・${boardName}` : b.title;
  if (boardName) $("#boardsLink").title = L.boardsNow(boardName);
  render();
  renderLive();
  if (adopted) { applyLayout(); relayoutFree(); }
  pushLayout();
}

// ── パネルを移す・親のパネルにまとめる：about を変えるだけなので、人の操作としてログに残り、AI も panel_edit で同じことができる ──
// 移せる先：話題のうち、いまの親と、自分とその下のものを除く
function moveTargets(panels, id) {
  const of = new Map(panels.map((p) => [p.id, p]));
  const under = (x) => { const seen = new Set(); for (let c = x; c && !seen.has(c.id); c = of.get(c.about)) { if (c.id === id) return true; seen.add(c.id); } return false; };
  return panels.filter((p) => p.view === "topic" && p.id !== of.get(id)?.about && !under(p));
}
// 一緒にまとめられるもの：同じ親の下のものと、画面に並ぶもの（発言・要点・並びは除く。自分の親は除く）
function bundleCandidates(panels, id) {
  const of = new Map(panels.map((p) => [p.id, p])), cur = of.get(id);
  const ok = (p) => !["say", "summary", "layout"].includes(p.view) && p.id !== id && p.id !== cur?.about;
  return panels.filter((p) => ok(p) && (!p.about || p.about === cur?.about));
}
// 親のパネルの置き場所：全部が同じ親の下ならその中、ばらばらなら外。元の親は data.bundled に残し、ほどくと戻る
function bundlePlan(panels, ids) {
  const of = new Map(panels.map((p) => [p.id, p]));
  const abouts = new Set(ids.map((i) => of.get(i)?.about ?? null));
  return { about: abouts.size === 1 ? [...abouts][0] : null, bundled: Object.fromEntries(ids.map((i) => [i, of.get(i)?.about ?? null])) };
}
async function movePanel(id, about) {
  const p = panelById(id);
  if (!p) return null;
  delete TPOS[id];
  LAYOUT.out = (LAYOUT.out || []).filter((x) => x !== id);
  // rel は同じ親の下のものとの関係なので、移したら外す
  const r = await op("edit", { id, about, ...(p.rel ? { rel: null } : {}) });
  pushLayout();
  return r;
}
async function bundle(ids, title) {
  const { about, bundled } = bundlePlan(S.panels, ids);
  const made = await op("add", { view: "topic", data: { title, bundled }, ...(about ? { about } : {}) });
  if (made) for (const id of ids) await movePanel(id, made.op.panel.id);
}
async function unbundle(p) {
  const inside = S.panels.filter((x) => x.about === p.id), back = p.data.bundled;
  const mine = inside.filter((x) => x.id in back);
  for (const x of mine) await movePanel(x.id, panelById(back[x.id]) ? back[x.id] : null);
  // あとから置かれたものがあれば、親のパネルは残す
  if (mine.length === inside.length) await op("drop", { id: p.id });
}
const movePop = $("#movePop");
const panelLabel = (p) => {
  if (p.view === "topic") return topicTitle(p);
  const d = p.data, t = Array.isArray(d) ? d.join("・") : d?.text ?? d?.title ?? textOf(d);
  return `${who(p.by)}・${String(t).slice(0, 30)}`;
};
function openMove(p, btn) {
  const targets = moveTargets(S.panels, p.id), isTopic = (c) => (c.view === "topic" ? 0 : 1), cand = bundleCandidates(S.panels, p.id).sort((a, b) => isTopic(a) - isTopic(b));
  const go = (id, label) => `<button data-move="${esc(id)}">${esc(label)}</button>`;
  movePop.innerHTML = `<h3>${esc(L.moveHead)}</h3>${p.about ? go("", L.moveOut) : ""}${p.about && !isOut(p.id) ? `<button data-show>${esc(L.moveShow)}</button>` : ""}${targets.map((t) => go(t.id, topicTitle(t))).join("")}${!p.about && !targets.length ? `<p class="empty">${esc(L.moveNone)}</p>` : ""}` +
    `<h3>${esc(L.bundleHead)}</h3><form>${cand.map((c) => `<label><input type="checkbox" value="${esc(c.id)}"><span>${esc(panelLabel(c))}</span></label>`).join("")}` +
    `<input type="text" aria-label="${esc(L.bundleTitle)}" placeholder="${esc(L.bundleTitle)}" value="${esc(L.bundleName)}"><button>${esc(L.bundleGo)}</button></form>`;
  movePop.dataset.id = p.id;
  movePop.showPopover();
  const r = btn.getBoundingClientRect(), w = movePop.offsetWidth, h = movePop.offsetHeight;
  movePop.style.left = `${clamp(r.right - w, 8, Math.max(8, innerWidth - w - 8))}px`;
  movePop.style.top = `${clamp(r.bottom + h + 8 > innerHeight ? r.top - h - 4 : r.bottom + 4, 8, Math.max(8, innerHeight - h - 8))}px`;
}
movePop.addEventListener("click", (e) => {
  if (e.target.closest("[data-show]")) { movePop.hidePopover(); return takeOut(movePop.dataset.id); }
  const to = e.target.closest("[data-move]")?.dataset.move;

});

});

// ── 操作 ──
const onClick = async (e) => {
  const ta = e.target.closest("[data-to]");
  if (ta) {
    setTo(S.to === ta.dataset.to ? null : ta.dataset.to);
    if (S.to && ta.dataset.task) reveal(panelOf(ta.dataset.task));
    return;
  }
  // 要点（summary）の行：元の発言へ（押したので、要点は見たことにする）
  const li = e.target.closest("li[data-from]");
  if (li && !e.target.closest("a")) {
    const from = li.dataset.from.split(" "), sp = panelById(li.closest("dv-panel")?.dataset.id);
    if (sp && markOf(sp) === "notice") { S.seen[sp.id] = sp.aiSeq; saveSeen(); render(); }
    from.map(panelOf).filter(Boolean).forEach((x, i) => (i ? flash(x) : reveal(x)));
    return;
  }
  // 行の ▸：面を開く・閉じる（人が開き直すのはいつでもよい）
  const fb = e.target.closest("button[data-face]");
  if (fb) {
    const id = fb.dataset.face;
    if (faceOpen(id)) { LAYOUT.out = LAYOUT.out.filter((x) => x !== id); delete LAYOUT.pos?.[id]; saveLayout(); applyLayout(); return render(); }
    return takeOut(id);
  }
  const ab = e.target.closest('[data-act="accept-row"]');
  if (ab) return op("edit", { id: ab.dataset.id, state: "done", rev: Number(ab.dataset.rev) });
  // 行を押したら、その行は見たことにする
  const rw = e.target.closest(".row[data-row]");
  if (rw && !e.target.closest("a, button")) {
    const t = panelById(rw.dataset.row);
    if (t && markOf(t) === "notice") { S.seen[t.id] = t.aiSeq; saveSeen(); render(); }
    if (faceOpen(t?.id)) reveal(tileOf(t.id));
    return;
  }
  // トークの返事の「ほか N 件」：その発言の返事を全部出す・まとめる
  const rb = e.target.closest("[data-replies]");
  if (rb) {
    if (!REPLY_OPEN.delete(rb.dataset.replies)) REPLY_OPEN.add(rb.dataset.replies);
    return render();
  }
  const gb = e.target.closest("[data-goto]"), go = gb?.dataset.goto;
  // まとまりの見出しはトークの発言へ、状況のアイコンはその仕事へ、発言の印は指したパネル・拾われた要点の行へ、トークの返事はその答えへ
  if (go) {
    showPanel(go);
    if (gb.dataset.item) for (const x of $$(`dv-summary li[data-from~="${CSS.escape(gb.dataset.item)}"]`)) flash(x);
    return;
  }
  const el = e.target.closest("dv-panel");
  if (!el) return;
  const p = S.panels.find((x) => x.id === el.dataset.id);
  if (!p) return;
  const act = e.target.closest("button")?.dataset.act;
  if (act === "allow") return op("edit", { id: p.id, source: p.source });
  if (act === "allowsend") return op("edit", { id: p.id, send: p.send });
  if (act === "send") return sendOut(p);
  if (act === "unsend") { PENDING.delete(p.id); return refreshSend(p.id); }
  if (act === "runnow") { fetch("/api/feeds/run", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: p.id }) }); return; }
  if (act === "move") return openMove(p, e.target.closest("button"));
  if (act === "unbundle") return unbundle(p);
  if (act === "fold") return setFold(p.id, !isFolded(p.id));
  if (!act && el.classList.contains("folded")) return setFold(p.id, false);
  if (act === "unsize") { delete SIZES[p.id]; pushLayout(); return render(); }
  if (act === "unpos") { for (const k of tree()(p.id)) delete TPOS[k.id]; pushLayout(); return render(); }
  if (act === "pin") {
    if (!p.pinned && tileOf(p.id) && isAuto(p.id)) { LAYOUT.pos = { ...LAYOUT.pos, [p.id]: keepSize(p.id, posOf(p.id)) }; saveLayout(); }
    return op("edit", { id: p.id, pinned: !p.pinned });
  }
  // 受け入れるのは、人が見たときの提案（あいだに書き換えられていたら断られる）
  if (act === "accept") return op("edit", { id: p.id, state: "done", rev: p.rev });
  // 押して決める：声で言うのと同じ道で届くように、選んだことを人の発言として置く（選んだ印は、その発言から画面が導く）
  if (act === "pick") return op("add", { view: "say", data: L.pickSay(clipText(nameOf(p), 40)), point: { id: p.id, how: "pick" } });
  if (act === "unpoint") return op("edit", { id: p.id, point: null });
  if (act === "drop") { if (confirm(L.dropAsk)) op("drop", { id: p.id }); return; }
  if (act === "split") {
    const h = await (await fetch(`/api/history?id=${encodeURIComponent(p.id)}`)).json();
    await op("edit", { id: p.id, data: h[0]?.panel.data });
    for (const x of S.panels.filter((q) => q.into === p.id)) await op("edit", { id: x.id, into: null });
    return;
  }
  if (act === "orig") {
    const ex = $(":scope > .orig", el);
    if (ex) { ex.remove(); e.target.textContent = L.orig; return; }
    const h = await (await fetch(`/api/history?id=${encodeURIComponent(p.id)}`)).json();
    const d = document.createElement("div");
    d.className = "orig";
    d.textContent = textOf(h[0]?.panel.data);
    $(":scope > .kids", el).before(d);
    e.target.textContent = L.origHide;
    return;
  }
  // トークの発言を押すと、それについて置かれたものを話題の欄で見せる
  if (el.closest("#timeline")) {
    const t = S.panels.find((x) => Array.isArray(x.data?.from) && x.data.from.includes(p.id));
    let top = t; while (top?.about && S.panels.some((x) => x.id === top.about)) top = S.panels.find((x) => x.id === top.about);
    return reveal(groupOf(p.id) || (top && groupOf(top.id)));
  }
  // 見たら知らせの印を消す（パネルを触ったとき）
  if (markOf(p) === "notice") { S.seen[p.id] = p.aiSeq; saveSeen(); render(); }
};

// ── 流し込む：しゃべり流し（間があいたら送る）と、ブラウザの音声認識 ──
// 話しているだけなら、OS の音声入力は止まって間があいたら置き、マイクは確定したらすぐ置く
// 書きかけにキーボードで一文字でも打ったら、その書きかけは Enter まで置かない（声で足しても待つ）。欄が空になったらまた話すだけに戻る
// キーボードか声かは、入力の直前にキーが押されたかで見分ける（OS の音声入力はキーを押さずに文字が入る）
const msg = $("#msg");
let timer = null, composing = false, sending = false, lastKey = 0, typed = false;
const byKey = () => Date.now() - lastKey < 300;
msg.addEventListener("keydown", () => { lastKey = Date.now(); });
const arm = () => { clearTimeout(timer); timer = setTimeout(send, STREAM_PAUSE); };
async function send() {
  if (composing || sending) return arm();
  const raw = msg.value, text = raw.trim();
  if (!text) return;
  sending = true;
  const t0 = Date.now();
  FOCUS.input = t0; // 話しているなら、いる
  // 話しはじめたときに指していたパネルを付ける（手がかり。人の操作として発言に残る）
  const pt = PT.cur !== undefined ? PT.cur : pointNow();
  const r = await op("add", { view: "say", data: text, ...(S.to ? { to: S.to } : {}), ...(pt ? { point: pt } : {}) });
  sending = false;
  if (!r) return;
  // 送っているあいだに足された分は残す
  msg.value = msg.value.startsWith(raw) ? msg.value.slice(raw.length).trimStart() : msg.value;
  PT.cur = msg.value.trim() ? pointNow() : undefined;
  grow();
  showPoint();
  // 残ったぶんは、送っているあいだにキーで打ったかで決め直す
  typed = !!msg.value.trim() && lastKey > t0;
  if (msg.value.trim() && !typed) arm();
}
// 入力欄は一行から、書いたぶんだけ伸びる
const grow = () => { msg.style.height = "auto"; msg.style.height = `${msg.scrollHeight + 2}px`; };
// キーで書いたら、声で待っていた送りも止める（直しているところを送らない）
msg.addEventListener("input", () => {
  notePoint(); grow();
  if (!msg.value.trim()) typed = false; else if (byKey()) typed = true;
  if (typed) clearTimeout(timer); else arm();
});
msg.addEventListener("compositionstart", () => { composing = true; });
msg.addEventListener("compositionend", () => { composing = false; if (!byKey() && !typed) arm(); });
// Enter で置く。改行は Shift+Enter
// 宛先：状況のアイコンを押すと決まり、もう一度押すか ✕ か Esc で外れる。外すまで続く
function setTo(name) {
  S.to = name;
  const b = $("#to");
  b.hidden = !name;
  if (name) { b.textContent = L.toChip(callOf(name)); b.title = L.toOff; }
  msg.placeholder = name ? L.toPlaceholder(callOf(name)) : L.placeholder;
  showPoint();
  renderLive();
}
$("#to").onclick = () => setTo(null);
msg.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.to) setTo(null); });
msg.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); clearTimeout(timer); send(); } });
$("#send").onclick = () => { clearTimeout(timer); send(); };

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const mic = $("#mic");
  mic.title = L.micTitle;
  let rec = null, on = false, interim = 0;
  mic.hidden = false;
  const setMic = (v) => { on = v; S.listening = v; mic.setAttribute("aria-pressed", String(v)); mic.setAttribute("aria-label", v ? L.micOn : L.micOff); sendFocus(); };
  mic.innerHTML = ICON.mic;
  setMic(false);
  mic.onclick = () => {
    if (on) { setMic(false); rec?.stop(); return; }
    rec = new SR();
    rec.lang = "ja-JP"; rec.continuous = true; rec.interimResults = true;
    interim = 0;
    // 末尾の途中経過だけを差し替える。送ったぶんが欄から消えていても崩れない
    rec.onresult = (ev) => {
      let fin = "", mid = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) fin += ev.results[i][0].transcript; else mid += ev.results[i][0].transcript;
      }
      msg.value = msg.value.slice(0, Math.max(0, msg.value.length - interim)) + fin + mid;
      notePoint();
      grow();
      interim = mid.length;
      // 確定したらすぐ置く（まとめて整えるのは起こし係の間が受け持つ）
      if (mid || typed) clearTimeout(timer); else if (fin) { clearTimeout(timer); send(); }
    };
    rec.onend = () => { if (on) rec.start(); };
    rec.onerror = (ev) => { if (ev.error === "not-allowed") setMic(false); };
    rec.start();
    setMic(true);
  };
}

// ── 人のいま：どこを見ているか・何の話か・何を見たかを、ボードに知らせる（操作ログには積まず、誰も起こさない）──
const FOCUS = { client: Math.random().toString(36).slice(2, 10), timer: 0, input: Date.now(), sent: "", at: 0, away: false };
function focusNow() {
  const g = stage.getBoundingClientRect();
  const inView = (r) => r.width > 0 && r.bottom > g.top + 16 && r.top < g.bottom - 16 && r.right > g.left + 16 && r.left < g.right - 16;
  const viewing = allTiles().filter((k) => !BUILTIN.includes(k) && tileOf(k) && inView(tileOf(k).getBoundingClientRect()));
  const inside = viewing.flatMap((k) => $$("dv-panel", tileOf(k)).filter((el) => el.dataset.id !== k && inView(el.getBoundingClientRect())).map((el) => el.dataset.id));
  const tl = $("#timeline"), talk = tileOf("talk");
  return {
    client: FOCUS.client,
    presence: document.visibilityState === "visible" && Date.now() - FOCUS.input < 5 * 60e3 ? "here" : "away",
    listening: !!S.listening,
    followingTalk: !!talk && inView(talk.getBoundingClientRect()) && tl.scrollTop + tl.clientHeight >= tl.scrollHeight - 40,
    viewing, inside: [...new Set(inside)], talking: S.talking || [],
    tiles: allTiles().filter((k) => tileOf(k)).map((k) => ({ key: k, ...posOf(k), ...(isAuto(k) ? { auto: true } : {}), ...(isFolded(k) ? { folded: true } : {}) })),
    seen: S.seen,
  };
}
// 変わったときと、一分ごと（いることを知らせる）に送る
function sendFocus(now = false) {
  if (SHOT || !S.ready) return;
  clearTimeout(FOCUS.timer);
  FOCUS.timer = setTimeout(async () => {
    const body = focusNow(), key = JSON.stringify(body);
    if (key === FOCUS.sent && Date.now() - FOCUS.at < 50e3) return;
    FOCUS.sent = key;
    FOCUS.at = Date.now();
    FOCUS.away = body.presence === "away";
    const r = await fetch("/api/focus", { method: "POST", headers: { "content-type": "application/json" }, body: key }).then((x) => x.json()).catch(() => null);
    if (r?.seen) mergeSeen(r.seen);
  }, now ? 0 : 800);
}
// ほかの端末で見たものも見たことにする
function mergeSeen(seen, draw = true) {
  let more = false;
  for (const [id, n] of Object.entries(seen || {})) if (Number.isInteger(n) && n > (S.seen[id] || 0)) { S.seen[id] = n; more = true; }
  if (!more) return;
  put(`seen:${S.name || ""}`, S.seen);
  if (draw) render();
}
const touched = () => { FOCUS.input = Date.now(); if (FOCUS.away) sendFocus(true); };
document.addEventListener("pointerdown", touched, true);
document.addEventListener("keydown", touched, true);
document.addEventListener("visibilitychange", () => sendFocus(true));
stage.addEventListener("scroll", () => sendFocus(), { passive: true });
$("#timeline").addEventListener("scroll", () => sendFocus(), { passive: true });
grid.addEventListener("pointerover", (e) => { HOVER.k = e.target.closest("#grid > .tile")?.dataset.tile ?? null; HOVER.id = e.target.closest("dv-panel")?.dataset.id ?? null; });
grid.addEventListener("pointerleave", () => { HOVER.k = null; HOVER.id = null; });
setInterval(() => sendFocus(), 60e3);

// ── 指して喋る：発言を置くとき、そのとき指していたパネルを付ける。「これ」「それ」が何かを、マネージャが取り違えないように ──
// 指しているもの：さっきまでマウスを乗せていたパネル（hover）。表の行の上なら、その行（話題ではなく）。なければ、さっき動かして画面のまん中に持ってきたパネル（view）。
// どちらも「覚えておく時間」より前のものは使わない。要点（summary）は指したことにしない
// 時間はどれも dyve 設定の「調整」で変えられる（tu()。サーバーの ui-settings.json に持ち、立て直さずに効く）
const PT = { over: null, last: null, looked: 0, cur: undefined };
// 指した先の要素：表の行（.row[data-row]）が先、なければパネル
const pointTarget = (el) => el?.closest?.("#grid .row[data-row]") || el?.closest?.("#grid dv-panel") || null;
const pointEl = (id) => $(`#grid dv-panel[data-id="${CSS.escape(id)}"]`) || $$(`#grid .row[data-row="${CSS.escape(id)}"]`).find((r) => r.getClientRects().length) || null;
function pointNow() {
  if (SHOT || narrow()) return null;
  const now = Date.now(), g = stage.getBoundingClientRect();
  const ok = (el) => {
    const p = el && panelById(el.dataset.row ?? el.dataset.id), r = el?.getBoundingClientRect();
    return p && !["summary", "layout", "say"].includes(p.view) && r.width > 0 && r.bottom > g.top + 24 && r.top < g.bottom - 24 && r.right > g.left + 24 && r.left < g.right - 24 ? p.id : null;
  };
  const keep = tu("pointKeepSec") * 1000;
  if (PT.last && now - PT.last.at < keep) {
    const id = ok(pointEl(PT.last.id));
    if (id) return { id, how: "hover" };
  }
  if (now - PT.looked < keep) {
    const id = ok(pointTarget(document.elementFromPoint(g.left + g.width / 2, g.top + g.height / 2)));
    if (id) return { id, how: "view" };
  }
  return null;
}
// 話しはじめたときのものを覚える（置かれるまでにマウスが動いても変わらない）。欄が空に戻ったら忘れる
function notePoint() {
  if (!msg.value.trim()) PT.cur = undefined;
  else if (PT.cur === undefined) PT.cur = pointNow();
}
// いま話すと何が付くかは、入力欄の薄い字で知らせる（場所を取らず、何も動かさない）
function showPoint() {
  if (S.to) return;
  const p = panelById(pointNow()?.id);
  const next = p ? L.ptPlaceholder(ptName(p, 16)) : L.placeholder;
  if (msg.placeholder !== next) msg.placeholder = next;
}
// 通りすがりに触れただけのパネルは数えない（マウスが少しのあいだ留まったものだけ）
const overPanel = (e) => {
  const el = pointTarget(e.target), p = panelById(el?.dataset.row ?? el?.dataset.id), now = Date.now();
  if (!p || ["summary", "layout", "say"].includes(p.view)) { PT.over = null; return; }
  if (PT.over?.id !== p.id) PT.over = { id: p.id, since: now };
  if (now - PT.over.since < tu("pointHoldMs")) return;
  const fresh = PT.last?.id !== p.id;
  PT.last = { id: p.id, at: now };
  if (fresh) showPoint();
};
grid.addEventListener("pointerover", overPanel, { passive: true });
grid.addEventListener("pointermove", overPanel, { passive: true });
for (const ev of ["wheel", "touchmove"]) stage.addEventListener(ev, () => { PT.looked = Date.now(); }, { passive: true });
setInterval(showPoint, 5e3);

// ── 見たら見たことにする：知らせのあるパネルが読める大きさで画面に映っていて、人がいるあいだ、読む時間を数える ──
// 押さなくても、読めば印は消える。読む時間は中身の量から（変わった行がわかっていれば、その行のぶんだけ）。
// いちどに読めるのは一枚なので、マウスの下のものがあればそれに、なければ映っているものどうしで時間を分ける
const DWELL = { got: new Map(), at: performance.now(), tick: 500 };
const JUST = new Map(); // パネル id -> 見たことになった時刻（印を静かに薄れさせる）
function dwellNeed(el) {
  const lo = tu("readMinMs"), hi = Math.max(lo, tu("readMaxMs"));
  if (el.classList.contains("folded")) return lo;
  const v = [...el.children].find((c) => !c.matches(".meta, .kids, .src-line, .orig"));
  const fresh = v ? $$(".fresh", v) : [];
  const n = !v ? 0 : v.matches("iframe") ? 200 : fresh.length ? fresh.reduce((a, x) => a + x.textContent.length, 0) : v.textContent.length;
  return clamp(lo + n * tu("readPerCharMs"), lo, hi);
}
// 画面に映っている、まだ見ていないパネル（AI が置いた・変えたもの）
function dwellCands() {
  const g = stage.getBoundingClientRect(), out = [];
  for (const el of $$("#grid dv-panel")) {
    const p = panelById(el.dataset.id);
    if (!p || isPerson(p.by) || !p.aiSeq || p.aiSeq <= (S.seen[p.id] || 0)) continue;
    const r = el.getBoundingClientRect();
    // 縮めすぎて読めない大きさのものは、映っていても見たことにしない
    if (!r.width || r.width / (el.offsetWidth || r.width) < tu("readZoomPct") / 100) continue;
    const w = Math.min(r.right, g.right) - Math.max(r.left, g.left), h = Math.min(r.bottom, g.bottom) - Math.max(r.top, g.top);
    if (w < r.width * 0.6 || h < Math.min(r.height, g.height * 0.5) * 0.8) continue;
    // 浮かせたパネルの下に隠れているものは数えない
    const hit = document.elementFromPoint(Math.max(r.left, g.left) + w / 2, Math.max(r.top, g.top) + h / 2);
    if (hit && el.contains(hit)) out.push({ el, p });
  }
  return out;
}
function dwellTick() {
  const now = performance.now(), dt = Math.min(now - DWELL.at, DWELL.tick * 2);
  DWELL.at = now;
  if (SHOT || !S.ready || document.visibilityState !== "visible" || Date.now() - FOCUS.input > 5 * 60e3 || $(".editing")) return;
  const cands = dwellCands();
  if (!cands.length) return;
  const done = [], hov = cands.filter(({ el }) => el.matches(":hover"));
  const reading = hov.length ? hov.slice(-1) : cands;
  for (const { el, p } of reading) {
    const key = `${p.id}:${p.aiSeq}`, got = (DWELL.got.get(key) || 0) + dt / reading.length;
    DWELL.got.set(key, got);
    if (got >= dwellNeed(el)) done.push(p);
  }
  // 文字を選んでいる最中は描き直さない（次の回に回す）
  if (!done.length || getSelection()?.isCollapsed === false) return;
  for (const p of done) {
    S.seen[p.id] = p.aiSeq;
    JUST.set(p.id, Date.now());
  }
  for (const k of DWELL.got.keys()) { const [id, n] = k.split(":"); if (!(panelById(id)?.aiSeq === Number(n) && Number(n) > (S.seen[id] || 0))) DWELL.got.delete(k); }
  saveSeen();
  render();
}
setInterval(dwellTick, DWELL.tick);

// ── 調整：dyve 設定の歯車の奥。変えたらサーバーへ（ui-settings.json）。開いているほかの画面にも届く ──
function drawTune() {
  const box = $("#tune .tune-rows"), lim = S.tune?.limits || {};
  // 打っている最中の欄は書き換えない
  if (box.contains(document.activeElement)) return;
  box.innerHTML = Object.entries(L.tuneItems).map(([k, [name, unit, help]]) => {
    const l = lim[k] || {}, v = tu(k);
    return `<label for="tune-${k}" title="${esc(help)}">${esc(name)}</label>` +
      `<input id="tune-${k}" type="number" data-tune="${k}" value="${v}"${l.min != null ? ` min="${l.min}" max="${l.max}"` : ""} title="${esc(help)}"${l.def != null && v !== l.def ? ' class="changed"' : ""}>` +
      `<span class="unit">${esc(unit)}</span>`;
  }).join("");
}
async function setTune(set) {
  const r = await (await fetch("/api/tune", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ set }) })).json().catch(() => ({ ok: false, message: "" }));
  if (!r.ok) { $("#err").textContent = L.refused(r.message); return; }
  S.tune = { values: r.values, limits: r.limits };
  drawTune();
}
$("#tune > summary").textContent = L.tune;
$("#tune").title = L.tuneTitle;
$("#tuneReset").textContent = L.tuneReset;
$("#tuneReset").onclick = () => setTune(Object.fromEntries(Object.keys(L.tuneItems).map((k) => [k, null])));
// 打ち終えたら（Enter か欄を離れたら）送る。空にしたら既定に戻す
$("#tune").addEventListener("change", (e) => {
  const k = e.target.dataset?.tune;
  if (!k) return;
  const v = e.target.value.trim();
  setTune({ [k]: v === "" ? null : Number(v) });
});

// ── 生きている知らせ ──
function connect() {
  const es = new EventSource("/api/events");
  let t = null;
  es.addEventListener("board", load);
  es.addEventListener("panelset", load);
  es.addEventListener("tune", (e) => { S.tune = JSON.parse(e.data); drawTune(); });
  es.addEventListener("views", async (e) => { await loadViews(JSON.parse(e.data)); render(); });
  es.addEventListener("feed", (e) => { const f = JSON.parse(e.data); S.feeds[f.id] = f; clearTimeout(t); t = setTimeout(load, 120); });
  es.addEventListener("op", () => { clearTimeout(t); t = setTimeout(load, 120); });
  es.addEventListener("live", (e) => { S.live = JSON.parse(e.data); renderLive(); clearTimeout(t); t = setTimeout(load, 120); });
  es.onerror = () => { es.close(); setTimeout(connect, 2000); };
}

msg.placeholder = L.placeholder;
$("#send").innerHTML = ICON.send;
$("#send").title = L.send;
$("#send").setAttribute("aria-label", L.send);
// dyve 設定はアイコンだけ。名前は title と aria-label に
const iconBtn = (id, icon, label) => { const b = $(id); b.innerHTML = icon; b.title = label; b.setAttribute("aria-label", label); };
iconBtn("#seenAll", ICON.seen, L.seenAll);
iconBtn("#export", ICON.export, L.export);
iconBtn("#newBoard", ICON.newBoard, L.newBoard);
iconBtn("#restart", ICON.restart, L.restart);
iconBtn("#info", ICON.info, L.info);
$("#resetLayout").innerHTML = `${ICON.reset} ${esc(L.resetLayout)}`;
iconBtn("#boardsLink", ICON.boards, L.boards);
iconBtn("#panelsLink", ICON.panels, L.panels);
// 管理のページから、切り替えたあとにこのタブへ戻れるように名前を付ける
window.name = "dyve-board";
$("#densityLabel").textContent = L.density;
$("#density").setAttribute("aria-label", L.density);
loadBoards();
renderLive();
load().then(() => { if (!SHOT) connect(); });
</script>
</body>
</html>
