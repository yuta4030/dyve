<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ボード</title>
<style>
:root {
  --bg: #f6f5f1; --card: #ffffff; --ink: #1f2328; --mute: #6b6f76; --line: #d9d7d0;
  --accent: #2f6fdb; --accent-soft: #e6eefc; --warn: #b4560f; --warn-soft: #fbefe4; --ok: #2b7a4b;
  --radius: 10px; --gap: 12px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #16181b; --card: #202328; --ink: #e7e9ec; --mute: #9aa0a8; --line: #353a41;
          --accent: #7aa7ff; --accent-soft: #1f2b44; --warn: #f0a35e; --warn-soft: #3a2a1c; --ok: #6fcf97; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
header { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
         padding: 10px 16px; background: color-mix(in srgb, var(--bg) 92%, transparent); border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
#live { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px;
        border: 1px solid var(--line); color: var(--mute); background: var(--card); white-space: nowrap; }
.chip.busy::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .chip.busy::before { animation: none; } }
button { font: inherit; font-size: 13px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px;
         padding: 3px 10px; cursor: pointer; min-height: 30px; }
button:hover { border-color: var(--mute); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.icon { min-height: 26px; padding: 0 6px; border-color: transparent; background: transparent; color: var(--mute); }
button.icon:hover { color: var(--ink); border-color: var(--line); }
button[aria-pressed="true"] { color: var(--accent); }
a { color: var(--accent); }

main { max-width: 1180px; margin: 0 auto; padding: 16px 16px 180px; }
.empty { color: var(--mute); text-align: center; margin-top: 18vh; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--gap); margin-bottom: var(--gap); align-items: start; }
.row > .side { display: flex; flex-direction: column; gap: 8px; }
.row > .side:empty { display: none; }
.row:has(> .side:empty) { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 760px) { .row { grid-template-columns: minmax(0, 1fr); } .row > .side { padding-left: 16px; } }
/* 右に何もない発言の束：最新の一枚ぶんの高さで見せ、箱の中のスクロールで前に戻る */
.stack { overflow-y: auto; scroll-snap-type: y mandatory; margin-bottom: var(--gap); border-radius: var(--radius); }
.stack > .row { scroll-snap-align: end; }
.stack > .row:last-child { margin-bottom: 0; }
.stack-more { font-size: 12px; color: var(--mute); margin: 0 0 4px 4px; }

dv-panel { display: block; position: relative; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
dv-panel .meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--mute); min-height: 22px; }
dv-panel .meta .who { font-weight: 600; }
dv-panel .meta .tools { margin-left: auto; display: flex; gap: 2px; opacity: .35; transition: opacity .15s; }
dv-panel:hover > .meta .tools, dv-panel:focus-within > .meta .tools { opacity: 1; }
dv-panel .kids { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
dv-panel .kids:empty { display: none; }
dv-panel dv-panel { background: color-mix(in srgb, var(--card) 70%, var(--bg)); }
dv-panel.human { border-left: 3px solid var(--ink); }
dv-panel.pinned { box-shadow: inset 0 0 0 1px var(--ink); }
/* 印：色だけに頼らず、線と記号でも見分ける */
dv-panel.notice { border-color: var(--accent); background: linear-gradient(var(--accent-soft), var(--accent-soft)) top / 100% 3px no-repeat, var(--card); }
dv-panel.untouched { border-style: dashed; border-color: var(--mute); }
dv-panel.waiting { border: 3px double var(--warn); }
.mark { font-size: 12px; padding: 0 6px; border-radius: 4px; }
.mark.notice { color: var(--accent); background: var(--accent-soft); }
.mark.untouched { color: var(--mute); border: 1px dashed var(--mute); }
.mark.waiting { color: var(--warn); background: var(--warn-soft); }
.mark.done { color: var(--ok); }
.body { white-space: pre-wrap; overflow-wrap: anywhere; }
.body ul { margin: 0; padding-left: 1.2em; white-space: normal; }
.body table { border-collapse: collapse; font-size: 13px; width: 100%; white-space: normal; display: block; overflow-x: auto; }
.body th, .body td { border: 1px solid var(--line); padding: 3px 6px; text-align: left; vertical-align: top; }
.body pre { margin: 0; font-size: 12px; overflow-x: auto; }
.orig { margin-top: 6px; font-size: 13px; color: var(--mute); border-left: 2px solid var(--line); padding-left: 8px; white-space: pre-wrap; }
.task-to { color: var(--mute); font-size: 13px; }

footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 16px 14px; }
footer .inner { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
footer textarea { width: 100%; resize: vertical; min-height: 58px; max-height: 40vh; font: inherit; color: var(--ink); background: var(--card);
                  border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; }
footer textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
footer .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--mute); }
footer .bar .grow { flex: 1; }
footer label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
#err { color: var(--warn); }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div id="live" aria-live="polite"></div>
  <button id="seenAll"></button>
  <a id="export" href="/api/export.md"></a>
</header>
<main id="board"></main>
<footer>
  <div class="inner">
    <textarea id="msg" rows="2"></textarea>
    <div class="bar">
      <label><input type="checkbox" id="stream"> <span id="streamLabel"></span></label>
      <button id="mic" aria-pressed="false" hidden></button>
      <span id="hint"></span>
      <span class="grow"></span>
      <span id="err" role="status"></span>
      <button id="send" class="primary"></button>
    </div>
  </div>
</footer>
<script type="module">
// 画面の言葉はここにまとめる
const L = {
  you: "あなた", manager: "マネージャ", board: "ボード",
  send: "置く", placeholder: "考えていることをそのまま。話し終えて間があくと置かれます",
  stream: "しゃべり流し", streamHint: "OS の音声入力（Mac は音声入力、Windows は Win+H）でも話せます",
  micOn: "聞いています", micOff: "マイク",
  empty: "まだ何もありません。下の欄に話すか書くと、ここに置かれます。",
  export: "Markdown に書き出す", seenAll: "すべて見た",
  managerBusy: "マネージャが整えています", managerWait: "間があいたら整えます",
  agentBusy: (n, t) => `${n}：${t}`,
  mark: { notice: "● 知らせ", untouched: "○ 未着手", waiting: "◇ 受け入れ待ち" },
  state: { task: "仕事", proposal: "提案", done: "✓ 済み" },
  pin: "ピン留め", unpin: "ピン留めを外す", drop: "外す", dropAsk: "このパネルを外しますか（操作ログには残ります）",
  accept: "受け入れる", orig: "元の文", origHide: "元の文を隠す", to: (n) => `宛先：${n}`,
  refused: (m) => `できませんでした：${m}`,
  stackMore: (n) => `↑ 前の発言 ${n} 件（箱の中をスクロール）`,
};
// しゃべり流し：入力が止まってからこの時間がたつと送る（ミリ秒）
const STREAM_PAUSE = 2500;

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const linkify = (s) => esc(s).replace(/https?:\/\/[^\s<)]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
const ICON = {
  pin: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4h6l-1 6 4 3v2H6v-2l4-3z"/><path d="M12 15v6"/></svg>',
  drop: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
};
const S = { panels: [], marks: {}, live: null, title: "", seen: {} };
try { S.seen = JSON.parse(localStorage.getItem("seen") || "{}"); } catch {}
const saveSeen = () => { try { localStorage.setItem("seen", JSON.stringify(S.seen)); } catch {} };
const isPerson = (by) => by === "human";
const who = (by) => isPerson(by) ? L.you : by === "manager" ? L.manager : by === "board" ? L.board : by;
const textOf = (d) => typeof d === "string" ? d : d?.text ?? JSON.stringify(d);

// ── view：パネルの JSON の流し込み先。コンポーネントを書くのは本体だけ ──
class View extends HTMLElement {
  set data(v) { this._d = v; this.render(v); }
  get data() { return this._d; }
  render(v) { this.innerHTML = `<div class="body"><pre>${esc(JSON.stringify(v, null, 2))}</pre></div>`; }
}
class TextView extends View { render(v) { this.innerHTML = `<div class="body">${linkify(textOf(v))}</div>`; } }
class ListView extends View {
  render(v) {
    if (!Array.isArray(v)) return super.render(v);
    this.innerHTML = `<div class="body"><ul>${v.map((x) => `<li>${linkify(textOf(x))}</li>`).join("")}</ul></div>`;
  }
}
class TableView extends View {
  render(v) {
    if (!v || !Array.isArray(v.columns) || !Array.isArray(v.rows)) return super.render(v);
    this.innerHTML = `<div class="body"><table><thead><tr>${v.columns.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead>` +
      `<tbody>${v.rows.map((r) => `<tr>${r.map((c) => `<td>${linkify(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
}
class TaskView extends View {
  render(v) {
    this.innerHTML = `<div class="body">${linkify(textOf(v))}</div>${v?.to ? `<div class="task-to">${esc(L.to(v.to))}</div>` : ""}`;
  }
}
customElements.define("dv-json", View);
customElements.define("dv-say", class extends TextView {});
customElements.define("dv-text", TextView);
customElements.define("dv-list", ListView);
customElements.define("dv-table", TableView);
customElements.define("dv-task", TaskView);
const viewTag = (v) => customElements.get(`dv-${v}`) && /^[a-z][a-z0-9]*$/.test(v) ? `dv-${v}` : "dv-json";

// ── パネルの封筒 ──
class PanelEl extends HTMLElement {}
customElements.define("dv-panel", PanelEl);

function markOf(p) {
  if (S.marks[p.id]) return S.marks[p.id];
  if (!isPerson(p.by) && p.aiSeq && p.aiSeq > (S.seen[p.id] || 0)) return "notice";
  return null;
}

function panelEl(p, kids) {
  const el = document.createElement("dv-panel");
  const mark = markOf(p);
  el.className = [isPerson(p.by) && "human", p.pinned && "pinned", mark].filter(Boolean).join(" ");
  el.dataset.id = p.id;
  const tags = [];
  if (mark) tags.push(`<span class="mark ${mark}">${L.mark[mark]}</span>`);
  if (p.state === "done") tags.push(`<span class="mark done">${L.state.done}</span>`);
  else if (p.state && !mark) tags.push(`<span class="mark">${L.state[p.state]}</span>`);
  const edited = p.rev !== p.seq && p.view === "say";
  el.innerHTML = `<div class="meta"><span class="who">${esc(who(p.by))}</span>${tags.join("")}
    ${p.state === "proposal" ? `<button data-act="accept">${L.accept}</button>` : ""}
    <span class="tools">
      ${edited ? `<button class="icon" data-act="orig">${L.orig}</button>` : ""}
      <button class="icon" data-act="pin" aria-pressed="${!!p.pinned}" title="${p.pinned ? L.unpin : L.pin}" aria-label="${p.pinned ? L.unpin : L.pin}">${ICON.pin}</button>
      <button class="icon" data-act="drop" title="${L.drop}" aria-label="${L.drop}">${ICON.drop}</button>
    </span></div>`;
  const view = document.createElement(viewTag(p.view));
  view.data = p.data;
  el.append(view);
  const box = document.createElement("div");
  box.className = "kids";
  for (const k of kids(p.id)) box.append(panelEl(k, kids));
  el.append(box);
  return el;
}

// 束ねてよい発言：人の発言で、右に何もなく、ピン留めも印もないもの
const stackable = (p, kids) => p.view === "say" && isPerson(p.by) && !p.pinned && !markOf(p) && !kids(p.id).length;

function rowEl(p, kids) {
  const row = document.createElement("div");
  row.className = "row";
  const head = panelEl(p, () => []);
  const side = document.createElement("div");
  side.className = "side";
  for (const k of kids(p.id)) side.append(panelEl(k, kids));
  row.append(head, side);
  return row;
}

// 箱の高さを最新の一枚ぶんにそろえる
function fitStacks() {
  for (const st of document.querySelectorAll("#board .stack")) st.style.height = `${st.lastElementChild.offsetHeight}px`;
}

function render() {
  const main = $("#board");
  const atBottom = innerHeight + scrollY >= document.body.scrollHeight - 80;
  // 箱の中の位置を、中の発言の id ごとに覚えておく（作り直しても引き戻さない）
  const kept = new Map();
  for (const st of main.querySelectorAll(".stack")) {
    const s = { top: st.scrollTop, bottom: st.scrollTop + st.clientHeight >= st.scrollHeight - 4 };
    for (const el of st.querySelectorAll(":scope > .row > dv-panel")) kept.set(el.dataset.id, s);
  }
  const ids = new Set(S.panels.map((p) => p.id));
  const by = new Map();
  for (const p of S.panels) {
    const k = p.about && ids.has(p.about) ? p.about : null;
    if (!by.has(k)) by.set(k, []);
    by.get(k).push(p);
  }
  const kids = (id) => by.get(id) || [];
  main.innerHTML = "";
  const top = kids(null);
  if (!top.length) main.innerHTML = `<p class="empty">${esc(L.empty)}</p>`;
  // 右に何もない人の発言が続いたら、一つの群に束ねる
  const groups = [];
  for (const p of top) {
    const s = stackable(p, kids), g = groups.at(-1);
    if (s && g?.stack) g.items.push(p); else groups.push({ stack: s, items: [p] });
  }
  // 発言を左に、それについて置かれたものを右に浮かせる
  const stacks = [];
  for (const g of groups) {
    if (g.items.length < 2) { main.append(rowEl(g.items[0], kids)); continue; }
    const more = document.createElement("div");
    more.className = "stack-more";
    more.textContent = L.stackMore(g.items.length - 1);
    const st = document.createElement("div");
    st.className = "stack";
    st.tabIndex = 0;
    for (const p of g.items) st.append(rowEl(p, kids));
    main.append(more, st);
    stacks.push([st, g.items.map((p) => p.id)]);
  }
  fitStacks();
  for (const [st, its] of stacks) {
    const s = its.map((id) => kept.get(id)).find(Boolean);
    // 下にいた箱・新しい箱だけ最新へ。前を読んでいる箱は元の位置のまま
    st.scrollTop = !s || s.bottom ? st.scrollHeight : s.top;
  }
  // 引き戻さない：いちばん下を見ていたときだけ追いかける
  if (atBottom) scrollTo({ top: document.body.scrollHeight });
}
addEventListener("resize", fitStacks);

function renderLive() {
  const lv = S.live, out = [];
  if (lv?.manager) out.push(`<span class="chip busy">${esc(L.managerBusy)}</span>`);
  else if (lv?.waitingManager) out.push(`<span class="chip">${esc(L.managerWait)}</span>`);
  for (const a of lv?.agents || []) {
    const t = S.panels.find((p) => p.id === a.task);
    out.push(`<span class="chip busy">${esc(L.agentBusy(a.name, (t ? textOf(t.data) : "").slice(0, 24)))}</span>`);
  }
  $("#live").innerHTML = out.join("");
}

async function load() {
  const r = await fetch("/api/board");
  const b = await r.json();
  Object.assign(S, { panels: b.panels, marks: b.marks, live: b.live, title: b.title });
  document.title = b.title;
  $("#title").textContent = b.title;
  render();
  renderLive();
}

async function op(type, panel) {
  $("#err").textContent = "";
  const r = await fetch("/api/op", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ type, panel }) });
  const b = await r.json();
  if (!b.ok) { $("#err").textContent = L.refused(b.message); return null; }
  return b;
}

// ── 操作 ──
$("#board").addEventListener("click", async (e) => {
  const el = e.target.closest("dv-panel");
  if (!el) return;
  const p = S.panels.find((x) => x.id === el.dataset.id);
  if (!p) return;
  const act = e.target.closest("button")?.dataset.act;
  if (act === "pin") return op("edit", { id: p.id, pinned: !p.pinned });
  if (act === "accept") return op("edit", { id: p.id, state: "done" });
  if (act === "drop") { if (confirm(L.dropAsk)) op("drop", { id: p.id }); return; }
  if (act === "orig") {
    const ex = $(":scope > .orig", el);
    if (ex) { ex.remove(); e.target.textContent = L.orig; return; }
    const h = await (await fetch(`/api/history?id=${encodeURIComponent(p.id)}`)).json();
    const d = document.createElement("div");
    d.className = "orig";
    d.textContent = textOf(h[0]?.panel.data);
    $(":scope > .kids", el).before(d);
    e.target.textContent = L.origHide;
    return;
  }
  // 見たら知らせの印を消す（パネルを触ったとき）
  if (markOf(p) === "notice") { S.seen[p.id] = p.aiSeq; saveSeen(); render(); }
});
$("#seenAll").onclick = () => { for (const p of S.panels) if (p.aiSeq) S.seen[p.id] = p.aiSeq; saveSeen(); render(); };

// ── 流し込む：しゃべり流し（間があいたら送る）と、ブラウザの音声認識 ──
const msg = $("#msg"), box = $("#stream");
let timer = null, composing = false, sending = false;
try { box.checked = localStorage.getItem("stream") !== "0"; } catch { box.checked = true; }
box.onchange = () => { try { localStorage.setItem("stream", box.checked ? "1" : "0"); } catch {} arm(); };
const arm = () => { clearTimeout(timer); if (box.checked) timer = setTimeout(send, STREAM_PAUSE); };
async function send() {
  if (composing || sending) return arm();
  const raw = msg.value, text = raw.trim();
  if (!text) return;
  sending = true;
  const r = await op("add", { view: "say", data: text });
  sending = false;
  if (!r) return;
  // 送っているあいだに足された分は残す
  msg.value = msg.value.startsWith(raw) ? msg.value.slice(raw.length).trimStart() : msg.value;
  if (msg.value.trim()) arm();
}
msg.addEventListener("input", arm);
msg.addEventListener("compositionstart", () => { composing = true; });
msg.addEventListener("compositionend", () => { composing = false; arm(); });
msg.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); clearTimeout(timer); send(); } });
$("#send").onclick = () => { clearTimeout(timer); send(); };

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const mic = $("#mic");
  let rec = null, on = false, interim = 0;
  mic.hidden = false;
  const setMic = (v) => { on = v; mic.setAttribute("aria-pressed", String(v)); mic.textContent = v ? L.micOn : L.micOff; };
  setMic(false);
  mic.onclick = () => {
    if (on) { setMic(false); rec?.stop(); return; }
    rec = new SR();
    rec.lang = "ja-JP"; rec.continuous = true; rec.interimResults = true;
    interim = 0;
    // 末尾の途中経過だけを差し替える。送ったぶんが欄から消えていても崩れない
    rec.onresult = (ev) => {
      let fin = "", mid = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) fin += ev.results[i][0].transcript; else mid += ev.results[i][0].transcript;
      }
      msg.value = msg.value.slice(0, Math.max(0, msg.value.length - interim)) + fin + mid;
      interim = mid.length;
      // 確定したらすぐ置く（まとめて整えるのは起こし係の間が受け持つ）
      if (mid) clearTimeout(timer); else if (fin) { clearTimeout(timer); send(); }
    };
    rec.onend = () => { if (on) rec.start(); };
    rec.onerror = (ev) => { if (ev.error === "not-allowed") setMic(false); };
    rec.start();
    setMic(true);
  };
}

// ── 生きている知らせ ──
function connect() {
  const es = new EventSource("/api/events");
  let t = null;
  es.addEventListener("op", () => { clearTimeout(t); t = setTimeout(load, 120); });
  es.addEventListener("live", (e) => { S.live = JSON.parse(e.data); renderLive(); clearTimeout(t); t = setTimeout(load, 120); });
  es.onerror = () => { es.close(); setTimeout(connect, 2000); };
}

msg.placeholder = L.placeholder;
$("#send").textContent = L.send;
$("#streamLabel").textContent = L.stream;
