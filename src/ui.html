<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dyve</title>
<style>
:root {
  color-scheme: light dark; /* スクロールバーや入力欄など、ブラウザが描くものも暗いときは暗く */
  --bg: #fafaf8; --panel: #ffffff; --ink: #1d1d1b; --sub: #6b6b66; --line: #e4e3de;
  --run: #2f6fdb; --wait: #1f8a4c; --fail: #c0392b; --mark: #e08a00; --soft: #f1f0ec;
  font: 14px/1.55 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --sub: #9a9992; --line: #33322f; --soft: #292926; --run: #6c9cf0; --wait: #4cc07e; --fail: #e8695b; }
}
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); }
body { display: grid; grid-template-columns: minmax(min(280px, var(--chat, 340px)), var(--chat, 340px)) minmax(0, 1fr); height: 100vh; }
@media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: 1fr 45vh; } #chat { order: 2; border-right: 0; border-top: 1px solid var(--line); } .split { display: none; } }
/* 幅を変える取っ手：左のチャットの右端と、右のパネルの左端。ダブルクリックで元の幅に戻る */
.split { position: absolute; top: 0; bottom: 0; width: 8px; cursor: col-resize; z-index: 2; touch-action: none; }
.split::after { content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 2px; border-radius: 1px; }
.split:hover::after, body.dragging .split::after { background: color-mix(in srgb, var(--run) 45%, transparent); }
#chat > .split { right: -4px; }
.side > .split { left: -12px; }
body.dragging, body.dragging * { cursor: col-resize !important; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }

#chat { position: relative; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--panel); }
#top { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--sub); }
#top .brand { font-weight: 700; color: var(--ink); margin-right: auto; }
#top button:hover { color: var(--ink); }
#top [data-undo] { color: var(--run); }
#top button { white-space: nowrap; flex: none; }
/* 場所のチップ：フォルダとその名前 */
.pill { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px 1px 7px; background: var(--panel); font-size: 12px; color: var(--sub); }
.pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill svg { flex: none; }
.pill:hover { color: var(--ink); border-color: var(--sub); }
#input .under { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; min-width: 0; }
#mode { font: 11px ui-monospace, Menlo, monospace; color: var(--sub); letter-spacing: .04em; }
#mode.normal { color: var(--run); }
#input textarea.normal { caret-color: transparent; }
.card.sel { border-color: var(--run); box-shadow: 0 0 0 1px var(--run); }
.pill.small { flex: none; padding: 0 7px 0 5px; font-size: 11px; max-width: 120px; align-self: center; }
.pill.small svg { width: 11px; height: 11px; }
/* 場所を選ぶ小さな欄：入力欄の上のチップのすぐ上に出る */
#roompick { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 12px; }
#roompick[hidden] { display: none; }
#roompick input { font: 12px ui-monospace, Menlo, monospace; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
#roompick .rooms { display: flex; flex-wrap: wrap; gap: 6px; }
#top [data-history], #top [data-reset], #top [data-undo] { display: inline-flex; }
#top [data-undo][hidden] { display: none; }
#top [data-history][aria-pressed="true"] { color: var(--ink); }
.room { font-size: 11px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
#history { display: flex; flex-direction: column; gap: 12px; max-width: 860px; margin: 0 auto; width: 100%; }
#history .bar { display: flex; align-items: baseline; gap: 10px; color: var(--sub); font-size: 12px; }
#history .bar button:hover { color: var(--ink); }
#history .era { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
#history .when { font-size: 12px; color: var(--sub); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#history .first { font-weight: 600; }
#history .tags { display: flex; flex-wrap: wrap; gap: 6px; }
#history details summary { font-size: 12px; color: var(--sub); cursor: pointer; }
#history .lines { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; font-size: 13px; }
#history .lines .r { color: var(--sub); }
#history .empty { color: var(--sub); }
#top .brand { margin-right: 0; }
#quota { position: relative; font-variant-numeric: tabular-nums; white-space: nowrap; cursor: default; }
/* マウスを載せたらすぐ出る吹き出し：いつ戻るか */
#quota .tip { display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 5; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); box-shadow: 0 4px 16px rgba(0, 0, 0, .12); font-size: 12px; line-height: 1.6; }
#quota:hover .tip { display: block; }
#quota .tip b { font-weight: 600; }
#quota .tip .sub { color: var(--sub); }
#quota .hi { color: var(--mark); }
#quota .out { color: var(--fail); }
#top [data-gear] { margin-right: auto; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; }
#top [data-gear]:hover, #top [data-gear][aria-pressed="true"] { background: var(--soft); color: var(--ink); }
#settings { border-bottom: 1px solid var(--line); padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 12px; background: var(--bg); }
#settings .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#settings .label { color: var(--sub); min-width: 6.5em; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { padding: 2px 10px; color: var(--sub); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.say p[title] { cursor: help; }
#flow { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
#flow .empty { color: var(--sub); }
.say p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.say.canceled p { text-decoration: line-through; color: var(--sub); }
.acts { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.act { flex: none; white-space: nowrap; font-size: 12px; color: var(--sub); opacity: .55; }
.say:hover .act, .card:hover .act, .bar .act { opacity: 1; }
.act:hover { color: var(--ink); text-decoration: underline; }
.moveto { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.moveto { align-items: center; }
.pill b { color: var(--ink); }
.chip { display: inline-block; margin-top: 2px; font-size: 12px; color: var(--sub); }
button.chip:hover { color: var(--ink); text-decoration: underline; }
.ret { border-left: 3px solid var(--wait); padding: 2px 0 2px 8px; font-size: 13px; }
.ret.fail { border-color: var(--fail); }
.ret .rs { font-weight: 700; margin-right: 4px; }
#input { border-top: 1px solid var(--line); padding: 10px 12px; }
#input .row { display: flex; align-items: flex-end; gap: 8px; }
#mic { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--sub); background: var(--bg); text-align: center; }
#mic:hover { color: var(--ink); }
#mic[aria-pressed="true"] { color: #fff; background: var(--fail); border-color: var(--fail); animation: listen 1.6s infinite; }
@keyframes listen { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--fail) 25%, transparent); } }
#input textarea { flex: 1; width: 100%; resize: none; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; color: inherit; background: var(--bg); max-height: 40vh; }
#note { font-size: 12px; color: var(--sub); min-height: 1em; margin-top: 4px; }

main { min-height: 0; overflow-y: auto; padding: 14px; }
#cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; align-content: start; }
.shelf { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; padding-top: 4px; border-top: 1px dashed var(--line); }
.tag { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 4px 2px 10px; background: var(--panel); font-size: 12px; cursor: pointer; max-width: 260px; }
.tag:hover { border-color: var(--sub); }
.tag .sym { font-size: 12px; }
.tag .name { font-weight: 500; }
.tag .status { padding: 0 6px; font-size: 11px; }
.tag.mark { border-color: var(--mark); }
#cards .empty { color: var(--sub); }
.card { display: flex; flex-direction: column; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-height: 120px; position: relative; }
.card:hover { border-color: var(--sub); }
.card.mark::after { content: ""; position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--mark); }
.head { display: flex; align-items: baseline; gap: 8px; }
.sym { font-weight: 700; font-size: 18px; }
.name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.status { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--soft); color: var(--sub); white-space: nowrap; }
.status.run { color: var(--run); }
.status.wait { color: var(--wait); }
.status.fail { color: var(--fail); }
.card { cursor: pointer; }
.turns .note { color: var(--sub); font-size: 12px; }
.last { color: var(--sub); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
.status.run::before { content: "● "; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .2; } }

#peek .bar { display: flex; align-items: baseline; gap: 10px; position: sticky; top: -14px; z-index: 1; margin: -14px -14px 12px; padding: 12px 14px 10px; background: var(--bg); border-bottom: 1px solid var(--line); }
#peek .bar button { color: var(--sub); }
#peek .bar button:hover { color: var(--ink); }
#peek .bar [data-side] { flex: none; align-self: center; }
#peek .bar [data-side][aria-pressed="true"] { color: var(--ink); }
.body { display: grid; grid-template-columns: minmax(0, 860px) minmax(min(220px, var(--side, 300px)), var(--side, 300px)); gap: 16px; align-items: start; }
.body.solo { grid-template-columns: minmax(0, 860px); }
.side { position: sticky; top: 56px; }
/* 画面が広いとき：本文と見出しの帯を真ん中に寄せ、帯の右端が本文から離れないようにする */
#peek { --w: calc(876px + var(--side, 300px)); }
#peek:has(.body.solo) { --w: 860px; }
#peek .body { max-width: var(--w); margin-inline: auto; }
#peek .bar { padding-inline: max(14px, calc((100% - var(--w)) / 2 + 14px)); }
@media (max-width: 1100px) { .body { grid-template-columns: minmax(0, 1fr); } .side { position: static; order: -1; } .side > .split { display: none; } }
/* 見出しの帯の右：情報の札（アイコンと短い名前） */
.info { margin-left: auto; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; flex: 0 1 auto; min-width: 0; }
.info .group { position: relative; }
.info .group summary { list-style: none; display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--ink); font-size: 12px; cursor: pointer; font-variant-numeric: tabular-nums; }
.info .group summary::-webkit-details-marker { display: none; }
.info .group summary:hover, .info .group[open] summary { border-color: var(--sub); }
.info .drop { position: absolute; right: 0; top: calc(100% + 4px); z-index: 5; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 8px; min-width: 200px; max-width: min(420px, 70vw); max-height: 50vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); box-shadow: 0 4px 16px rgba(0, 0, 0, .12); }
.info .drop a { max-width: 100%; }
.info a.file { text-decoration: none; color: var(--ink); }
.info a { display: inline-flex; align-items: center; gap: 4px; max-width: 180px; padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--ink); font-size: 12px; text-decoration: none; }
.info a:hover { border-color: var(--sub); }
.info a span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.info svg { flex: none; }
/* 右：決まったこと・まだのことの木 */
.tree { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
.tree .gh { display: flex; align-items: center; gap: 4px; width: 100%; font-size: 12px; font-weight: 600; }
.tree .gh .c { margin-left: auto; font-weight: 400; color: var(--sub); font-size: 11.5px; }
.tree .arrow { color: var(--sub); width: 1em; }
.tree ul { margin: 2px 0 0; padding: 0 0 0 1em; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.tree li { display: flex; gap: 6px; }
.tree .mk { width: 1em; flex: none; }
.tree .mk.done { color: var(--wait); }
.tree .mk.open { color: var(--run); }
.tree .why { font-size: 11.5px; color: var(--sub); }
.tree .pick { color: var(--run); }
.tree .qref { font-size: 11px; color: var(--run); border: 1px solid color-mix(in srgb, var(--run) 35%, var(--line)); border-radius: 999px; padding: 0 6px; }
/* 下：答えを待っている質問（会話の下に留まる） */
.asks { position: sticky; bottom: 0; margin-top: 12px; background: var(--panel); border: 1px solid color-mix(in srgb, var(--run) 40%, var(--line)); border-radius: 12px; box-shadow: 0 -6px 16px rgba(0, 0, 0, .06); }
.asks .tabs { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.asks .tab { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border: 1px solid transparent; border-radius: 999px; font-size: 12px; color: var(--sub); }
.asks .tab.got { color: var(--ink); }
.asks .tab.on { border-color: var(--run); background: color-mix(in srgb, var(--run) 8%, var(--panel)); color: var(--ink); font-weight: 600; }
.asks .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--sub); }
.asks .dot.got { background: var(--wait); border-color: var(--wait); }
.asks .n { margin-left: auto; font-size: 11.5px; color: var(--sub); font-variant-numeric: tabular-nums; }
.asks .send { margin-left: 6px; display: inline-grid; place-items: center; width: 26px; height: 22px; border-radius: 6px; background: var(--ink); color: var(--panel); font-size: 12px; }
.asks .send.all { background: var(--run); color: #fff; }
.asks .x, .asks .mini { color: var(--sub); padding: 0 4px; }
.asks .mini svg { display: block; }
.asks.small .tabs { border-bottom: 0; }
.asks .q { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
.asks .qt { font-weight: 600; font-size: 14px; }
.asks .qw { font-size: 12.5px; color: var(--sub); white-space: pre-wrap; }
.asks .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px; }
.asks .opt { display: flex; flex-direction: column; text-align: left; padding: 4px 8px; border: 1px solid color-mix(in srgb, var(--run) 30%, var(--line)); border-radius: 8px; }
.asks .opt:hover { border-color: var(--run); }
.asks .opt.on { border: 1.5px solid var(--run); background: color-mix(in srgb, var(--run) 8%, var(--panel)); }
.asks .opt b { font-size: 12.5px; color: var(--run); }
.asks .opt span { font-size: 11.5px; color: var(--sub); }
.icon { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; vertical-align: middle; }
.icon:hover { background: var(--soft); text-decoration: none; }
.turns { display: flex; flex-direction: column; gap: 8px; max-width: 860px; }
.turns > div { overflow-wrap: anywhere; }
.turns .human, .turns .error { white-space: pre-wrap; }
.tools { font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--sub); }
.tools summary { cursor: pointer; list-style: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tools summary::-webkit-details-marker { display: none; }
.tools summary::before { content: "▸ "; }
.tools[open] summary::before { content: "▾ "; }
.tools summary span { opacity: .75; margin-left: 6px; }
.tools div { padding-left: 14px; white-space: pre-wrap; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin: 0 0 .7em; }
.md h3, .md h4, .md h5, .md h6 { margin: .9em 0 .4em; font-size: 1em; }
.md h3 { font-size: 1.12em; }
.md ul, .md ol { padding-left: 1.4em; }
.md code { font: .92em ui-monospace, Menlo, monospace; background: var(--soft); padding: 1px 4px; border-radius: 4px; }
.md pre { background: var(--soft); padding: 8px 10px; border-radius: 6px; overflow-x: auto; }
.turns .ai { position: relative; }
.ai > .copy { position: absolute; top: 6px; right: 6px; opacity: 0; color: var(--sub); }
.ai:hover > .copy { opacity: 1; }
.code { position: relative; margin: 0 0 .7em; }
.code pre { margin: 0; }
.code .cbar { position: absolute; top: 4px; right: 4px; display: flex; gap: 2px; opacity: .35; }
.code:hover .cbar { opacity: 1; }
.code .cbar button { color: var(--sub); }
.code .cbar [data-run] { color: var(--wait); }
.code .run-out { margin-top: 4px; font: 12px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow: auto; border-left: 3px solid var(--wait); padding: 4px 8px; color: var(--sub); }
.code .run-out.bad { border-color: var(--fail); }
.code .run-send { margin-top: 4px; }
.reported { display: inline-flex; align-items: center; gap: 4px; }
.reported svg { flex: none; width: 11px; height: 11px; }
.reported code { font: 12px ui-monospace, Menlo, monospace; }
.code .run-sent { margin-top: 4px; display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--sub); }
.code .run-out .rc { display: block; font-size: 11px; opacity: .8; margin-bottom: 2px; }
.say a, .human a { color: var(--run); }
a.file { color: var(--run); text-decoration: underline dotted; text-underline-offset: 2px; }
a.file code { color: inherit; }
#settings .links { display: flex; flex-direction: column; gap: 4px; width: 100%; }
#settings .links .lr { display: flex; gap: 4px; align-items: center; }
#settings .links input { flex: 1; min-width: 0; font: 12px ui-monospace, Menlo, monospace; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
#settings .links input:first-child { flex: .6; }
#settings .links button { color: var(--sub); white-space: nowrap; }
#settings .links .hint { color: var(--sub); }
.md pre code { background: none; padding: 0; }
.md table { border-collapse: collapse; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; vertical-align: top; }
.md blockquote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--sub); }
.md hr { border: 0; border-top: 1px solid var(--line); }
.md a, .last a, .ret a { color: var(--run); }
.last code, .ret code { font: .92em ui-monospace, Menlo, monospace; }
.turns .human { align-self: flex-end; background: var(--soft); border-radius: 10px; padding: 6px 10px; max-width: 80%; position: relative; }
.turns .human .rewind { position: absolute; right: 100%; top: 4px; margin-right: 4px; opacity: 0; color: var(--sub); }
.turns .human:hover .rewind, .turns .human .rewind:focus-visible { opacity: 1; }
.turns .rewinding { align-self: flex-end; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 8px; align-items: center; font-size: 12px; color: var(--sub); max-width: 100%; }
.turns .rewinding ul { flex-basis: 100%; margin: 0; padding: 0; list-style: none; text-align: right; font: 12px ui-monospace, Menlo, monospace; overflow-wrap: anywhere; }
.turns .rewinding .warn { color: var(--fail); }
.turns .ai { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 34px 8px 12px; }
.turns .error { color: var(--fail); }
</style>
</head>

<section id="chat">

// 声の入力が止まってから、この間があいたら置く（ミリ秒）。キーボードで打ったものは Enter まで待つ
const PAUSE = 2000;
// 間の長さは設定から（設定がまだ届いていないときは PAUSE）
const pauseMs = () => (state.settings?.pause ?? PAUSE / 1000) * 1000;
// いちばん下を見ているか（このくらいの差なら下にいるとみなす）
const NEAR = 40;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const atBottom = (el) => el.scrollHeight - el.scrollTop - el.clientHeight < NEAR;
// Enter で置く。Shift+Enter は改行。IME の変換を確定する Enter では置かない（Safari は isComposing が外れていて keyCode が 229 になる）
function isSendKey(e) {
  return e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229;
}
// 返ってきた文の要の一行（見出し・引用・箇条書きの頭の記号を外す）
function headOf(s) {
  const lines = String(s ?? "").split("\n").filter((l) => l.trim() && !/^(```|\s*\|?\s*:?-{2,}|-{3,})/.test(l));
  // 見出しだけの行（「結論」など）は飛ばし、本文の一行目を出す。本文がなければ見出し
  const pick = lines.find((l) => !/^#+\s/.test(l)) ?? lines[0] ?? "";
  const line = pick.replace(/^(#+|>|[-*+]|\d+[.)])\s+/, "").trim();
  return line.length > 140 ? line.slice(0, 139) + "…" : line;
}

// vim の編集：v { text, pos, mode（insert か normal）, pend（打ちかけの d・c・y・g・r）, reg（消したり写したりしたもの）, undo（前の形の山） } と、押したキー
// 返すもの：{ handled（このキーを使ったか）, act（send：置く、leave：入力欄から抜ける）, v（新しい形） }。中から外のものを触らない
function vimKey(v, key) {
  const t = v.text, n = t.length, pos = Math.min(v.pos, n);
  const out = (o = {}) => ({ handled: true, act: o.act ?? null, v: { text: o.text ?? t, pos: o.pos ?? pos, mode: o.mode ?? v.mode, pend: o.pend ?? "", reg: o.reg ?? v.reg, undo: o.undo ?? v.undo } });
  const lsIn = (s, p) => s.lastIndexOf("\n", p - 1) + 1;
  const leIn = (s, p) => { const i = s.indexOf("\n", p); return i < 0 ? s.length : i; };
  const ls = (p) => lsIn(t, p), le = (p) => leIn(t, p);
  // ノーマルでは行の終わりの文字の上まで
  const clamp = (s, p) => { p = Math.max(0, Math.min(p, s.length)); return Math.max(lsIn(s, p), Math.min(p, leIn(s, p) - 1)); };
  if (v.mode === "insert") return key === "Escape" ? out({ mode: "normal", pos: Math.max(ls(pos), pos - 1) }) : { handled: false, act: null, v };
  // 文字の種類：空白・英数・ひらがな・カタカナ・漢字・そのほか。種類が変わるところを単語の切れ目にする
  const cls = (c) => (c == null ? -1 : /\s/.test(c) ? 0 : /\w/.test(c) ? 1 : /[぀-ゟ]/.test(c) ? 2 : /[゠-ヿ]/.test(c) ? 3 : /[一-鿿々]/.test(c) ? 4 : 5);
  const fwd = (p) => { const c = cls(t[p]); if (c > 0) while (p < n && cls(t[p]) === c) p++; while (p < n && cls(t[p]) === 0) p++; return p; };
  const back = (p) => { if (p <= 0) return 0; p--; while (p > 0 && cls(t[p]) === 0) p--; const c = cls(t[p]); while (p > 0 && cls(t[p - 1]) === c) p--; return p; };
  const end = (p) => { p++; while (p < n && cls(t[p]) === 0) p++; const c = cls(t[p]); while (p < n - 1 && cls(t[p + 1]) === c) p++; return Math.min(p, Math.max(0, n - 1)); };
  const first = (p) => { let s = ls(p); while (s < le(p) && /[ \t]/.test(t[s])) s++; return s; };
  const snap = [...v.undo, { text: t, pos }].slice(-100);
  // 書き換え：from〜to を消して ins を入れる。mode が insert なら、そのまま打てる
  const edit = (from, to, ins, o = {}) => {
    const text = t.slice(0, from) + ins + t.slice(to);
    const p = o.pos ?? from;
    return out({ text, pos: o.mode === "insert" ? p : clamp(text, p), undo: snap, reg: o.reg ?? v.reg, mode: o.mode });
  };
  if (v.pend === "r") return key.length === 1 && pos < le(pos) ? edit(pos, pos + 1, key, { pos }) : out();
  const k = v.pend + key;
  switch (k) {
    case "h": return out({ pos: Math.max(ls(pos), pos - 1) });
    case "l": return out({ pos: clamp(t, Math.min(pos + 1, le(pos))) });
    case "j": { const e = le(pos); if (e >= n) return out(); return out({ pos: clamp(t, Math.min(e + 1 + pos - ls(pos), le(e + 1))) }); }
    case "k": { const s = ls(pos); if (!s) return out(); const s2 = ls(s - 1); return out({ pos: clamp(t, Math.min(s2 + pos - s, s - 1)) }); }
    case "0": return out({ pos: ls(pos) });
    case "^": return out({ pos: first(pos) });
    case "$": return out({ pos: clamp(t, le(pos)) });
    case "w": return out({ pos: clamp(t, fwd(pos)) });
    case "b": return out({ pos: back(pos) });
    case "e": return out({ pos: end(pos) });
    case "gg": return out({ pos: 0 });
    case "G": return out({ pos: ls(n) });
    case "x": return pos < le(pos) ? edit(pos, pos + 1, "", { pos, reg: t[pos] }) : out();
    case "X": return pos > ls(pos) ? edit(pos - 1, pos, "", { reg: t[pos - 1] }) : out();
    case "s": return edit(pos, Math.min(pos + 1, le(pos)), "", { mode: "insert", reg: t.slice(pos, pos + 1) });
    case "dd": case "cc": case "S": {
      const s = ls(pos), e = le(pos), reg = t.slice(s, e) + "\n";
      if (k !== "dd") return edit(s, e, "", { mode: "insert", reg });
      if (e < n) return edit(s, e + 1, "", { reg });
      return s > 0 ? edit(s - 1, e, "", { pos: lsIn(t.slice(0, s - 1), s - 1), reg }) : edit(0, n, "", { reg });
    }
    case "D": case "d$": return edit(pos, le(pos), "", { pos, reg: t.slice(pos, le(pos)) });
    case "C": case "c$": return edit(pos, le(pos), "", { pos, mode: "insert", reg: t.slice(pos, le(pos)) });
    case "d0": return edit(ls(pos), pos, "", { reg: t.slice(ls(pos), pos) });
    case "dw": { const to = Math.min(fwd(pos), Math.max(le(pos), pos + 1)); return edit(pos, to, "", { pos, reg: t.slice(pos, to) }); }
    case "de": { const to = end(pos) + 1; return edit(pos, to, "", { pos, reg: t.slice(pos, to) }); }
    case "db": { const from = back(pos); return edit(from, pos, "", { reg: t.slice(from, pos) }); }
    case "cw": case "ce": { const to = Math.min(end(pos) + 1, n); return edit(pos, to, "", { pos, mode: "insert", reg: t.slice(pos, to) }); }
    case "yy": return out({ reg: t.slice(ls(pos), le(pos)) + "\n" });
    case "yw": return out({ reg: t.slice(pos, fwd(pos)) });
    case "p": case "P": {
      const r = v.reg;
      if (!r) return out();
      if (r.endsWith("\n")) {
        const at = k === "p" ? le(pos) : ls(pos), body = r.slice(0, -1);
        return k === "p" ? edit(at, at, "\n" + body, { pos: at + 1 }) : edit(at, at, body + "\n", { pos: at });
      }
      const at = k === "p" && n ? Math.min(pos + 1, le(pos)) : pos;
      return edit(at, at, r, { pos: at + r.length - 1 });
    }
    case "u": { const last = v.undo.at(-1); return last ? out({ text: last.text, pos: clamp(last.text, last.pos), undo: v.undo.slice(0, -1) }) : out(); }
    case "i": return out({ mode: "insert", undo: snap });
    case "a": return out({ mode: "insert", undo: snap, pos: Math.min(pos + 1, le(pos)) });
    case "I": return out({ mode: "insert", undo: snap, pos: first(pos) });
    case "A": return out({ mode: "insert", undo: snap, pos: le(pos) });
    case "o": return edit(le(pos), le(pos), "\n", { pos: le(pos) + 1, mode: "insert" });
    case "O": return edit(ls(pos), ls(pos), "\n", { pos: ls(pos), mode: "insert" });
    case "Enter": return out({ act: "send", mode: "insert" });
    case "Escape": return out({ act: "leave" });
    case "d": case "c": case "y": case "g": case "r": return out({ pend: k });
    default: return out();
  }
}

// リンクの決まり（設定から作る）：{ re, url }。画面の中だけで持つ
let LINK_RULES = [];

// エスケープ済みの HTML の、地の文だけに決まりを当てて押せるようにする（タグ・リンク・コードの中には当てない）。
// まず http・https の URL、次に利用者の決まり。url の $0 は当たった言葉全体、$1… は括弧の中
function linkify(html, rules) {
  const SKIP = /(<a\b[^>]*>[\s\S]*?<\/a>|<code>[\s\S]*?<\/code>|<[^>]+>)/;
  const apply = (h, re, toUrl) => h.split(SKIP).map((part, i) => (i % 2 ? part : part.replace(re, (...m) => `<a href="${toUrl(m)}" target="_blank" rel="noopener">${m[0]}</a>`))).join("");
  let out = apply(html, /https?:\/\/[^\s<>"]+[^\s<>".,、。)）]/g, (m) => m[0]);
  // 手元のファイルの場所（src/a.js:42 や ~/memo.md など）は、押すと手元のアプリで開く
  out = out.split(SKIP).map((part, i) => (i % 2 ? part : part.replace(FILE, (m) => fileLink(m, m)))).join("");
  for (const r of rules) out = apply(out, r.re, (m) => r.url.replace(/\$(\d)/g, (_, n) => m[Number(n)] ?? ""));
  return out;
}

// ファイルの場所：フォルダを一つ以上含み拡張子で終わるもの（~/ / ./ ../ で始まってもよい）か、行の番号の付いたファイル名。うしろに :行:桁 が付いてもよい
const FILE = /(?<![\w/.:@-])(?:(?:~\/|\/|\.{1,2}\/)?(?:[\w.-]+\/)+[\w.-]+\.[A-Za-z][A-Za-z0-9]*|[\w-][\w.-]*\.[A-Za-z][A-Za-z0-9]*(?=:\d))(?::\d+(?::\d+)?)?(?![\w/])/g;

// ファイルの場所を、押すと開くリンクにする。where は場所の文（エスケープ済み）、label は見せるもの
function fileLink(where, label) {
  const m = where.match(/^(.*?)(?::(\d+))?(?::(\d+))?$/);
  return `<a href="#" class="file" data-open="${m[1]}"${m[2] ? ` data-line="${m[2]}"` : ""}${m[3] ? ` data-col="${m[3]}"` : ""}>${label}</a>`;
}

// 一行の中のマークダウン：コード・太字・斜体・リンク（http と https だけ）。先にエスケープしてから形を付け、最後にリンクの決まりを当てる
function inline(t) {
  return linkify(String(t ?? "").split(/(`[^`\n]+`)/).map((part, i) => i % 2
    // コードの中身がまるごとファイルの場所なら、押せるようにする
    ? (new RegExp(`^(?:${FILE.source})$`).test(part.slice(1, -1)) ? fileLink(esc(part.slice(1, -1)), `<code>${esc(part.slice(1, -1))}</code>`) : `<code>${esc(part.slice(1, -1))}</code>`)
    : esc(part)
        .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
        .replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\w)/g, "$1<i>$2</i>")
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  ).join(""), LINK_RULES);
}

// 押したシェルの結果（コードの文 -> { busy } か { code, out }）。画面の中だけで持つ
const runs = new Map();
const SHELL = /^(sh|bash|zsh|shell|console|terminal)$/i;

// 人の発言の見せ方。シェルの結果を送ったものは「▶ コマンド（終了コード）」の一行に縮める（中身は title に）
function sayView(text) {
  const m = String(text).startsWith(L.reportHead) && text.match(/^[^\n]*\n```\n\$ ([^\n]*)\n[\s\S]*\n```\n[^\n]*?(-?\d+)$/);
  if (!m) return linkify(esc(text), LINK_RULES);
  return `<span class="reported" title="${esc(text)}">${ICON.run}<code>${esc(L.reportView(m[1], m[2]))}</code></span>`;
}

// シェルを動かした結果を、動かしたセッションへ送る（一度だけ）
function report(cmd) {
  const r = runs.get(cmd);
  if (!r || r.busy || r.sent || r.session == null) return;
  r.sent = true;
  render();
  fetch("/api/report", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ session: r.session, cmd, code: r.code, out: r.out }) })
    .then((x) => x.json()).then((x) => { if (!x.ok) { r.sent = false; $("#note").textContent = L.reportBad(x.message ?? ""); render(); } })
    .catch((e) => { r.sent = false; $("#note").textContent = L.reportBad(String(e)); render(); });
}

// コードの塊：コピーのボタン。シェルなら実行のボタンと、押したあとの結果
function codeBlock(lang, text) {
  const r = runs.get(text);
  const icon = (d) => `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const copy = `<button class="icon" data-copy-code title="${esc(L.copyCode)}" aria-label="${esc(L.copyCode)}">${icon('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>')}</button>`;
  const runBtn = SHELL.test(lang) ? `<button class="icon" data-run title="${esc(L.run)}" aria-label="${esc(L.run)}">${icon('<path d="M7 4l12 8-12 8z"/>')}</button>` : "";
  // 結果の下：送る先のセッションがあれば、送るチップか、送った印
  const to = r?.session != null ? ses(r.session) : null;
  const send = !r || r.busy || !to ? "" : r.sent ? `<div class="run-sent">${ICON.send}<span>${esc(L.reported(to.sym))}</span></div>` : `<div class="run-send">${chipBtn("data-report", ICON.send, L.reportTo(to.sym), L.reportTitle)}</div>`;
  const out = !r ? "" : r.busy ? `<div class="run-out">${esc(L.running)}</div>` : `<div class="run-out${r.code === 0 ? "" : " bad"}"><span class="rc">${esc(L.exit(r.code))}</span>${esc(r.out)}</div>${send}`;
  return `<div class="code"><div class="cbar">${runBtn}${copy}</div><pre><code>${esc(text)}</code></pre>${out}</div>`;
}

// マークダウンを HTML に：見出し・段落・箇条書き・番号つき・コードの塊・表・引用・区切り線
function md(src) {
  const lines = String(src ?? "").replace(/\r/g, "").split("\n");
  const LIST = /^\s*([-*+]|\d+[.)])\s+/;
  const START = /^(```|#{1,6}\s|>|\s*\||\s*([-*+]|\d+[.)])\s)/;
  const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
  const out = [];
  for (let i = 0; i < lines.length;) {
    const l = lines[i];
    let m;
    if (/^```/.test(l)) {
      const lang = l.slice(3).trim().split(/\s/)[0], buf = [];
      for (i++; i < lines.length && !/^```/.test(lines[i]); i++) buf.push(lines[i]);
      i++;
      out.push(codeBlock(lang, buf.join("\n")));
    } else if ((m = l.match(/^(#{1,6})\s+(.*)$/))) {
      const n = Math.min(m[1].length + 2, 6);
      out.push(`<h${n}>${inline(m[2])}</h${n}>`);
      i++;
    } else if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)) {
      out.push("<hr>");
      i++;
    } else if (LIST.test(l)) {
      const tag = /^\s*\d/.test(l) ? "ol" : "ul", items = [];
      while (i < lines.length && LIST.test(lines[i])) items.push(lines[i++].replace(LIST, ""));
      out.push(`<${tag}>${items.map((t) => `<li>${inline(t)}</li>`).join("")}</${tag}>`);
    } else if (/^\s*\|/.test(l) && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1] ?? "")) {
      const head = cells(l), rows = [];
      for (i += 2; i < lines.length && /^\s*\|/.test(lines[i]); i++) rows.push(cells(lines[i]));
      out.push(`<table><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
    } else if (/^>/.test(l)) {
      const buf = [];
      while (i < lines.length && /^>/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
      out.push(`<blockquote>${md(buf.join("\n"))}</blockquote>`);
    } else if (!l.trim()) {
      i++;
    } else {
      const buf = [l];
      for (i++; i < lines.length && lines[i].trim() && !START.test(lines[i]); i++) buf.push(lines[i]);
      out.push(`<p>${buf.map(inline).join("<br>")}</p>`);
    }
  }
  return out.join("");
}

// 巻き戻せるか（サーバーの rewindable と同じ決まり）
const rewindable = (x, say) => {
  if (!x || say == null || x.status === "run" || x.status === "idle") return false;
  const i = x.turns?.findIndex((t) => t.say === say) ?? -1;
  return i === 0 || (i > 0 && !!x.turns[i - 1].mark);
};
let rewinding = null; // 巻き戻すか確かめている発言（"セッション:発言"。画面の中だけ）

// 書き換えたファイル（道具の一行から）
const WROTE = /^(?:Edit|Write|MultiEdit|NotebookEdit) (\S.*)$/;
const wrote = (flow) => [...new Set(flow.filter((f) => f.who === "tool").map((f) => f.text.match(WROTE)?.[1]?.trim()).filter(Boolean))];

// 巻き戻す前に、その場で確かめる：戻すファイルと、同じファイルをほかのセッションも書いたか
function rewindAsk(x, say) {
  const k = `${x.id}:${say}`;
  const t = x.turns.find((u) => u.say === say);
  const files = wrote(x.flow.slice(t.flowAt));
  const others = (file) => state.sessions.filter((y) => y.id !== x.id && !y.hidden && wrote(y.flow).includes(file)).map((y) => y.sym);
  const canFiles = files.length && t.prompt;
  return `<div class="rewinding"><span>${esc(L.rewindSure)}</span>` +
    (files.length ? `<ul><li>${esc(L.rewindFiles)}</li>${files.map((file) => { const o = others(file); return `<li${o.length ? ` class="warn"` : ""}>${esc(file)}${o.length ? ` — ${esc(L.rewindOthers(o))}` : ""}</li>`; }).join("")}</ul>` : "") +
    (canFiles ? chipBtn(`data-rewind-go="${k}" data-files="1"`, ICON.rewind, L.rewindAll) + chipBtn(`data-rewind-go="${k}"`, ICON.rewind, L.rewindTalk) : chipBtn(`data-rewind-go="${k}"`, ICON.rewind, L.rewindGo)) +
    iconBtn(`data-rewind="${k}"`, ICON.close, L.rewindQuit) + `</div>`;
}

// やりとりを並べる。続けて使った道具は一つに畳む（開いたかどうかは画面の中だけで覚える）
function turnsOf(x, opened, label) {
  const out = [];
  for (let i = 0; i < x.flow.length;) {
    const f = x.flow[i];
    if (f.who !== "tool") {
      out.push(f.who === "ai"
        ? `<div class="ai md"><button class="copy icon" data-copy-flow="${x.id}:${i}" title="${esc(L.copy)}" aria-label="${esc(L.copy)}">${ICON.copy}</button>${md(f.text)}</div>`
        : f.who === "human"
          ? `<div class="human">${rewindable(x, f.say) ? `<button class="rewind icon" data-rewind="${x.id}:${f.say}" title="${esc(L.rewind)}" aria-label="${esc(L.rewind)}">${ICON.rewind}</button>` : ""}${sayView(f.text)}</div>` +
            (rewinding === `${x.id}:${f.say}` ? rewindAsk(x, f.say) : "")
          : `<div class="${f.who}">${esc(f.text)}</div>`);
      i++;
      continue;
    }
    const key = `${x.id}:${i}`, tools = [];
    while (i < x.flow.length && x.flow[i].who === "tool") tools.push(x.flow[i++].text);
    out.push(`<details class="tools" data-key="${key}"${opened.has(key) ? " open" : ""}><summary>${esc(label(tools.length))}<span>${esc(tools.at(-1))}</span></summary><div>${tools.map(esc).join("\n")}</div></details>`);
  }
  return out.join("");
}

let state = { said: [], sessions: [], chat: [] };
let peek = null;          // 覗いているセッション
const seen = new Map();   // セッション -> 見た終わり（印を消すため。画面の中だけで持つ）
const opened = new Set(); // 開いた道具のまとまり
let first = true;

const ses = (id) => state.sessions.find((x) => x.id === id);
// 場所の短い名前（いちばん下のフォルダ）
const baseName = (p) => String(p ?? "").replace(/[\\/]+$/, "").split(/[\\/]/).pop() || String(p ?? "");
// 時刻（ミリ秒）を「11/26 14:03」に
const whenOf = (at) => { const d = new Date(at); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };

const svg = (d) => `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  // 右のパネル：右に縦の仕切りがある枠
  side: svg('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>'),
  // 送り先を変える：行き先を入れ替える矢印
  move: svg('<path d="M7 7h13M16 3l4 4-4 4M17 17H4M8 13l-4 4 4 4"/>'),
  // 畳む：内側へ寄せる矢印。広げる：外へ開く矢印
  fold: svg('<path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>'),
  unfold: svg('<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>'),
  // コピー：重なった紙
  copy: svg('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>'),
  // 取り消す：丸にバツ
  cancel: svg('<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>'),
  // 履歴：時計に戻る矢印
  history: svg('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>'),
  // 一覧に戻る：左向きの矢印
  back: svg('<path d="M19 12H5M11 6l-6 6 6 6"/>'),
  // 止める：四角
  stop: svg('<rect x="6" y="6" width="12" height="12" rx="2"/>'),
  // 足す：十字

  // 送る：上向きの矢印

  // 元に戻す：左へ戻る曲がった矢印

  // リセット：消しゴム
  reset: svg('<path d="M20 20H9L4 15a2 2 0 0 1 0-3l9-9a2 2 0 0 1 3 0l4 4a2 2 0 0 1 0 3l-8 8"/><path d="M8 11l6 6"/>'),
  // 動かした：右向きの三角

  // 閉じる：バツ

// ボタンは文字で作らない：アイコンだけ（説明はマウスを載せると出る）か、アイコンと短い名前のチップ
const iconBtn = (attrs, icon, label, cls = "") => `<button class="icon${cls ? ` ${cls}` : ""}" ${attrs} title="${esc(label)}" aria-label="${esc(label)}">${icon}</button>`;
const chipBtn = (attrs, icon, label, title = label, cls = "") => `<button class="pill${cls ? ` ${cls}` : ""}" ${attrs} title="${esc(title)}">${icon ?? ""}<span>${esc(label)}</span></button>`;

// 幅と右のパネル：この画面を見る人の好み。ブラウザに覚え、読めなくても既定の幅で描く
const layout = (() => { try { return JSON.parse(localStorage.getItem("dyve.layout")) ?? {}; } catch { return {}; } })();
const saveLayout = () => { try { localStorage.setItem("dyve.layout", JSON.stringify(layout)); } catch {} };
const applyLayout = () => {
  for (const k of ["chat", "side"]) layout[k] ? document.documentElement.style.setProperty(`--${k}`, `${layout[k]}px`) : document.documentElement.style.removeProperty(`--${k}`);
};
applyLayout();
$("[data-split=chat]").title = L.split;
// 取っ手を引く：取っ手が指の下に来るように幅を合わせる（右のパネルは真ん中寄せで動きが半分になるので、何度か寄せる）
let drag = null;
const MIN = { chat: 220, side: 180 }, MAX = { chat: () => innerWidth - 360, side: () => 640 };
document.addEventListener("pointerdown", (e) => {
  const h = e.target.closest?.("[data-split]");
  if (!h || e.button !== 0) return;
  e.preventDefault();
  drag = h.dataset.split;
  layout[drag] = (drag === "chat" ? $("#chat") : h.parentElement).getBoundingClientRect().width;
  document.body.classList.add("dragging");
});
addEventListener("pointermove", (e) => {
  if (!drag) return;
  for (let i = 0; i < 4; i++) {
    const h = $(`[data-split=${drag}]`);
    if (!h) break;
    const r = h.getBoundingClientRect(), err = r.left + r.width / 2 - e.clientX;
    if (Math.abs(err) < 1) break;
    const w = Math.round(Math.min(Math.max(layout[drag] + (drag === "chat" ? -err : err), MIN[drag]), MAX[drag]()));
    if (w === layout[drag]) break;
    layout[drag] = w;
    applyLayout();
  }
});
const endDrag = () => { if (!drag) return; drag = null; document.body.classList.remove("dragging"); saveLayout(); };
addEventListener("pointerup", endDrag);
addEventListener("pointercancel", endDrag);
document.addEventListener("dblclick", (e) => {
  const h = e.target.closest?.("[data-split]");
  if (!h) return;
  delete layout[h.dataset.split];
  applyLayout();
  saveLayout();
});

// 取り消せるか（サーバーの cancelable と同じ決まり）
const cancelable = (s) => !!s && !s.canceled && !s.done && s.session !== null;
const busy = (x) => x.status === "run" || x.status === "idle";
let moving = null; // 送り先を選び直している発言（画面の中だけ）

function actsOf(s) {
  if (s.canceled) return `<span class="chip">${esc(L.canceled)}</span>`;
  // 係が読んでいるあいだは付け替えさせない（係の答えとぶつかるため）
  const movable = s.session !== undefined || s.error;
  return `<div class="acts">${chipOf(s)}` +
    (movable ? `<button class="act icon" data-move="${s.id}" title="${esc(L.move)}" aria-label="${esc(L.move)}">${ICON.move}</button>` : "") +
    (cancelable(s) ? `<button class="act icon" data-cancel="${s.id}" title="${esc(L.cancel)}" aria-label="${esc(L.cancel)}">${ICON.cancel}</button>` : "") +
    `</div>` + (moving === s.id ? moveTo(s) : "");
}

function moveTo(s) {
  const to = state.sessions.filter((x) => !x.hidden && x.id !== s.session);
  return `<div class="moveto">${to.map((x) => chipBtn(`data-to="${x.id}" data-say="${s.id}"`, `<b>${esc(x.sym)}</b>`, x.name, L.to(x.sym, x.name))).join("")}` +
    chipBtn(`data-to="new" data-say="${s.id}"`, ICON.plus, L.moveNewShort, L.moveNew) + iconBtn(`data-move="${s.id}"`, ICON.close, L.moveQuit) + `</div>`;
}

function chipOf(s) {
  if (s.session === undefined) return s.error ? `<span class="chip">${esc(L.missed(s.error))}</span>` : `<span class="chip">${L.pending}</span>`;
  if (s.session === null) return `<span class="chip">${esc(L.aside)}</span>`;
  const x = ses(s.session);
  return x ? chipBtn(`data-go="${x.id}"`, `<b>${esc(x.sym)}</b>`, x.name, L.to(x.sym, x.name), "small") : "";
}

function renderChat() {
  const el = $("#flow"), keep = atBottom(el);
  const said = new Map(state.said.map((s) => [s.id, s]));
  el.innerHTML = state.chat.length ? state.chat.map((c) => {
    if (c.say != null) {
      const s = said.get(c.say);
      // 清書した文を出し、元の文は title に残す
      return `<div class="say${s.canceled ? " canceled" : ""}"><p${s.fair ? ` title="${esc(L.original(s.text))}"` : ""}>${sayView(s.fair ?? s.text)}</p>${actsOf(s)}</div>`;
    }
    const x = ses(c.reply);
    return `<button class="ret${c.error ? " fail" : ""}" data-go="${x.id}"><span class="rs">${esc(x.sym)}</span>${inline(headOf(c.text))}</button>`;
  }).join("") : `<div class="empty">${esc(L.emptyChat)}</div>`;
  if (keep || first) el.scrollTop = el.scrollHeight;
}

function marked(x) {
  return (x.status === "wait" || x.status === "fail") && seen.get(x.id) !== x.endedAt;
}

// 今の場所と違う場所で起きたセッションには、その場所を小さく添える
const roomTag = (x) => (x.room && x.room !== state.room ? `<span class="pill small" title="${esc(L.roomOf(x.room))}">${ICON.folder}<span>${esc(baseName(x.room))}</span></span>` : "");

function renderCards() {
  const el = $("#cards");
  const live = [...state.sessions.filter((x) => !x.hidden)].reverse();
  const open = live.filter((x) => !x.folded), folded = live.filter((x) => x.folded);
  const btn = (x) => busy(x)
    ? iconBtn(`data-stop="${x.id}"`, ICON.stop, L.stop, "act")
    : `<button class="act icon" data-fold="${x.id}" title="${esc(L.fold)}" aria-label="${esc(L.fold)}">${ICON.fold}</button>`;
  el.innerHTML = live.length
    ? open.map((x) => `
    <div class="card${marked(x) ? " mark" : ""}${vimOn() && sel === x.id ? " sel" : ""}" data-go="${x.id}">
      <div class="head"><span class="sym">${esc(x.sym)}</span><span class="name">${esc(x.name)}</span>${roomTag(x)}${btn(x)}<span class="status ${x.status}">${esc(L.status[x.status])}</span></div>
      <div class="last">${inline(headOf(x.last))}</div>
    </div>`).join("") +
      // 畳んだものは、一覧の下に小さな札で並べる
      (folded.length ? `<div class="shelf">${folded.map((x) => `<span class="tag${marked(x) ? " mark" : ""}" data-go="${x.id}" title="${esc(headOf(x.last))}"><span class="sym">${esc(x.sym)}</span><span class="name">${esc(x.name)}</span><span class="status ${x.status}">${esc(L.status[x.status])}</span><button class="act icon" data-unfold="${x.id}" title="${esc(L.unfold)}" aria-label="${esc(L.unfold)}">${ICON.unfold}</button></span>`).join("")}</div>` : "")
    : `<div class="empty">${esc(L.emptyCards)}</div>`;
}

// 質問への答え（送るまでは画面の中だけ）：セッション -> { seq（どの質問の束か）, at（いま見ている質問）, picked（質問 -> 選んだ名前）, small（小さくしているか） }
const answers = new Map();
const closedGroups = new Set(); // 閉じた木の話題（セッション:名前）
const answerOf = (x) => {
  let a = answers.get(x.id);
  // 新しい質問が来たら、選んだものも小さくしていたのも忘れる
  if (!a || a.seq !== x.asks?.seq) answers.set(x.id, (a = { seq: x.asks?.seq, at: 0, picked: {}, small: false }));
  return a;
};

// 見出しの帯の右の情報：見たページ・書いたファイル（道具から）と、返事に出てきたリンクの決まりの言葉（課題の番号など）
function infoOf(x) {
  const icon = { page: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>', file: '<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/>', rule: '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/>' };
  const ico = (k) => `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icon[k]}</svg>`;
  // 札：{ kind, html（短い名前の札）, long（一覧に出す長い名前の札） }
  const card = (kind, attrs, short, long, title) => ({
    kind,
    html: `<a ${attrs} title="${esc(title)}">${ico(kind)}<span>${esc(short)}</span></a>`,
    long: `<a ${attrs} title="${esc(title)}">${ico(kind)}<span>${esc(long)}</span></a>`,
  });
  const items = (x.info ?? []).map((i) => {
    if (i.kind === "page") {
      let host = i.ref, long = i.ref;
      try { const u = new URL(i.ref); host = u.host.replace(/^www\./, ""); long = host + u.pathname.replace(/\/$/, ""); } catch {}
      return card("page", `href="${esc(i.ref)}" target="_blank" rel="noopener"`, host, long, i.ref);
    }
    return card("file", `href="#" class="file" data-open="${esc(i.ref)}"`, i.ref.split("/").pop(), i.ref, i.ref);
  });
  // リンクの決まりに当てはまる言葉（新しく出たものから 6 つ）
  const seenRef = new Set(), rules = [];
  for (const f of [...x.flow].reverse()) {
    if (f.who !== "ai") continue;
    for (const r of LINK_RULES) for (const m of f.text.matchAll(r.re)) {
      if (seenRef.has(m[0]) || rules.length >= 6) continue;
      seenRef.add(m[0]);
      rules.push(card("rule", `href="${esc(r.url.replace(/\$(\d)/g, (_, n) => m[Number(n)] ?? ""))}" target="_blank" rel="noopener"`, m[0], m[0], m[0]));
    }
  }
  const all = [...items.reverse(), ...rules];
  if (!all.length) return "";
  // 増えたら（4 つ以上）、種類ごとに「アイコンと数」のチップにまとめ、押すと一覧が開く。一つしかない種類はそのまま
  const body = all.length <= 3 ? all.map((c) => c.html).join("") : ["page", "file", "rule"].map((kind) => {
    const cs = all.filter((c) => c.kind === kind);
    if (cs.length <= 1) return cs.map((c) => c.html).join("");
    const key = `info:${x.id}:${kind}`;
    return `<details class="group" data-key="${key}"${opened.has(key) ? " open" : ""}><summary title="${esc(L.infoKinds[kind](cs.length))}">${ico(kind)}<span>${cs.length}</span></summary><div class="drop">${cs.map((c) => c.long).join("")}</div></details>`;
  }).join("");
  return `<nav class="info" aria-label="${esc(L.infoNav)}">${body}</nav>`;
}

// 右の木：話題ごとに、決まったこと（✓）とまだのこと（?）。? は下の質問とつながり、選んだ答えも仮に出す
function treeOf(x) {
  if (!x.tree?.length) return "";
  const a = x.asks ? answerOf(x) : null;
  return `<div class="tree">${x.tree.map((g) => {
    const key = `${x.id}:${g.name}`, open = !closedGroups.has(key);
    const done = g.items.filter((it) => it.done).length;
    return `<div><button class="gh" data-group="${esc(key)}" aria-expanded="${open}"><span class="arrow">${open ? "▾" : "▸"}</span>${esc(g.name)}<span class="c">${done}/${g.items.length}</span></button>` +
      (open ? `<ul>${g.items.map((it) => {
        const pick = !it.done && it.ask && a?.picked[it.ask - 1];
        return `<li><span class="mk ${it.done ? "done" : "open"}">${it.done ? "✓" : "?"}</span><div><div><b>${inline(it.name)}</b> ${inline(it.value ?? "")}${pick ? ` <span class="pick">→ ${esc(pick)}</span>` : ""}${!it.done && it.ask && x.asks?.questions[it.ask - 1] ? ` <button class="qref" data-qtab="${it.ask - 1}" data-session="${x.id}">${esc(L.askRef(it.ask))}</button>` : ""}</div>${it.why ? `<div class="why">${inline(it.why)}</div>` : ""}</div></li>`;
      }).join("")}</ul>` : "") + "</div>";
  }).join("")}</div>`;
}

// 下の質問：一問ずつ。上の一行に番号と答え、送る。選んだら、まだ答えていない次の質問へ
function asksOf(x) {
  if (!x.asks) return "";
  const qs = x.asks.questions, a = answerOf(x), q = qs[Math.min(a.at, qs.length - 1)];
  const got = Object.keys(a.picked).length;
  const tabs = qs.map((it, i) => `<button class="tab${i === a.at ? " on" : ""}${a.picked[i] ? " got" : ""}" data-qtab="${i}" data-session="${x.id}"><span class="dot${a.picked[i] ? " got" : ""}"></span>${i + 1} ${esc(a.picked[i] ?? it.title)}</button>`).join("");
  // 小さくしているときは上の一行だけ（番号を押すか、もう一度押すと広がる）
  const mini = `<button class="mini" data-mini="${x.id}" title="${esc(a.small ? L.askOpen : L.askMini)}" aria-label="${esc(a.small ? L.askOpen : L.askMini)}" aria-expanded="${!a.small}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${a.small ? "M6 15l6-6 6 6" : "M6 9l6 6 6-6"}"/></svg></button>`;
  const head = `<div class="tabs">${qs.length > 1 || a.small ? tabs : ""}<span class="n">${got}/${qs.length}</span><button class="send${got === qs.length ? " all" : ""}" data-send="${x.id}" title="${esc(L.askSendTitle)}" aria-label="${esc(L.askSend)}">${ICON.send}</button>${mini}<button class="x" data-drop="${x.id}" title="${esc(L.askDrop)}" aria-label="${esc(L.askDrop)}">${ICON.close}</button></div>`;
  if (a.small) return `<section class="asks small" aria-label="${esc(q.title)}">${head}</section>`;
  return `<section class="asks" aria-label="${esc(q.title)}">
    ${head}
    <div class="q"><div class="qt">${inline(q.title)}</div>${q.why ? `<div class="qw">${inline(q.why)}</div>` : ""}
      <div class="opts">${q.options.map((o) => `<button class="opt${a.picked[a.at] === o.label ? " on" : ""}" data-opt="${esc(o.label)}" data-session="${x.id}"><b>${o.recommended ? esc(L.best) : ""}${esc(o.label)}</b>${o.effect ? `<span>${inline(o.effect)}</span>` : ""}</button>`).join("")}</div>
    </div></section>`;
}

function renderPeek() {
  const el = $("#peek"), x = ses(peek);
  if (!x || x.hidden) { peek = null; return renderCards(); }
  seen.set(x.id, x.endedAt);
  const main = $("main"), keep = atBottom(main), side = x.tree?.length && !layout.sideOff;

    <div class="bar">${iconBtn("data-close", ICON.back, L.close)}<span class="sym">${esc(x.sym)}</span><span class="name">${esc(x.name)}</span>${roomTag(x)}${busy(x) ? iconBtn(`data-stop="${x.id}"`, ICON.stop, L.stop, "act") : ""}<span class="status ${x.status}">${esc(L.status[x.status])}</span>${infoOf(x)}${x.tree?.length ? `<button class="icon" data-side aria-pressed="${!layout.sideOff}" title="${esc(layout.sideOff ? L.sideShow : L.sideHide)}" aria-label="${esc(layout.sideOff ? L.sideShow : L.sideHide)}">${ICON.side}</button>` : ""}</div>
    <div class="body${side ? "" : " solo"}"><div><div class="turns">${turnsOf(x, opened, L.tools)}</div>${asksOf(x)}</div>${side ? `<aside class="side"><div class="split" data-split="side" title="${esc(L.split)}"></div>${treeOf(x)}</aside>` : ""}</div>`;
  if (keep) main.scrollTop = main.scrollHeight;
}

// 作業する場所：入力欄の上のチップを押すと、そのすぐ上に出る。書いて Enter か、前に使った場所を押す。変えたら閉じる

// タイトルの横の利用枠：使った割合。8 割を超えたら目立たせ、止められていたら赤
function renderQuota() {
  const el = $("#quota"), q = state.quota;
  el.hidden = !q || (q.five == null && q.week == null);
  if (el.hidden) return;
  const pct = (v) => Math.round(v * 100);
  const cls = (v) => (q.status !== "allowed" && v >= 1 ? "out" : v >= 0.8 ? "hi" : "");
  const part = (v, f) => (v == null ? "" : `<span class="${cls(v)}">${esc(f(pct(v)))}</span>`);
  const rows = [["five", q.five, q.fiveAt], ["week", q.week, q.weekAt]].filter(([, v]) => v != null)
    .map(([k, v, at]) => `<div><b>${esc(L.quotaRow(L.quotaNames[k], pct(v)))}</b>${at ? `<br><span class="sub">${esc(L.quotaReset(...resetOf(at, Date.now())))}</span>` : ""}</div>`);
  el.innerHTML = L.quota(part(q.five, L.quotaFive), part(q.week, L.quotaWeek)) + `<span class="tip"><span class="sub">${esc(L.quotaHead)}</span>${rows.join("")}</span>`;
}

// 戻る時刻（秒）を「11/25 16:00」と「あと 2 時間 13 分」に。過ぎていたら残りは 0 分
function resetOf(at, now) {
  const d = new Date(at * 1000), two = (n) => String(n).padStart(2, "0");
  const min = Math.max(0, Math.round((at * 1000 - now) / 60000));
  const h = Math.floor(min / 60), day = Math.floor(h / 24);
  const left = day ? L.quotaDays(day, h % 24) : L.quotaLeft(h, min % 60);
  return [`${d.getMonth() + 1}/${d.getDate()} ${two(d.getHours())}:${two(d.getMinutes())}`, left];
}

// vim のキー操作
const vimOn = () => state.settings?.keys === "vim";
let sel = null; // 画面のモードで選んでいるカード（画面の中だけ）
function renderMode() {
  const el = $("#mode"), m = $("#input textarea");
  el.hidden = !vimOn();
  if (el.hidden) { m.classList.remove("normal"); return; }
  const mode = document.activeElement === m ? input.vs.mode : "screen";
  el.className = mode;
  el.textContent = L.modes[mode];
  el.title = L.modeTitle;
  m.classList.toggle("normal", mode === "normal");
}
// フォーカスを動かすのはここだけ。人がキーで入力欄へ戻ると頼んだときに使う
function keyFocus(el) {
  el.focus();
}
const editable = (el) => el?.matches?.("input, textarea, select, [contenteditable]");
// 画面のモード：入力欄の外で j/k・Enter・gg/G・i か /
let screenPend = "";
function screenKey(e) {
  if (!vimOn() || editable(e.target) || e.metaKey || e.ctrlKey || e.altKey) return false;
  const main = $("main"), k = screenPend + e.key;
  screenPend = "";
  if (k === "i" || k === "/" || k === "a") {
    // 入力欄へ戻ったら、続きを打てるように文の終わりから（ノーマルの一文字の選択は外す）
    input.vs = { ...input.vs, mode: "insert" };
    keyFocus(input.m);
    input.m.setSelectionRange(input.m.value.length, input.m.value.length);
    renderMode();
    return true;
  }
  if (k === "g") { screenPend = "g"; return true; }
  if (peek != null || hist) {
    const step = { j: 60, k: -60, d: main.clientHeight / 2, u: -main.clientHeight / 2 }[k];
    if (step) { main.scrollTop += step; return true; }
    if (k === "gg") { main.scrollTop = 0; return true; }
    if (k === "G") { main.scrollTop = main.scrollHeight; return true; }
    if (k === "h" && peek != null) { open(null); return true; }
    return false;
  }
  // 一覧：開いているカードを並んでいる順に
  const ids = [...document.querySelectorAll("#cards .card[data-go]")].map((c) => Number(c.dataset.go));
  if (!ids.length) return false;
  const i = ids.indexOf(sel);
  const to = { j: i + 1, l: i + 1, k: i - 1, h: i - 1, gg: 0, G: ids.length - 1 }[k];
  if (to != null) {
    sel = ids[Math.max(0, Math.min(ids.length - 1, i < 0 ? 0 : to))];
    renderCards();
    const c = document.querySelector(`#cards .card[data-go="${sel}"]`);
    if (c && (c.offsetTop < main.scrollTop || c.offsetTop + c.offsetHeight > main.scrollTop + main.clientHeight)) main.scrollTop = c.offsetTop - 14;
    return true;
  }
  if ((k === "Enter" || k === "o") && ids.includes(sel)) { open(sel); return true; }
  return false;
}

// 上の帯：これから起こすセッションの場所と、履歴の口
function renderRoom() {
  const b = $("[data-roomchip]");
  b.innerHTML = `${ICON.folder}<span>${esc(baseName(state.room))}</span>`;
  b.title = L.roomTitle(state.room ?? "");
  renderRoomPick();
  renderMode();
  const h = $("[data-history]");
  h.hidden = !state.history?.length && !hist;
  h.setAttribute("aria-pressed", String(hist));
}

// 履歴：リセットで外した区切りを新しいほうから。セッションは押すと読み返せる
let hist = false; // 履歴を見ているか（画面の中だけ）
let opening = null; // 履歴から戻して開くセッション（一覧に戻ってきたら開く。届く順は決まっていないため）
const openBack = () => { const x = ses(opening); if (x && !x.hidden) { const id = opening; opening = null; open(id); } };
function renderHistory() {
  const said = new Map(state.said.map((s) => [s.id, s]));
  const eras = [...(state.history ?? [])].reverse();
  const era = (h) => {
    const xs = h.sessions.map(ses).filter(Boolean);
    const lines = h.chat.map((c) => {
      if (c.say != null) { const s = said.get(c.say); return s ? `<div>${esc(s.fair ?? s.text)}</div>` : ""; }
      const x = ses(c.reply);
      return x ? `<div class="r">${esc(x.sym)}　${esc(headOf(c.text))}</div>` : "";
    }).join("");
    const first = h.chat.map((c) => said.get(c.say)).find(Boolean);
    return `<div class="era"><div class="when">${esc(L.historyWhen(whenOf(h.at), xs.length))}${chipBtn(`data-era="${h.seq}"`, ICON.undo, L.eraBack, L.eraBackTitle)}</div>` +
      (first ? `<div class="first">${esc(first.fair ?? first.text)}</div>` : "") +
      (xs.length ? `<div class="tags">${xs.map((x) => `<span class="tag" data-era-go="${h.seq}:${x.id}" title="${esc(headOf(x.last))}"><span class="sym">${esc(x.sym)}</span><span class="name">${esc(x.name)}</span>${roomTag(x)}<span class="status ${x.status}">${esc(L.status[x.status])}</span></span>`).join("")}</div>` : "") +
      (h.chat.length ? `<details><summary>${esc(L.historyChat(h.chat.length))}</summary><div class="lines">${lines}</div></details>` : "") + `</div>`;
  };
  $("#history").innerHTML = `<div class="bar"><span>${esc(L.historyHead)}</span>${iconBtn("data-history-close", ICON.close, L.historyClose)}</div>` +
    (eras.length ? eras.map(era).join("") : `<div class="empty">${esc(L.historyEmpty)}</div>`);
}

function render() {
  renderSettings();
  renderQuota();
  $("[data-undo]").hidden = !state.undo;
  renderRoom();
  renderChat();
  // 覗いていたセッションが一覧から外れていたら、一覧に戻る（renderPeek が peek を空にする）
  if (peek != null) renderPeek();
  if (peek == null) (hist ? renderHistory() : renderCards());
  $("#cards").hidden = peek != null || hist;
  $("#history").hidden = peek != null || !hist;
  $("#peek").hidden = peek == null;
}

function open(id) {
  peek = id;
  render();
  $("main").scrollTop = peek == null ? 0 : $("main").scrollHeight;
}

// web のリンクは、別ウィンドウ一枚を名前で使い回して開く（押すたびに窓やタブを増やさない。dyve を読み直しても同じ窓）。
// 使い回すには opener を残すしかない（切ると dyve から窓を移せない）。窓は前に出さない
function openView(url) {
  window.open(url, "dyve-view", "popup,width=1100,height=900");
}

// まとめた札の一覧は、外を押したら閉じる
document.addEventListener("click", (e) => {
  for (const d of document.querySelectorAll(".info .group[open]")) if (!d.contains(e.target)) d.open = false;
}, true);

document.addEventListener("click", (e) => {
  // 修飾キー付き・中ボタンは、ブラウザのいつもの開き方に任せる
  const w = e.target.closest('a[target="_blank"]');
  if (w && /^https?:/.test(w.href) && e.button === 0 && !(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey)) {
    e.preventDefault();
    return void openView(w.href);
  }
  // 手元のファイルの場所は、ブラウザでは開けないので dyve に開いてもらう
  const f = e.target.closest("a[data-open]");
  if (f) {
    e.preventDefault();
    // どのセッションの返事の中か（カードやチャットならその札、覗いた画面ならそのセッション）。相対の場所を探す手がかりにする
    const session = Number(f.closest("[data-go]")?.dataset.go ?? peek) || null;
    fetch("/api/open", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ path: f.dataset.open, session, ...(f.dataset.line ? { line: Number(f.dataset.line) } : {}), ...(f.dataset.col ? { col: Number(f.dataset.col) } : {}) }) })
      .then((r) => r.json()).then((r) => { $("#note").textContent = r.ok ? "" : L.openBad(r.message ?? ""); })
      .catch((err) => { $("#note").textContent = L.openBad(String(err)); });
    return;
  }
  if (e.target.closest("a")) return;
  const t = (sel) => e.target.closest(sel);
  // カードの中のボタンは、カードを開くより先に見る
  if (t("[data-stop]")) return void post("/api/stop", { session: Number(t("[data-stop]").dataset.stop) });
  if (t("[data-link-add]")) { linkRows.push({ pattern: "", url: "" }); return renderSettings(); }
  if (t("[data-link-del]")) { linkRows.splice(Number(t("[data-link-del]").dataset.linkDel), 1); renderSettings(); return saveLinks(); }
  // AI の返事を、描く前のマークダウンのままコピーする
  if (t("[data-copy-flow]")) {
    const [sid, i] = t("[data-copy-flow]").dataset.copyFlow.split(":").map(Number);
    return void copyText(ses(sid)?.flow[i]?.text ?? "");
  }
  if (t("[data-copy-code]")) return void copyText(t(".code").querySelector("code").textContent);
  // シェルを押したら、この場所で動かして結果をその下に出す
  if (t("[data-run]")) {
    const cmd = t(".code").querySelector("code").textContent;
    if (runs.get(cmd)?.busy) return;
    runs.set(cmd, { busy: true });
    render();
    const session = Number(t(".code").closest("[data-go]")?.dataset.go ?? peek) || null;
    fetch("/api/run", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ cmd, session }) })
      .then((r) => r.json()).catch((e) => ({ code: -1, out: String(e) }))
      .then((r) => {
        runs.set(cmd, { code: r.code ?? -1, out: r.out ?? r.message ?? "", session });
        render();
        // 設定が「自動で送る」なら、そのまま送る
        if (session != null && state.settings?.report === "auto") report(cmd);
      });
    return;
  }
  if (t("[data-report]")) return void report(t(".code").querySelector("code").textContent);
  // 質問：番号を押したら切り替え、選択肢を押したら選んでまだの次へ、送るでまとめて送る、× で下げる
  if (t("[data-qtab]")) {
    const b = t("[data-qtab]"), x = ses(Number(b.dataset.session));
    if (x?.asks) { const a = answerOf(x); a.at = Number(b.dataset.qtab); a.small = false; }
    return renderPeek();
  }
  if (t("[data-opt]")) {
    const b = t("[data-opt]"), x = ses(Number(b.dataset.session));
    if (!x?.asks) return;
    const a = answerOf(x), n = x.asks.questions.length;
    a.picked[a.at] = b.dataset.opt;
    const next = [...Array(n).keys()].find((i) => i > a.at && !a.picked[i]);
    if (next != null) a.at = next;
    return renderPeek();
  }
  if (t("[data-send]")) {
    const x = ses(Number(t("[data-send]").dataset.send));
    if (!x?.asks) return;
    const a = answerOf(x);
    return void post("/api/answer", { session: x.id, answers: Object.entries(a.picked).map(([q, v]) => ({ q: Number(q), a: v })) });
  }
  if (t("[data-mini]")) {
    const x = ses(Number(t("[data-mini]").dataset.mini));
    if (x?.asks) { const a = answerOf(x); a.small = !a.small; }
    return renderPeek();
  }
  if (t("[data-drop]")) return void post("/api/answer", { session: Number(t("[data-drop]").dataset.drop), answers: [] });
  if (t("[data-group]")) {
    const k = t("[data-group]").dataset.group;
    closedGroups.has(k) ? closedGroups.delete(k) : closedGroups.add(k);
    return renderPeek();
  }
  if (t("[data-fold]")) return void post("/api/fold", { session: Number(t("[data-fold]").dataset.fold), on: true });
  if (t("[data-unfold]")) return void post("/api/fold", { session: Number(t("[data-unfold]").dataset.unfold), on: false });
  if (t("[data-cancel]")) return void post("/api/cancel", { say: Number(t("[data-cancel]").dataset.cancel) });
  if (t("[data-to]")) {
    const b = t("[data-to]");
    moving = null;
    renderChat();
    return void post("/api/move", { say: Number(b.dataset.say), to: b.dataset.to === "new" ? "new" : Number(b.dataset.to) });
  }
  // 巻き戻しは、押すとその場で確かめる（ダイアログは出さない）
  if (t("[data-rewind-go]")) {
    const b = t("[data-rewind-go]");
    const [session, say] = b.dataset.rewindGo.split(":").map(Number);
    rewinding = null;
    renderPeek();
    return void fetch("/api/rewind", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ session, say, files: !!b.dataset.files }) })
      .then((r) => r.json()).then((r) => { $("#note").textContent = r.ok ? "" : L.rewindBad(r.message ?? ""); })
      .catch((err) => { $("#note").textContent = L.rewindBad(String(err)); });
  }
  if (t("[data-rewind]")) {
    const k = t("[data-rewind]").dataset.rewind;
    rewinding = rewinding === k ? null : k;
    return renderPeek();
  }
  if (t("[data-move]")) {
    const id = Number(t("[data-move]").dataset.move);
    moving = moving === id ? null : id;
    return renderChat();
  }
  const go = e.target.closest("[data-go]");
  if (go) return open(Number(go.dataset.go));
  if (e.target.closest("[data-close]")) open(null);
  if (t("[data-roomchip]")) { roomOpen = !roomOpen; return renderRoomPick(); }
  if (t("[data-room-pick]")) return void setRoom(t("[data-room-pick]").dataset.roomPick);
  // 履歴の会話に戻る（セッションを押したら、戻ってそのセッションを開く）
  if (t("[data-era]")) { hist = false; return void post("/api/restore", { era: Number(t("[data-era]").dataset.era) }).then(() => open(null)); }
  if (t("[data-era-go]")) {
    const [era, id] = t("[data-era-go]").dataset.eraGo.split(":").map(Number);
    hist = false;
    opening = id;
    return void post("/api/restore", { era }).then(openBack);
  }
  if (t("[data-history]") || t("[data-history-close]")) { hist = !hist && !t("[data-history-close]"); peek = null; return render(); }
  if (e.target.closest("[data-side]")) { layout.sideOff = !layout.sideOff; saveLayout(); return renderPeek(); }
  // リセットは確かめずに走らせる（記録は消えず、次に話すまでは「元に戻す」で戻せる）
  if (e.target.closest("[data-reset]")) post("/api/reset").then(() => open(null));
  if (t("[data-gear]")) { gear = !gear; return renderSettings(); }
  if (t("[data-set]")) {
    const b = t("[data-set]"), raw = b.dataset.value;
    // 値の形は設定ごと：数・真偽・文字
    const value = /^\d+$/.test(raw) ? Number(raw) : raw === "true" ? true : raw === "false" ? false : raw;
    return void post("/api/set", { key: b.dataset.set, value });
  }
  if (e.target.closest("[data-undo]")) post("/api/undo");
});
// 道具のまとまりを開け閉めしたら覚える（描き直しても閉じないように。toggle は泡立たないので捕まえる側で聞く）
document.addEventListener("toggle", (e) => {
  const k = e.target.dataset?.key;
  if (k) e.target.open ? opened.add(k) : opened.delete(k);
}, true);
document.addEventListener("keydown", (e) => {
  if (screenKey(e)) { e.preventDefault(); return; }
  if (e.key === "Escape" && roomOpen) { roomOpen = false; return renderRoomPick(); }
  if (e.key === "Escape" && peek != null) open(null);
  // 作業する場所の欄は Enter で変える（変換中の Enter は除く）
  if (e.key === "Enter" && !e.isComposing && e.target.matches?.("[data-room]")) { e.preventDefault(); setRoom(e.target.value); }
});
// リンクの決まりの欄：打ったものは書きかけに残し、欄を離れたら（または Enter で）置く
document.addEventListener("input", (e) => {
  const el = e.target.closest?.("[data-link]");
  if (el) linkRows[Number(el.dataset.link)][el.dataset.part] = el.value;
});
document.addEventListener("change", (e) => { if (e.target.closest?.("[data-link]")) saveLinks(); });

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    $("#note").textContent = L.copied;
  } catch {
    $("#note").textContent = L.copyFail;
  }
  setTimeout(() => { if ($("#note").textContent === L.copied) $("#note").textContent = ""; }, 1500);
}

function connect() {
  const es = new EventSource("/api/events");
  es.addEventListener("state", (e) => {
    state = JSON.parse(e.data);
    // リンクの決まりを作り直す（読めないものは飛ばす）
    LINK_RULES = (state.links ?? []).flatMap((r) => { try { return [{ re: new RegExp(r.pattern, "g"), url: r.url }]; } catch { return []; } });
    // 開いたときに終わっていたものには印を付けない
    if (first) for (const x of state.sessions) seen.set(x.id, x.endedAt);
    render();
    if (opening != null) openBack();
    first = false;
    if ($("#note").textContent === L.lost) $("#note").textContent = "";
  });
  es.onerror = () => { $("#note").textContent = L.lost; };
}

async function post(url, body = {}) {
  try {
    const r = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    return r.ok;
  } catch {
    return false;
  }
}

const say = (text) => post("/api/say", { text, ...(peek != null ? { peek } : {}) });

// 声と打鍵の見分け：入力の直前にキーが押されていればキーボード（OS の音声入力はキーを押さずに文字が入る）
// 声だけなら、間があいたら置く。書きかけに一文字でも打ったら、その書きかけは Enter まで待つ。欄が空になったら声に戻る
const input = {
  m: $("#input textarea"), timer: null, composing: false, sending: false, typed: false, lastKey: 0,
  listen() {
    const m = this.m;
    m.placeholder = L.placeholder;
    const byKey = () => Date.now() - this.lastKey < 300;
    m.addEventListener("keydown", (e) => {
      this.lastKey = Date.now();
      if (vimOn() && !e.isComposing && e.keyCode !== 229 && !e.metaKey && !e.ctrlKey && !e.altKey && this.vim(e)) return;
      if (isSendKey(e)) { e.preventDefault(); clearTimeout(this.timer); this.send(); }
    });
    m.addEventListener("focus", () => renderMode());
    m.addEventListener("blur", () => renderMode());
    m.addEventListener("input", () => {
      this.grow();
      if (!m.value.trim()) this.typed = false;
      else if (byKey()) this.typed = true;
      if (this.typed) clearTimeout(this.timer); else this.arm();
    });
    m.addEventListener("compositionstart", () => { this.composing = true; });
    m.addEventListener("compositionend", () => { this.composing = false; if (!byKey() && !this.typed) this.arm(); });
  },
  // vim：キーを vimKey に通し、使ったキーなら欄に当てる。使ったら true
  vs: { mode: "insert", pend: "", reg: "", undo: [] },
  vim(e) {
    const m = this.m;
    // Shift+Enter は改行のまま（挿入のとき）
    if (e.key === "Enter" && (e.shiftKey || this.vs.mode === "insert")) return false;
    const r = vimKey({ ...this.vs, text: m.value, pos: m.selectionStart }, e.key);
    if (!r.handled) return false;
    e.preventDefault();
    // 覗いた画面を閉じる Esc などに渡さない
    e.stopPropagation();
    const { text, pos, ...rest } = r.v;
    this.vs = rest;
    if (text !== m.value) {
      m.value = text;
      this.grow();
      this.typed = !!text.trim();
      clearTimeout(this.timer);
    }
    // ノーマルでは今の一文字を選んで、四角い印の代わりにする
    const block = rest.mode === "normal" && pos < text.length && text[pos] !== "\n";
    m.setSelectionRange(pos, block ? pos + 1 : pos);
    if (r.act === "send") { clearTimeout(this.timer); this.send(); }
    if (r.act === "leave") m.blur();
    renderMode();
    return true;
  },
  arm() {
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.send(), pauseMs());
  },
  async send() {
    const m = this.m;
    if (this.composing || this.sending) return this.arm();
    const raw = m.value, text = raw.trim();
    if (!text) return;
    this.sending = true;
    const t0 = Date.now();
    const ok = await say(text);
    this.sending = false;
    // 置けなかったら欄に残す（落とさない）。もう一度置くのは人が Enter で
    if (!ok) { $("#note").textContent = L.failed; return; }
    $("#note").textContent = "";
    // 置いているあいだに足されたぶんは残し、そのあいだにキーで打ったかで決め直す
    m.value = m.value.startsWith(raw) ? m.value.slice(raw.length).trimStart() : m.value;
    this.grow();
    this.typed = !!m.value.trim() && this.lastKey > t0;
    if (m.value.trim() && !this.typed) this.arm();
  },
  // 入力欄は一行から、書いたぶんだけ伸びる
  grow() {
    this.m.style.height = "auto";
    this.m.style.height = `${this.m.scrollHeight}px`;
  },
};

// 残り時間は載せたときに数え直す
$("#quota").addEventListener("mouseenter", renderQuota);
$("[data-gear]").title = L.gear;
$("[data-gear]").setAttribute("aria-label", L.gear);
$("[data-reset]").title = L.resetTitle;
$("[data-reset]").setAttribute("aria-label", L.reset);
$("[data-reset]").innerHTML = ICON.reset;
$("[data-undo]").title = L.undoTitle;
$("[data-undo]").setAttribute("aria-label", L.undo);
$("[data-undo]").innerHTML = ICON.undo;
$("[data-history]").innerHTML = ICON.history;
$("[data-history]").title = L.historyTitle;
$("[data-history]").setAttribute("aria-label", L.history);
// マイク：ブラウザの音声認識（Chrome など）。押すと聞きつづけ、ひと区切り確定するたびにすぐ置く。
// 途中経過は欄の末尾に出し、確定したら差し替える。書きかけにキーで打っていたら、Enter まで待つ
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = {
  el: $("#mic"), on: false, rec: null, interim: 0,
  setup() {
    if (!SR) return;
    this.el.hidden = false;
    this.show();
    this.el.addEventListener("click", () => (this.on ? this.stop() : this.start()));
  },
  show() {
    this.el.setAttribute("aria-pressed", String(this.on));
    this.el.title = this.on ? L.micOn : L.micOff;
    this.el.setAttribute("aria-label", this.el.title);
  },
  start() {
    const rec = new SR();
    rec.lang = "ja-JP";
    rec.continuous = true;
    rec.interimResults = true;
    this.interim = 0;
    rec.onresult = (ev) => {
      let fin = "", mid = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) fin += ev.results[i][0].transcript; else mid += ev.results[i][0].transcript;
      }
      const m = input.m;
      m.value = m.value.slice(0, Math.max(0, m.value.length - this.interim)) + fin + mid;
      this.interim = mid.length;
      input.grow();
      clearTimeout(input.timer);
      if (!fin || mid || input.typed) return;
      // 区切りごとにすぐ送るか、話が途切れるまでためてまとめて送るか（設定）
      if (state.settings?.send === "each") input.send(); else input.arm();
    };
    // 黙っていると止まるので、押されているあいだは聞き直す
    rec.onend = () => { if (this.on && this.rec === rec) rec.start(); };
    rec.onerror = (ev) => {
      if (ev.error === "not-allowed" || ev.error === "service-not-allowed") { this.stop(); $("#note").textContent = L.micDenied; }
    };
    this.rec = rec;
    this.on = true;
    this.show();
    rec.start();
  },
  stop() {
    this.on = false;
    this.rec?.stop();
    // ためていたものは、止めたときにすぐ送る
    if (input.m.value.trim() && !input.typed) { clearTimeout(input.timer); input.send(); }
    this.rec = null;
    this.interim = 0;
    this.show();
  },
};

input.listen();
mic.setup();
connect();
</script>
</body>
</html>
